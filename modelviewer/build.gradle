plugins { id 'com.android.application' }

android {
    namespace 'com.muhammetgecgil.modelviewer'
    compileSdk 36
    defaultConfig {
        applicationId 'com.muhammetgecgil.modelviewer.v120'
        minSdk 26
        targetSdk 36
        versionCode 13
        versionName '1.3.0'
    }
    signingConfigs {
        release {
            storeFile rootProject.file('modelviewer-debug.keystore')
            storePassword 'modelviewer'
            keyAlias 'modelviewer'
            keyPassword 'modelviewer'
        }
        debug {
            storeFile rootProject.file('modelviewer-debug.keystore')
            storePassword 'modelviewer'
            keyAlias 'modelviewer'
            keyPassword 'modelviewer'
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.debug }
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
