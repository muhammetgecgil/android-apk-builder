<!doctype html>
<html><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"/><title>MG 3D CAD Pro</title><style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030811;color:#e8f2ff;font-family:Arial,sans-serif}#c{position:absolute;inset:0;width:100%;height:100%;display:block}#top{position:absolute;left:0;right:0;top:0;min-height:52px;background:rgba(3,10,20,.94);display:flex;align-items:center;gap:6px;padding:5px 7px;z-index:8;border-bottom:1px solid #163453;overflow-x:auto}button,select,input{background:#0b1b2d;color:#eaf5ff;border:1px solid #245582;border-radius:8px;padding:7px 9px;font-weight:700}button.on{background:#174a70;border-color:#65c9ff}#name{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:120px;max-width:220px}#badge{color:#64c7ff;font-weight:800;white-space:nowrap}.panel{position:absolute;background:rgba(3,10,20,.92);border:1px solid #173c60;border-radius:12px;padding:9px;z-index:7;box-shadow:0 8px 24px rgba(0,0,0,.3)}#info{left:8px;bottom:8px;min-width:245px;max-width:330px}#tools{right:8px;top:66px;width:220px;max-height:calc(100% - 84px);overflow:auto}.row{display:flex;gap:5px;flex-wrap:wrap;margin:5px 0}.row button{flex:1;min-width:60px}.small{font-size:12px;line-height:1.45}.head{font-weight:800;color:#8bd8ff;margin:3px 0 6px}.sep{height:1px;background:#173c60;margin:8px 0}#parts{max-height:165px;overflow:auto}.part{padding:6px;border-radius:6px;margin:2px 0;background:#071525;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.part.sel{background:#174a70}.slider{width:100%;padding:0}#status{color:#64c7ff;font-size:12px;margin-top:5px}#busy{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#030811;z-index:15;font-size:18px;color:#64c7ff}.hide{display:none!important}#measure{color:#ffe08a;font-weight:700}
</style><script src="/three.min.js"></script><script src="/OrbitControls.js"></script><script src="/occt-import-js.js"></script></head><body><canvas id="c"></canvas>
<div id="top"><button onclick="closeApp()">←</button><span id="badge">MG CAD PRO</span><div id="name">Model</div><button onclick="fit()">SIĞDIR</button><button onclick="viewDir('iso')">ISO</button><button onclick="viewDir('front')">ÖN</button><button onclick="viewDir('top')">ÜST</button><button onclick="viewDir('right')">SAĞ</button><select id="unit" onchange="updateInfo()"><option value="mm">mm</option><option value="cm">cm</option><option value="m">m</option><option value="in">inch</option><option value="ft">ft</option></select></div>
<div id="info" class="panel"><div class="head">MODEL ANALİZİ</div><div id="dims" class="small">Ölçüler hazırlanıyor…</div><div id="measure" class="small"></div><div id="status">OpenCascade CAD motoru başlatılıyor…</div></div>
<div id="tools" class="panel"><div class="head">GÖRÜNÜM</div><div class="row"><button id="wireB" onclick="toggleWire()">TEL</button><button id="xrayB" onclick="toggleXray()">X-RAY</button><button onclick="toggleGrid()">GRID</button></div><div class="row"><button onclick="fitSelected()">SEÇİLENE SIĞDIR</button><button onclick="resetAll()">SIFIRLA</button></div><div class="sep"></div>
<div class="head">PARÇA</div><div class="row"><button onclick="hideSelected()">GİZLE</button><button onclick="isolateSelected()">İZOLE</button><button onclick="showAll()">TÜMÜ</button></div><div id="parts"></div><div class="sep"></div>
<div class="head">PATLATILMIŞ GÖRÜNÜM <span id="expv">0%</span></div><input id="explode" class="slider" type="range" min="0" max="100" value="0" oninput="applyExplode()"/><div class="sep"></div>
<div class="head">KESİT</div><div class="row"><button id="secB" onclick="toggleSection()">KESİT AÇ</button><select id="secAxis" onchange="applySection()"><option>X</option><option>Y</option><option>Z</option></select></div><input id="section" class="slider" type="range" min="0" max="100" value="50" oninput="applySection()"/><div class="sep"></div>
<div class="head">ÖLÇÜM</div><div class="row"><button id="mB" onclick="toggleMeasure()">2 NOKTA</button><button onclick="clearMeasure()">TEMİZLE</button></div><div class="small">Model üzerinde iki yüzey noktası seç. Mesafe ve ΔX/ΔY/ΔZ hesaplanır.</div></div>
<div id="busy">CAD dosyası işleniyor…</div>
<script>
const q=new URLSearchParams(location.search),fileType=(q.get('type')||'step').toLowerCase(),fileName=q.get('name')||'CAD Model';document.getElementById('name').textContent=fileName;
const canvas=document.getElementById('c'),renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:false});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setClearColor(0x030811,1);renderer.outputEncoding=THREE.sRGBEncoding;renderer.localClippingEnabled=true;
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(45,1,.01,1000000);camera.position.set(4,3,5);const controls=new THREE.OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.dampingFactor=.08;scene.add(new THREE.HemisphereLight(0xcce8ff,0x18202a,1.2));const dl=new THREE.DirectionalLight(0xffffff,1.25);dl.position.set(4,7,5);scene.add(dl);const dl2=new THREE.DirectionalLight(0x5da8ff,.55);dl2.position.set(-5,-2,-3);scene.add(dl2);
const grid=new THREE.GridHelper(20,20,0x1e5b8e,0x0e2b46);scene.add(grid);const axes=new THREE.AxesHelper(2.5);scene.add(axes);const group=new THREE.Group();scene.add(group);
let bbox=null,baseDims={x:0,y:0,z:0},partCount=0,triCount=0,totalArea=0,totalVolume=0,wire=false,xray=false,selected=null,sectionOn=false,measureOn=false,picks=[],markers=[],measureLine=null;const clipPlane=new THREE.Plane(new THREE.Vector3(1,0,0),0),ray=new THREE.Raycaster(),mouse=new THREE.Vector2();
function resize(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}addEventListener('resize',resize);resize();function animate(){requestAnimationFrame(animate);controls.update();renderer.render(scene,camera)}animate();function closeApp(){if(window.AndroidHost)AndroidHost.closeViewer();else history.back()}
function unitFactor(){const u=document.getElementById('unit').value;return u==='cm'?.1:u==='m'?.001:u==='in'?1/25.4:u==='ft'?1/304.8:1}function fmt(v){v*=unitFactor();return Math.abs(v)>=1000?v.toFixed(1):Math.abs(v)>=100?v.toFixed(2):v.toFixed(3)}
function updateInfo(){const u=document.getElementById('unit').value,af=unitFactor()*unitFactor(),vf=af*unitFactor();document.getElementById('dims').innerHTML='<b>DIŞ ÖLÇÜLER</b><br>X '+fmt(baseDims.x)+' '+u+' &nbsp; Y '+fmt(baseDims.y)+' '+u+' &nbsp; Z '+fmt(baseDims.z)+' '+u+'<br>Parça '+partCount+' • Üçgen '+triCount+'<br>Yakl. yüzey alanı '+(totalArea*af).toFixed(2)+' '+u+'²<br>Yakl. kapalı hacim '+(Math.abs(totalVolume)*vf).toFixed(2)+' '+u+'³'+(selected?'<br>Seçili: <b>'+esc(selected.name)+'</b>':'');updateMeasureText()}
function esc(s){return String(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function fitBox(b){if(!b||b.isEmpty())return;const s=new THREE.Sphere();b.getBoundingSphere(s);const fov=camera.fov*Math.PI/180;let d=s.radius/Math.sin(fov/2);if(!isFinite(d)||d<1)d=3;camera.position.copy(s.center).add(new THREE.Vector3(1,.75,1).normalize().multiplyScalar(d*1.2));camera.near=Math.max(d/10000,.001);camera.far=Math.max(d*100,1000);camera.updateProjectionMatrix();controls.target.copy(s.center);controls.update()}
function fit(){fitBox(bbox);if(bbox)grid.position.y=bbox.min.y-Math.max(baseDims.y*.08,.01)}function fitSelected(){if(selected)fitBox(new THREE.Box3().setFromObject(selected));else fit()}
function viewDir(v){if(!bbox)return;const s=new THREE.Sphere();bbox.getBoundingSphere(s);const d=Math.max(s.radius*3,1);let dir=v==='front'?new THREE.Vector3(0,0,1):v==='top'?new THREE.Vector3(0,1,0):v==='right'?new THREE.Vector3(1,0,0):new THREE.Vector3(1,.75,1).normalize();camera.position.copy(s.center).add(dir.multiplyScalar(d));camera.up.set(0,1,0);if(v==='top')camera.up.set(0,0,-1);controls.target.copy(s.center);camera.lookAt(s.center);controls.update()}
function toggleWire(){wire=!wire;document.getElementById('wireB').classList.toggle('on',wire);group.traverse(o=>{if(o.isMesh){o.material.wireframe=wire;o.material.needsUpdate=true}})}function toggleXray(){xray=!xray;document.getElementById('xrayB').classList.toggle('on',xray);group.traverse(o=>{if(o.isMesh){o.material.transparent=xray;o.material.opacity=xray?.28:1;o.material.depthWrite=!xray;o.material.needsUpdate=true}})}function toggleGrid(){grid.visible=!grid.visible;axes.visible=grid.visible}
function selectMesh(m){if(selected&&selected.material&&selected.userData.baseEm!==undefined)selected.material.emissive.setHex(selected.userData.baseEm);selected=m;if(selected){selected.userData.baseEm=selected.material.emissive.getHex();selected.material.emissive.setHex(0x154f72)}document.querySelectorAll('.part').forEach(x=>x.classList.toggle('sel',selected&&x.dataset.id===String(selected.id)));updateInfo()}
function hideSelected(){if(selected){selected.visible=false;selectMesh(null)}}function isolateSelected(){if(!selected)return;group.children.forEach(m=>m.visible=m===selected)}function showAll(){group.children.forEach(m=>m.visible=true)}
function buildParts(){const p=document.getElementById('parts');p.innerHTML='';group.children.forEach((m,i)=>{const d=document.createElement('div');d.className='part';d.dataset.id=m.id;d.textContent=(i+1)+'. '+m.name;d.onclick=()=>selectMesh(m);p.appendChild(d)})}
function applyExplode(){if(!bbox)return;const t=+document.getElementById('explode').value/100;document.getElementById('expv').textContent=Math.round(t*100)+'%';const c=new THREE.Vector3();bbox.getCenter(c),mag=Math.max(baseDims.x,baseDims.y,baseDims.z)*.65*t;group.children.forEach(m=>{const mc=m.userData.center.clone(),dir=mc.sub(c);if(dir.lengthSq()<1e-9)dir.set((m.id%3)-1,((m.id+1)%3)-1,((m.id+2)%3)-1);dir.normalize();m.position.copy(m.userData.basePos).add(dir.multiplyScalar(mag))})}
function toggleSection(){sectionOn=!sectionOn;document.getElementById('secB').classList.toggle('on',sectionOn);document.getElementById('secB').textContent=sectionOn?'KESİT KAPAT':'KESİT AÇ';applySection()}
function applySection(){if(!bbox)return;const a=document.getElementById('secAxis').value,t=+document.getElementById('section').value/100,min=a==='X'?bbox.min.x:a==='Y'?bbox.min.y:bbox.min.z,max=a==='X'?bbox.max.x:a==='Y'?bbox.max.y:bbox.max.z,pos=min+(max-min)*t;clipPlane.normal.set(a==='X'?1:0,a==='Y'?1:0,a==='Z'?1:0);clipPlane.constant=-pos;group.traverse(o=>{if(o.isMesh){o.material.clippingPlanes=sectionOn?[clipPlane]:[];o.material.clipShadows=false;o.material.needsUpdate=true}})}
function resetAll(){showAll();selectMesh(null);document.getElementById('explode').value=0;applyExplode();if(sectionOn)toggleSection();if(xray)toggleXray();if(wire)toggleWire();clearMeasure();fit()}
function meshMetrics(g){const p=g.attributes.position;if(!p)return{area:0,vol:0};const idx=g.index;let area=0,vol=0;const A=new THREE.Vector3(),B=new THREE.Vector3(),C=new THREE.Vector3(),ab=new THREE.Vector3(),ac=new THREE.Vector3(),cr=new THREE.Vector3();const tri=idx?idx.count/3:p.count/3;for(let k=0;k<tri;k++){const ia=idx?idx.getX(k*3):k*3,ib=idx?idx.getX(k*3+1):k*3+1,ic=idx?idx.getX(k*3+2):k*3+2;A.fromBufferAttribute(p,ia);B.fromBufferAttribute(p,ib);C.fromBufferAttribute(p,ic);ab.subVectors(B,A);ac.subVectors(C,A);cr.crossVectors(ab,ac);area+=.5*cr.length();vol+=A.dot(new THREE.Vector3().crossVectors(B,C))/6}return{area,vol}}
function addMesh(m){const pa=m.attributes&&m.attributes.position&&m.attributes.position.array;if(!pa||pa.length<9)return;const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pa,3));const na=m.attributes&&m.attributes.normal&&m.attributes.normal.array;if(na&&na.length===pa.length)g.setAttribute('normal',new THREE.Float32BufferAttribute(na,3));else g.computeVertexNormals();if(m.index&&m.index.array&&m.index.array.length){g.setIndex(m.index.array);triCount+=Math.floor(m.index.array.length/3)}else triCount+=Math.floor(pa.length/9);let col=0x69aee8;if(m.color&&m.color.length>=3)col=new THREE.Color(m.color[0],m.color[1],m.color[2]);const mat=new THREE.MeshStandardMaterial({color:col,metalness:.16,roughness:.57,side:THREE.DoubleSide,clippingPlanes:[]});const mesh=new THREE.Mesh(g,mat);mesh.name=m.name||('Part '+(partCount+1));g.computeBoundingBox();g.boundingBox.getCenter(mesh.userData.center=new THREE.Vector3());mesh.userData.basePos=mesh.position.clone();const met=meshMetrics(g);mesh.userData.area=met.area;mesh.userData.volume=met.vol;totalArea+=met.area;totalVolume+=met.vol;group.add(mesh);partCount++}
function pointer(ev){const r=canvas.getBoundingClientRect();mouse.x=((ev.clientX-r.left)/r.width)*2-1;mouse.y=-((ev.clientY-r.top)/r.height)*2+1;ray.setFromCamera(mouse,camera);return ray.intersectObjects(group.children.filter(x=>x.visible),false)}
canvas.addEventListener('click',ev=>{if(ev.clientY<58)return;const hit=pointer(ev);if(!hit.length)return;if(measureOn){addPick(hit[0].point);return}selectMesh(hit[0].object)});
function toggleMeasure(){measureOn=!measureOn;document.getElementById('mB').classList.toggle('on',measureOn);controls.enableRotate=!measureOn;if(!measureOn&&picks.length<2)clearMeasure()}
function addPick(p){if(picks.length>=2)clearMeasure();picks.push(p.clone());const r=Math.max(baseDims.x,baseDims.y,baseDims.z)*.008||.5,s=new THREE.Mesh(new THREE.SphereGeometry(r,14,10),new THREE.MeshBasicMaterial({color:0xffd34d,depthTest:false}));s.position.copy(p);scene.add(s);markers.push(s);if(picks.length===2){const g=new THREE.BufferGeometry().setFromPoints(picks),mat=new THREE.LineBasicMaterial({color:0xffd34d,depthTest:false});measureLine=new THREE.Line(g,mat);scene.add(measureLine);updateMeasureText();measureOn=false;document.getElementById('mB').classList.remove('on');controls.enableRotate=true}}
function updateMeasureText(){const e=document.getElementById('measure'),u=document.getElementById('unit').value;if(picks.length===1)e.textContent='Ölçüm: ikinci noktayı seç';else if(picks.length===2){const d=picks[0].distanceTo(picks[1]),dx=Math.abs(picks[1].x-picks[0].x),dy=Math.abs(picks[1].y-picks[0].y),dz=Math.abs(picks[1].z-picks[0].z);e.innerHTML='MESAFE '+fmt(d)+' '+u+'<br>ΔX '+fmt(dx)+' • ΔY '+fmt(dy)+' • ΔZ '+fmt(dz)+' '+u}else e.textContent=''}
function clearMeasure(){picks=[];markers.forEach(x=>{scene.remove(x);x.geometry.dispose();x.material.dispose()});markers=[];if(measureLine){scene.remove(measureLine);measureLine.geometry.dispose();measureLine.material.dispose();measureLine=null}updateMeasureText()}
async function main(){try{document.getElementById('status').textContent='OpenCascade WebAssembly yükleniyor…';const occt=await occtimportjs({locateFile:p=>'/'+p});document.getElementById('status').textContent='CAD topolojisi işleniyor…';const ab=await fetch('/model.bin',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('Dosya okunamadı');return r.arrayBuffer()});const data=new Uint8Array(ab),params={linearUnit:'millimeter',linearDeflectionType:'bounding_box_ratio',linearDeflection:.0007,angularDeflection:.35};let result;if(fileType==='iges'||fileType==='igs')result=occt.ReadIgesFile(data,params);else if(fileType==='brep'||fileType==='brp')result=occt.ReadBrepFile(data,null);else result=occt.ReadStepFile(data,params);if(!result||!result.success)throw Error('CAD içe aktarma başarısız');(result.meshes||[]).forEach(addMesh);if(group.children.length===0)throw Error('Görüntülenecek yüzey bulunamadı');bbox=new THREE.Box3().setFromObject(group);const sz=new THREE.Vector3();bbox.getSize(sz);baseDims={x:sz.x,y:sz.y,z:sz.z};const max=Math.max(sz.x,sz.y,sz.z,1);grid.scale.setScalar(max/10);axes.scale.setScalar(max/10);buildParts();fit();updateInfo();document.getElementById('status').textContent=fileType.toUpperCase()+' • '+partCount+' parça • CAD Pro • cihaz içinde işlendi';document.getElementById('busy').style.display='none'}catch(e){document.getElementById('busy').style.display='none';document.getElementById('status').textContent='Hata: '+(e&&e.message?e.message:e);document.getElementById('dims').textContent='CAD dosyası açılamadı';console.error(e)}}main();
</script></body></html>
