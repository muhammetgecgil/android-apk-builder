<!doctype html>
<html><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"/><title>MG 3D CAD Viewer</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030811;color:#e8f2ff;font-family:Arial,sans-serif}#c{position:absolute;inset:0;width:100%;height:100%;display:block}#top{position:absolute;left:0;right:0;top:0;height:56px;background:rgba(3,10,20,.92);display:flex;align-items:center;gap:8px;padding:0 10px;z-index:5;border-bottom:1px solid #163453}button,select{background:#0b1b2d;color:#eaf5ff;border:1px solid #245582;border-radius:9px;padding:8px 10px;font-weight:700}#name{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}#panel{position:absolute;left:10px;bottom:10px;min-width:250px;background:rgba(3,10,20,.90);border:1px solid #173c60;border-radius:12px;padding:10px;z-index:5}#dims{font-size:14px;line-height:1.55}#status{color:#64c7ff;font-size:12px;margin-top:5px}#badge{color:#64c7ff;font-weight:700}#busy{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#030811;z-index:9;font-size:18px;color:#64c7ff}</style><script src="/three.min.js"></script><script src="/OrbitControls.js"></script><script src="/occt-import-js.js"></script></head><body><canvas id="c"></canvas><div id="top"><button onclick="closeApp()">←</button><span id="badge">MG CAD</span><div id="name">Model</div><button onclick="fit()">MERKEZ</button><button onclick="toggleWire()">TEL</button><select id="unit" onchange="updateDims()"><option value="mm">mm</option><option value="cm">cm</option><option value="m">m</option><option value="in">inch</option><option value="ft">ft</option></select></div><div id="panel"><div id="dims">Ölçüler hazırlanıyor…</div><div id="status">OpenCascade CAD motoru başlatılıyor…</div></div><div id="busy">CAD dosyası işleniyor…</div><script>
const q=new URLSearchParams(location.search),fileType=(q.get('type')||'step').toLowerCase(),fileName=q.get('name')||'CAD Model';document.getElementById('name').textContent=fileName;const canvas=document.getElementById('c'),renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:false});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setClearColor(0x030811,1);renderer.outputEncoding=THREE.sRGBEncoding;const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(45,1,.01,1000000);camera.position.set(4,3,5);const controls=new THREE.OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.dampingFactor=.08;scene.add(new THREE.HemisphereLight(0xcce8ff,0x18202a,1.25));const dl=new THREE.DirectionalLight(0xffffff,1.3);dl.position.set(4,7,5);scene.add(dl);const dl2=new THREE.DirectionalLight(0x5da8ff,.6);dl2.position.set(-5,-2,-3);scene.add(dl2);const grid=new THREE.GridHelper(20,20,0x1e5b8e,0x0e2b46);scene.add(grid);const axes=new THREE.AxesHelper(2.5);scene.add(axes);const group=new THREE.Group();scene.add(group);let bbox=null,wire=false,baseDims={x:0,y:0,z:0},partCount=0,triCount=0;
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}addEventListener('resize',resize);resize();function animate(){requestAnimationFrame(animate);controls.update();renderer.render(scene,camera)}animate();function closeApp(){if(window.AndroidHost)AndroidHost.closeViewer();else history.back()}function fit(){if(!bbox)return;const s=new THREE.Sphere();bbox.getBoundingSphere(s);const fov=camera.fov*Math.PI/180;let d=s.radius/Math.sin(fov/2);if(!isFinite(d)||d<1)d=3;const dir=new THREE.Vector3(1,.75,1).normalize();camera.position.copy(s.center).add(dir.multiplyScalar(d*1.2));camera.near=Math.max(d/10000,.001);camera.far=Math.max(d*100,1000);camera.updateProjectionMatrix();controls.target.copy(s.center);controls.update();grid.position.y=bbox.min.y-Math.max(baseDims.y*.08,.01)}function toggleWire(){wire=!wire;group.traverse(o=>{if(o.isMesh){o.material.wireframe=wire;o.material.needsUpdate=true}})}function conv(v,u){if(u==='cm')return v/10;if(u==='m')return v/1000;if(u==='in')return v/25.4;if(u==='ft')return v/304.8;return v}function fmt(v){if(Math.abs(v)>=1000)return v.toFixed(1);if(Math.abs(v)>=100)return v.toFixed(2);return v.toFixed(3)}function updateDims(){const u=document.getElementById('unit').value;document.getElementById('dims').innerHTML='<b>OTOMATİK DIŞ ÖLÇÜLER</b><br>X = '+fmt(conv(baseDims.x,u))+' '+u+'<br>Y = '+fmt(conv(baseDims.y,u))+' '+u+'<br>Z = '+fmt(conv(baseDims.z,u))+' '+u+'<br>Parça/Mesh = '+partCount+'<br>Üçgen = '+triCount}function addMesh(m){const pa=m.attributes&&m.attributes.position&&m.attributes.position.array;if(!pa||pa.length<9)return;const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pa,3));const na=m.attributes&&m.attributes.normal&&m.attributes.normal.array;if(na&&na.length===pa.length)g.setAttribute('normal',new THREE.Float32BufferAttribute(na,3));else g.computeVertexNormals();if(m.index&&m.index.array&&m.index.array.length){g.setIndex(m.index.array);triCount+=Math.floor(m.index.array.length/3)}else triCount+=Math.floor(pa.length/9);let col=0x69aee8;if(m.color&&m.color.length>=3)col=new THREE.Color(m.color[0],m.color[1],m.color[2]);const mat=new THREE.MeshStandardMaterial({color:col,metalness:.18,roughness:.58,side:THREE.DoubleSide});const mesh=new THREE.Mesh(g,mat);mesh.name=m.name||'Part';group.add(mesh);partCount++}
async function main(){try{document.getElementById('status').textContent='OpenCascade WebAssembly yükleniyor…';const occt=await occtimportjs({locateFile:p=>'/'+p});document.getElementById('status').textContent='Dosya okunuyor…';const ab=await fetch('/model.bin',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('Dosya okunamadı');return r.arrayBuffer()});const data=new Uint8Array(ab),params={linearUnit:'millimeter',linearDeflectionType:'bounding_box_ratio',linearDeflection:.001,angularDeflection:.5};let result;if(fileType==='iges'||fileType==='igs')result=occt.ReadIgesFile(data,params);else if(fileType==='brep'||fileType==='brp')result=occt.ReadBrepFile(data,null);else result=occt.ReadStepFile(data,params);if(!result||!result.success)throw Error('CAD içe aktarma başarısız');(result.meshes||[]).forEach(addMesh);if(group.children.length===0)throw Error('Görüntülenecek yüzey bulunamadı');bbox=new THREE.Box3().setFromObject(group);const sz=new THREE.Vector3();bbox.getSize(sz);baseDims={x:sz.x,y:sz.y,z:sz.z};const max=Math.max(sz.x,sz.y,sz.z,1);grid.scale.setScalar(max/10);axes.scale.setScalar(max/10);fit();updateDims();document.getElementById('status').textContent=fileType.toUpperCase()+' • '+partCount+' parça • cihaz içinde işlendi';document.getElementById('busy').style.display='none'}catch(e){document.getElementById('busy').style.display='none';document.getElementById('status').textContent='Hata: '+(e&&e.message?e.message:e);document.getElementById('dims').textContent='CAD dosyası açılamadı';console.error(e)}}main();
</script></body></html>
