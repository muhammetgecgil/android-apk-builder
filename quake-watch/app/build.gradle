plugins { id 'com.android.application' }

android {
    namespace 'com.mg.quakewatch'
    compileSdk 35

    signingConfigs {
        stableUpdate {
            storeFile file('../keystore/quakewatch-release.jks')
            storePassword 'quakewatch123'
            keyAlias 'quakewatch'
            keyPassword 'quakewatch123'
        }
    }

    defaultConfig {
        applicationId 'com.mg.quakewatch'
        minSdk 26
        targetSdk 35
        versionCode 24
        versionName '3.0.4'
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.stableUpdate
        }
    }
}
