plugins { id 'com.android.application' }

android {
    namespace 'com.mg.machineelementspro'
    compileSdk 35

    defaultConfig {
        applicationId 'com.mg.machineelementspro'
        minSdk 26
        targetSdk 35
        versionCode 16
        versionName '2.5.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
    testImplementation 'junit:junit:4.13.2'
}
