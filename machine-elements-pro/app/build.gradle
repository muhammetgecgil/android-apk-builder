plugins { id 'com.android.application' }

android {
    namespace 'com.mg.machineelementspro'
    compileSdk 35

    defaultConfig {
        applicationId 'com.mg.machineelementspro'
        minSdk 26
        targetSdk 35
        versionCode 12
        versionName '2.1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
