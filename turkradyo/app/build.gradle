plugins {
    id 'com.android.application'
}

def releaseKeystorePath = System.getenv('TURKRADYO_KEYSTORE_FILE')
def releaseStorePassword = System.getenv('TURKRADYO_STORE_PASSWORD')
def releaseKeyAlias = System.getenv('TURKRADYO_KEY_ALIAS')
def releaseKeyPassword = System.getenv('TURKRADYO_KEY_PASSWORD')
def hasStableSigning = releaseKeystorePath && releaseStorePassword && releaseKeyAlias && releaseKeyPassword && file(releaseKeystorePath).exists()

android {
    namespace 'com.muhammetgecgil.turkradyo'
    compileSdk 36

    defaultConfig {
        applicationId 'com.muhammetgecgil.turkradyo'
        minSdk 26
        targetSdk 36
        versionCode 303
        versionName '2.9.3'
    }

    signingConfigs {
        stableRelease {
            if (hasStableSigning) {
                storeFile file(releaseKeystorePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all {
            jvmArgs '--add-opens=java.base/java.lang=ALL-UNNAMED',
                    '--add-opens=java.base/java.util=ALL-UNNAMED',
                    '--add-opens=java.base/java.io=ALL-UNNAMED',
                    '--add-opens=java.base/java.net=ALL-UNNAMED',
                    '--add-opens=java.base/java.security=ALL-UNNAMED',
                    '--add-opens=java.base/java.text=ALL-UNNAMED',
                    '--add-opens=java.base/jdk.internal.access=ALL-UNNAMED'
        }
    }

    lint {
        abortOnError true
    }

    buildTypes {
        debug {
            // Install test builds alongside the user's signed production app.
            applicationIdSuffix '.test.v303'
            versionNameSuffix '-test'
        }
        release {
            if (hasStableSigning) {
                signingConfig signingConfigs.stableRelease
            }
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.17'
    implementation 'androidx.media3:media3-exoplayer:1.11.0'
    implementation 'androidx.media3:media3-exoplayer-hls:1.11.0'
}
