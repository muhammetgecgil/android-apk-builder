<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Muhammet Türk Radyo</title><style>
:root{--bg:#07070b;--bg2:#120810;--card:#15121a;--card2:#21131c;--line:#4a2b3b;--red:#ff3647;--red2:#bb1f34;--text:#fff;--muted:#a99da7}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 18%,#350910 0,#120810 32%,#07070b 68%);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}.app{max-width:760px;margin:auto;padding:calc(18px + env(safe-area-inset-top)) 18px calc(116px + env(safe-area-inset-bottom))}.top{display:flex;align-items:center;justify-content:space-between}.round{width:52px;height:52px;border-radius:50%;border:1px solid var(--line);background:#121017;color:#fff;font-size:24px;box-shadow:0 0 22px #ff364722}.live{border:1px solid #5a2330;border-radius:17px;padding:10px 18px;font-weight:800;letter-spacing:.5px;background:#130b10}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--red);box-shadow:0 0 14px var(--red);margin-left:8px}.hero{margin-top:16px;text-align:center}.wave{height:235px;position:relative;display:grid;place-items:center}.wave:before,.wave:after{content:"";position:absolute;left:0;right:0;top:50%;height:2px;background:linear-gradient(90deg,transparent,var(--red),transparent);box-shadow:0 0 18px var(--red)}.wave:after{height:90px;top:31%;opacity:.42;filter:blur(2px);background:repeating-linear-gradient(90deg,transparent 0 7px,var(--red) 8px 10px,transparent 11px 17px)}.logo{z-index:2;width:205px;height:205px;border-radius:50%;border:6px solid #b4a7ab;outline:3px solid var(--red2);background:radial-gradient(circle at 45% 35%,#52212a,#1a0c12 58%,#060608);box-shadow:0 0 28px #ff364777,inset 0 0 30px #ff364733;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:1000;line-height:.88;font-size:36px;text-shadow:0 2px 0 #000}.logo small{font-size:24px}.name{font-weight:1000;font-size:30px;letter-spacing:1px;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{margin-top:8px;color:#bbb0b8;font-size:14px;min-height:20px}.freq{display:inline-block;margin-top:10px;border:1px solid #372b33;border-radius:999px;padding:5px 14px;color:#bfb6bd;font-size:12px}.controls{display:grid;grid-template-columns:1fr 1.2fr 1fr;gap:28px;align-items:center;margin:22px auto 8px;max-width:420px}.ctrl{height:70px;border-radius:50%;border:1px solid #702335;background:#110d13;color:#fff;font-size:28px;box-shadow:inset 0 0 15px #000}.ctrl.play{height:92px;border:2px solid var(--red);box-shadow:0 0 28px #ff364744,inset 0 0 18px #7c1c30;font-size:35px}.vol{display:flex;align-items:center;gap:10px;margin:18px 8px}.vol input{flex:1;accent-color:var(--red)}.actions{display:grid;grid-template-columns:1fr 1.2fr 1fr;gap:10px}.action{border:1px solid #4a2b3b;background:linear-gradient(180deg,#1b151d,#100d12);color:#fff;border-radius:20px;padding:15px 8px;font-weight:900}.action span{display:block;font-size:9px;color:#a79ca5;margin-top:4px}.modes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:22px}.mode{min-height:84px;border:1px solid #3c2833;background:#141118;color:#fff;border-radius:20px;padding:10px 5px;font-size:10px;font-weight:800}.mode b{display:block;font-size:25px;color:#ff5b68;margin-bottom:6px}.mini{margin-top:18px;border:1px solid #35242d;background:#100d12;border-radius:24px;padding:12px;display:grid;grid-template-columns:52px 1fr 44px;gap:10px;align-items:center}.miniLogo{width:52px;height:52px;border-radius:50%;border:2px solid #aa3848;display:grid;place-items:center;font-weight:1000;font-size:9px}.mini strong{font-size:14px}.mini small{display:block;color:var(--red);margin-bottom:2px}.mini button{width:42px;height:42px;border-radius:50%;border:1px solid #6c2c3a;background:#151017;color:#fff}.bottom{position:fixed;left:50%;bottom:8px;transform:translateX(-50%);width:min(740px,calc(100% - 18px));display:grid;grid-template-columns:repeat(4,1fr);padding:7px;border:1px solid #34313c;border-radius:22px;background:#0f0f15eF;backdrop-filter:blur(16px);z-index:20}.bottom button{border:0;background:transparent;color:#a9a8af;padding:9px 2px;font-size:10px}.bottom button.active{color:#ff5261}.bottom b{display:block;font-size:22px;margin-bottom:4px}.sheet{position:fixed;inset:0;background:#000b;display:none;z-index:50;padding:55px 14px 16px}.sheet.show{display:block}.panel{max-width:720px;height:100%;margin:auto;border:1px solid #4a2b3b;border-radius:26px;background:#0d0b10;padding:16px;overflow:auto}.sheetTop{display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;background:#0d0b10;padding-bottom:10px;z-index:3}.sheetTop h2{margin:0}.close{border:1px solid #51303e;background:#171119;color:#fff;border-radius:14px;padding:10px 14px}.search{width:100%;padding:13px;border-radius:15px;border:1px solid #432c37;background:#151117;color:#fff;margin:8px 0 12px}.list{display:flex;flex-direction:column;gap:8px}.item{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;padding:10px;border:1px solid #33242c;border-radius:17px;background:#141017}.item.active{border-color:var(--red)}.num{width:42px;height:42px;border-radius:13px;background:#21121a;display:grid;place-items:center;color:#ff6a76;font-weight:900}.itName{font-weight:800}.itSub{font-size:9px;color:#9f949c;margin-top:4px}.fav{border:0;background:transparent;color:#ff5261;font-size:21px}.empty{text-align:center;color:#998e96;padding:30px}.toast{position:fixed;left:50%;bottom:105px;transform:translate(-50%,150px);transition:.25s;z-index:70;background:#17151b;border:1px solid #49303b;border-radius:13px;padding:10px 14px;font-size:11px}.toast.show{transform:translate(-50%,0)}@media(max-width:430px){.app{padding-left:12px;padding-right:12px}.wave{height:210px}.logo{width:180px;height:180px}.name{font-size:25px}.actions{gap:7px}.action{font-size:12px}.modes{grid-template-columns:repeat(4,1fr)}.mode{font-size:9px}.controls{gap:20px}}
</style></head><body><div class="app"><div class="top"><button class="round" id="menuBtn">☰</button><div class="live">▣ CANLI YAYIN <i class="dot"></i></div><button class="round" id="settingsBtn">⚙</button></div><section class="hero"><div class="wave"><div class="logo">POWER<small>TÜRK FM</small></div></div><div class="name" id="now">POWER TÜRK FM</div><div class="meta" id="meta">Türkiye'nin En Güçlü Hit Radyosu</div><div class="freq" id="freq">İSTANBUL • CANLI</div><div class="controls"><button class="ctrl" id="prev">⏮</button><button class="ctrl play" id="play">▶</button><button class="ctrl" id="next">⏭</button></div><div class="vol"><span>🔈</span><input id="volume" type="range" min="0" max="1" value="1" step="0.05"><span>🔊</span></div><div class="actions"><button class="action" id="prev2">‹ GERİ<span>ÖNCEKİ RADYO</span></button><button class="action" id="shazam">◉ SHAZAM<span>ŞARKIYI BUL</span></button><button class="action" id="next2">İLERİ ›<span>SONRAKİ RADYO</span></button></div></section><div class="modes"><button class="mode" data-mode="favorites"><b>♥</b>FAVORİLER</button><button class="mode" data-mode="recent"><b>◷</b>YAKINDA ÇALANLAR</button><button class="mode" data-mode="top"><b>♛</b>TOP 20</button><button class="mode" data-mode="similar"><b>≈</b>BENZER RADYOLAR</button><button class="mode" data-mode="themes"><b>◒</b>TEMALAR</button><button class="mode" data-mode="eq"><b>☷</b>EŞıTLEYİC</button><button class="mode" data-mode="all"><b>♦</b>TÜM RADYOLAR</button></div><div class="mini"><div class="miniLogo">TÜRK<br>RADYO</div><div><small>şu anda çalıyor</small><strong id="miniName">POWER TÜRK FM</strong><span id="miniState" style="display:block;color:#9d929a;font-size:10px">Hazır</span></div><button id="miniPlay">▶</button></div></div><nav class="bottom"><button class="active" data-nav="home"><b>⌂</b>ANA SAYFA</button><button data-nav="discover"><b>⌕</b>KEŞFET</button><button data-nav="favorites"><b>♡</b>FAVORİLER</button><button data-nav="settings"><b>⚙</b>AYARLAR</button></nav><div class="sheet" id="sheet"><div class="panel"><div class="sheetTop"><h2 id="sheetTitle">Radyolar</h2><button class="close" id="closeSheet">Kapat</button></div><input class="search" id="search" placeholder="80 radyo içinde ara…"><div class="list" id="list"></div></div></div><div class="toast" id="toast"></div><script>
const $=s=>document.querySelector(s),API=['https://de1.api.radio-browser.info','https://fi1.api.radio-browser.info','https://nl1.api.radio-browser.info'];const BAD=/kurd|kürt|kurdish|kurdi|zaza|zazaki|sorani|kurman/i;let stations=[],index=-1,playing=false,paused=false,currentMode='all',favs=JSON.parse(localStorage.favs||'[]'),recent=JSON.parse(localStorage.recent||'[]');const key=s=>s.stationuuid||s.name;function native(u){let f=document.getElementById('bridge');if(!f){f=document.createElement('iframe');f.id='bridge';f.style.display='none';document.body.appendChild(f)}f.src='about:blank';setTimeout(()=>f.src=u,0)}function toast(t){$('#toast').textContent=t;$('#toast').classList.add('show');setTimeout(()=>$('#toast').classList.remove('show'),1600)}function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"':'&#39;'}[c]))}function save(){localStorage.favs=JSON.stringify(favs);localStorage.recent=JSON.stringify(recent)}async function load(){let data=null;for(const a of API){try{const r=await fetch(a+'/json/stations/bycountrycodeexact/TR?hidebroken=true&order=clickcount&reverse=true&limit=400');if(r.ok){data=await r.json();break}}catch(e){}}if(!data){toast('Radyo listesi alınamadı');return}const seen=new Set();for(const s of data){const txt=[s.name,s.language,s.languagecodes,s.tags].join(' ');if(BAD.test(txt))continue;const k=key(s),url=s.url_resolved||s.url;if(!url||seen.has(k))continue;seen.add(k);stations.push({...s,_url:url});if(stations.length>=80)break}let p=stations.findIndex(s=>/power\s*türk/i.test(s.name||''));index=p>=0?p:0;select(index,false)}function select(i,auto=true){if(!stations.length)return;index=(i+stations.length)%stations.length;const s=stations[index];$('#now').textContent=s.name;$('#miniName').textContent=s.name;$('#meta').textContent=(s.tags||'Canlı radyo').split(',').slice(0,4).join(' • ')||'Canlı radyo';$('#freq').textContent='TÜRKİYE • '+(s.bitrate?s.bitrate+' KBPS':'CANLI');recent=[key(s),...recent.filter(x=>x!==key(s))].slice(0,30);save();if(auto)play()}function setPlayUI(v){playing=v;$('#play').textContent=v?'Ⅱ':'▶';$('#miniPlay').textContent=v?'Ⅱ':'▶';$('#miniState').textContent=v?'Canlı yayın':paused?'Duraklatıldı':'Hazır'}function play(){if(index<0)return;const s=stations[index];paused=false;setPlayUI(true);native('radioapp://play?url='+encodeURIComponent(s._url)+'&name='+encodeURIComponent(s.name))}function pause(){native('radioapp://pause');paused=true;setPlayUI(false)}function toggle(){playing?pause():paused?(native('radioapp://resume'),paused=false,setPlayUI(true)):play()}function prev(){select(index-1,true)}function next(){select(index+1,true)}function toggleFav(i=index){const k=key(stations[i]);favs=favs.includes(k)?favs.filter(x=>x!==k):[...favs,k];save();renderList();toast(favs.includes(k)?'Favorilere eklendi':'Favorilerden çıkarıldı')}function similarity(a,b){const A=new Set((a.tags||'').toLowerCase().split(',').filter(Boolean)),B=new Set((b.tags||'').toLowerCase().split(',').filter(Boolean));let n=0;A.forEach(x=>{if(B.has(x))n++});return n*100+(b.clickcount||0)/1000}function listForMode(mode){if(mode==='favorites')return stations.filter(s=>favs.includes(key(s)));if(mode==='recent')return recent.map(k=>stations.find(s=>key(s)===k)).filter(Boolean);if(mode==='top')return [...stations].sort((a,b)=>(b.clickcount||0)-(a.clickcount||0)).slice(0,20);if(mode==='similar'&&index>=0){const cur=stations[index];return stations.filter((s,i)=>i!==index).sort((a,b)=>similarity(cur,b)-similarity(cur,a)).slice(0,16)}return stations}function renderList(){const q=$('#search').value.toLocaleLowerCase('tr');const arr=listForMode(currentMode).filter(s=>!q||(s.name||'').toLocaleLowerCase('tr').includes(q)||(s.tags||'').toLocaleLowerCase('tr').includes(q));$('#list').innerHTML=arr.length?arr.map(s=>{const i=stations.indexOf(s);return `<div class="item ${i===index?'active':''}" data-i="${i}"><div class="num">${i+1}</div><div><div class="itName">${esc(s.name)}</div><div class="itSub">${esc((s.tags||'Canlı radyo').split(',').slice(0,4).join(' • '))} • ${s.bitrate||'?'} kbps</div></div><button class="fav" data-f="${i}">${favs.includes(key(s))?'♥':'♡'}</button></div>`}).join(''):'<div class="empty">Bu bölümde henüz radyo yok.</div>';document.querySelectorAll('.item').forEach(el=>el.onclick=e=>{if(e.target.closest('.fav'))return;select(+el.dataset.i,true);closeSheet()});document.querySelectorAll('[data-f]').forEach(b=>b.onclick=e=>{e.stopPropagation();toggleFav(+b.dataset.f)})}function openMode(mode){currentMode=mode;const titles={all:'Tüm Radyolar',favorites:'Favoriler',recent:'Yakında Çalanlar',top:'Top 20',similar:'Benzer Radyolar',themes:'Temalar',eq:'Eşitleyici',discover:'Keşfet',settings:'Ayarlar'};$('#sheetTitle').textContent=titles[mode]||'Radyolar';$('#search').style.display=['themes','eq','settings'].includes(mode)?'none':'block';if(mode==='themes'){$('#list').innerHTML='<div class="item"><div class="num">◒</div><div><div class="itName">Neon Kırmızı</div><div class="itSub">Bu ekranın aktif premium teması</div></div></div><div class="item"><div class="num">☾</div><div><div class="itName">Gece Siyahı</div><div class="itSub">Daha sade koyu tema</div></div></div>'}else if(mode==='eq'){$('#list').innerHTML='<div class="item"><div class="num">☷</div><div><div class="itName">Eşitleyici</div><div class="itSub">Ses ayarları cihazın medya çıkışına uygulanır</div></div></div>'}else if(mode==='settings'){$('#list').innerHTML='<div class="item"><div class="num">80</div><div><div class="itName">Ana radyo listesi</div><div class="itSub">İleri/Geri daima 80 istasyonda sırayla ilerler</div></div></div>'}else if(mode==='discover')renderList();else renderList();$('#sheet').classList.add('show')}function closeSheet(){$('#sheet').classList.remove('show')}$('#prev').onclick=$('#prev2').onclick=prev;$('#next').onclick=$('#next2').onclick=next;$('#play').onclick=$('#miniPlay').onclick=toggle;$('#shazam').onclick=()=>native('radioapp://shazam');$('#volume').oninput=e=>native('radioapp://vol?v='+e.target.value);$('#menuBtn').onclick=()=>openMode('all');$('#settingsBtn').onclick=()=>openMode('settings');$('#closeSheet').onclick=closeSheet;$('#search').oninput=renderList;document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>openMode(b.dataset.mode));document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-nav]').forEach(x=>x.classList.remove('active'));b.classList.add('active');const m=b.dataset.nav;if(m==='home')closeSheet();else openMode(m)});load();
</script></body></html>
