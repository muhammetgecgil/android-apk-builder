<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Muhammet Türk Radyo</title><style>
:root{--bg:#151018;--card:#241722;--card2:#321e2d;--text:#fff9f0;--muted:#bdaeb4;--accent:#e97468;--accent2:#d6a66d;--ok:#55c98b;--bad:#ee6675;--line:#5b354b}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,var(--bg),#0c0b0f);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}.app{max-width:760px;margin:auto;padding:calc(16px + env(safe-area-inset-top)) 14px calc(92px + env(safe-area-inset-bottom))}.top{display:flex;gap:10px;align-items:center;justify-content:space-between}.brand{font-size:20px;font-weight:900}.sub{font-size:10px;color:var(--muted)}button,select,input{font:inherit}.topBtns{display:flex;gap:7px}.pill,.iconBtn{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:14px;padding:10px}.hero{margin-top:16px;border:1px solid var(--line);background:linear-gradient(140deg,var(--card2),var(--card));border-radius:28px;padding:18px;box-shadow:0 18px 55px #0007}.live{font-size:9px;color:#ff9b9f;font-weight:900;letter-spacing:1px}.name{font-size:27px;font-weight:900;margin-top:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{font-size:10px;color:var(--muted);margin-top:6px;min-height:16px}.health{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.chip{font-size:9px;padding:7px 9px;border:1px solid var(--line);border-radius:999px;background:#0003}.chip.ok{color:#86eab3;border-color:#397a59}.controls{display:grid;grid-template-columns:1fr 1fr 1.3fr 1fr 1fr;gap:10px;margin-top:18px}.ctrl{height:52px;border-radius:18px;border:1px solid var(--line);background:var(--card);color:var(--text);font-weight:900;font-size:18px}.ctrl.play{height:64px;background:linear-gradient(145deg,var(--accent2),var(--accent));color:#201016;font-size:22px}.ctrl.stop{background:#5c2430;color:#fff}.row{display:flex;gap:8px;margin-top:12px}.wide{flex:1;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:14px;padding:11px;font-size:10px;font-weight:800}.search{width:100%;margin-top:14px;border:1px solid var(--line);background:var(--card);color:var(--text);padding:14px;border-radius:16px;outline:none}.section{display:flex;align-items:end;justify-content:space-between;margin:20px 3px 10px}.section b{font-size:18px}.list{display:flex;flex-direction:column;gap:8px}.item{display:grid;grid-template-columns:44px 1fr auto;gap:11px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:10px}.item.active{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 25%,transparent)}.num{width:44px;height:44px;border-radius:14px;background:var(--card2);display:grid;place-items:center;font-size:12px;font-weight:900;color:var(--accent2)}.itName{font-weight:800;font-size:13px}.itSub{font-size:9px;color:var(--muted);margin-top:4px}.fav{border:0;background:transparent;color:#82717b;font-size:20px}.fav.on{color:#ff7082}.themeBox{margin-top:14px;padding:12px;border:1px solid var(--line);border-radius:18px;background:var(--card)}.themeLine{display:flex;gap:8px}.themeLine select{flex:1;background:var(--card2);color:var(--text);border:1px solid var(--line);padding:11px;border-radius:13px}.mini{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);width:min(calc(100% - 20px),740px);display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;border:1px solid var(--line);background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(18px);padding:10px 12px;border-radius:19px;box-shadow:0 15px 45px #0009}.mini b{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mini span{font-size:8px;color:var(--muted);display:block}.mini button{width:40px;height:40px;border:1px solid var(--line);border-radius:13px;background:var(--card2);color:var(--text)}.modal{position:fixed;inset:0;background:#000c;display:none;padding:14px;z-index:20}.modal.show{display:block}.panel{max-width:720px;height:100%;margin:auto;background:var(--bg);border:1px solid var(--line);border-radius:24px;padding:16px;overflow:auto}.panel h2{margin:0 0 12px}.log{white-space:pre-wrap;font:11px/1.55 monospace;background:#0004;border:1px solid var(--line);border-radius:14px;padding:12px}.close{float:right}.empty{text-align:center;color:var(--muted);padding:28px}.toast{position:fixed;left:50%;bottom:78px;transform:translate(-50%,130px);background:#111;color:#fff;border:1px solid #555;padding:10px 14px;border-radius:12px;font-size:10px;transition:.25s;z-index:30}.toast.show{transform:translate(-50%,0)}
</style></head><body><div class="app"><div class="top"><div id="brand"><div class="brand">Muhammet Türk Radyo</div><div class="sub">Türkiye 80 • Smart Engine 2.0.1</div></div><div class="topBtns"><button class="iconBtn" id="healthy">A+</button><button class="iconBtn" id="themeFav">♥</button></div></div>
<div class="themeBox"><div class="themeLine"><select id="theme"></select><button class="pill" id="favTheme">Tema ♥</button></div><div class="sub" id="themeInfo">Seçtiğin tema kalıcı olarak saklanır.</div></div>
<div class="hero"><div class="live">● CANLI RADYO</div><div class="name" id="now">Radyo seçiliyor…</div><div class="meta" id="meta">Türkiye'nin popüler internet radyoları</div><div class="health"><span class="chip" id="grade">Sağlık —</span><span class="chip" id="speed">Bağlanma —</span><span class="chip" id="bitrate">Bitrate —</span><span class="chip" id="status">Hazır</span></div><div class="controls"><button class="ctrl" id="prev">‹</button><button class="ctrl" id="fav">♡</button><button class="ctrl play" id="play">▶</button><button class="ctrl" id="next">›</button><button class="ctrl stop" id="stop">■</button></div><div class="row"><button class="wide" id="repair">YAYINI ONAR</button><button class="wide" id="smartZap">⚡ AKILLI KANAL</button><button class="wide" id="shazam">SHAZAM</button></div></div>
<input class="search" id="search" placeholder="80 radyo içinde ara…"><div class="section"><b>Radyolar</b><span class="sub" id="count">0 / 80</span></div><div class="list" id="list"></div></div>
<div class="mini"><div><b id="miniName">Türk Radyo</b><span id="miniState">Hazır</span></div><button id="miniPlay">▶</button><button id="miniStop">■</button></div><div class="toast" id="toast"></div>
<div class="modal" id="tech"><div class="panel"><button class="pill close" id="closeTech">Kapat</button><h2>Gizli Teknik Mod</h2><div class="log" id="techBody"></div></div></div>
<script>
const $=s=>document.querySelector(s),API=['https://de1.api.radio-browser.info','https://fi1.api.radio-browser.info','https://nl1.api.radio-browser.info'];
const BAD=/kurd|kürt|kurdish|kurdi|zaza|zazaki|sorani|kurman/i,ARAB=/arabesk|fantezi|damar/i,KRAL=/\bkral\b/i;
let stations=[],index=-1,playing=false,paused=false,showHealthy=false,playToken=0,failLog=JSON.parse(localStorage.failLog||'[]'),repairs=JSON.parse(localStorage.repairs||'{}'),health=JSON.parse(localStorage.health||'{}'),favs=JSON.parse(localStorage.favs||'[]');
const key=s=>s.stationuuid||s.name, save=()=>{localStorage.repairs=JSON.stringify(repairs);localStorage.health=JSON.stringify(health);localStorage.favs=JSON.stringify(favs)};
function native(u){let f=document.getElementById('bridge');if(!f){f=document.createElement('iframe');f.id='bridge';f.style.display='none';document.body.appendChild(f)}f.src='about:blank';setTimeout(()=>f.src=u,0)}
function toast(t){$('#toast').textContent=t;$('#toast').classList.add('show');setTimeout(()=>$('#toast').classList.remove('show'),1800)}
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function h(s){return health[key(s)]||{ok:0,bad:0,ms:9999,last:0}}
function grade(s){const x=h(s),n=x.ok+x.bad;if(!n)return 'B';const r=x.ok/n;if(r>.96&&x.ms<2500)return 'A+';if(r>.88)return 'A';if(r>.65)return 'B';return 'C'}
function score(s){const x=h(s),g={"A+":5000,A:3500,B:1500,C:0}[grade(s)]||0;return g+(s.clickcount||0)*.03-Math.min(x.ms||9999,10000)*.08}
function isFav(s){return favs.includes(key(s))}
function sortList(a){return a.sort((x,y)=>{const fx=isFav(x),fy=isFav(y);if(fx!==fy)return fx?-1:1;const ax=ARAB.test((x.name||'')+' '+(x.tags||'')),ay=ARAB.test((y.name||'')+' '+(y.tags||''));const kx=KRAL.test(x.name||''),ky=KRAL.test(y.name||'');const bx=ax?3:kx?2:0,by=ay?3:ky?2:0;if(bx!==by)return bx-by;return score(y)-score(x)||(y.clickcount||0)-(x.clickcount||0)})}
async function load(){let data=null;for(const a of API){try{let r=await fetch(a+'/json/stations/bycountrycodeexact/TR?hidebroken=true&order=clickcount&reverse=true&limit=340');if(r.ok){data=await r.json();break}}catch(e){}}if(!data){$('#list').innerHTML='<div class="empty">Radyo listesi alınamadı. İnterneti kontrol edin.</div>';return}let seen=new Set(),arr=[];for(const s of data){const txt=[s.name,s.language,s.languagecodes,s.tags].join(' ');if(BAD.test(txt))continue;const k=key(s);if(seen.has(k))continue;seen.add(k);let url=(repairs[k]&&repairs[k].url)||s.url_resolved||s.url;if(!url)continue;arr.push({...s,_url:url});if(arr.length>=80)break}stations=sortList(arr);index=0;render();select(0,false)}
function render(){let q=$('#search').value.toLocaleLowerCase('tr'),arr=stations.map((s,i)=>({s,i})).filter(o=>(!showHealthy||['A+','A'].includes(grade(o.s)))&&(!q||(o.s.name||'').toLocaleLowerCase('tr').includes(q)||(o.s.tags||'').toLocaleLowerCase('tr').includes(q)));$('#count').textContent=arr.length+' / '+stations.length;$('#list').innerHTML=arr.map(({s,i})=>`<div class="item ${i===index?'active':''}" data-i="${i}"><div class="num">${i+1}</div><div><div class="itName">${esc(s.name)}</div><div class="itSub">${esc((s.tags||'Canlı radyo').split(',').slice(0,4).join(' • '))} • ${grade(s)} • ${s.bitrate||'?'} kbps</div></div><button class="fav ${isFav(s)?'on':''}" data-f="${i}">♥</button></div>`).join('');document.querySelectorAll('.item').forEach(el=>el.onclick=e=>{if(e.target.closest('.fav'))return;select(+el.dataset.i,false)});document.querySelectorAll('[data-f]').forEach(b=>b.onclick=e=>{e.stopPropagation();toggleFav(+b.dataset.f)})}
function select(i,auto=false){if(!stations.length)return;index=(i+stations.length)%stations.length;let s=stations[index];$('#now').textContent=s.name;$('#miniName').textContent=s.name;$('#meta').textContent=(s.tags||'Canlı yayın').split(',').slice(0,5).join(' • ');$('#grade').textContent='Sağlık '+grade(s);$('#bitrate').textContent=(s.bitrate||'?')+' kbps';$('#fav').textContent=isFav(s)?'♥':'♡';render();if(auto)play()}
function toggleFav(i){let k=key(stations[i]);favs=favs.includes(k)?favs.filter(x=>x!==k):[...favs,k];let cur=key(stations[index]);stations=sortList(stations);index=stations.findIndex(s=>key(s)===cur);save();render();select(index,false)}
function setPlayUI(state){$('#play').textContent=state?'Ⅱ':'▶';$('#miniPlay').textContent=state?'Ⅱ':'▶';$('#miniState').textContent=state?'Canlı yayın':paused?'Duraklatıldı':'Hazır'}
async function probe(s,token){return new Promise(res=>{let a=new Audio(),done=false,t=performance.now();a.muted=true;a.preload='metadata';let finish=ok=>{if(done)return;done=true;try{a.pause();a.src=''}catch(e){}res({ok,ms:Math.round(performance.now()-t)})};a.oncanplay=()=>finish(true);a.onloadedmetadata=()=>finish(true);a.onerror=()=>finish(false);try{a.src=s._url;a.load()}catch(e){finish(false)}setTimeout(()=>finish(false),10000)})}
async function play(){if(index<0)return;let s=stations[index],token=++playToken;playing=true;paused=false;setPlayUI(true);$('#status').textContent='Bağlanıyor';native('radioapp://play?url='+encodeURIComponent(s._url)+'&name='+encodeURIComponent(s.name));let r=await probe(s,token);if(token!==playToken)return;let x=h(s);if(r.ok){x.ok++;x.ms=r.ms;x.last=Date.now();health[key(s)]=x;save();$('#speed').textContent=r.ms+' ms';$('#status').textContent='Canlı';render()}else{x.bad++;x.last=Date.now();health[key(s)]=x;failLog.unshift(new Date().toLocaleString('tr-TR')+' • '+s.name+' • 10 sn içinde yanıt yok');failLog=failLog.slice(0,80);localStorage.failLog=JSON.stringify(failLog);save();$('#status').textContent='Yanıt yok';let fixed=await repair(s,true);if(!fixed){playing=false;setPlayUI(false);native('radioapp://stop');toast('Yayın açılamadı')}}}
function pause(){native('radioapp://pause');playing=false;paused=true;setPlayUI(false);$('#status').textContent='Duraklatıldı'}function resume(){native('radioapp://resume');playing=true;paused=false;setPlayUI(true);$('#status').textContent='Canlı'}function stop(){++playToken;native('radioapp://stop');playing=false;paused=false;setPlayUI(false);$('#status').textContent='Durduruldu'}
function step(d){if(!stations.length)return;index=(index+d+stations.length)%stations.length;select(index,false);play()}
async function repair(s,replay=false){$('#status').textContent='Adres aranıyor';let candidates=[];for(const a of API){try{let r=await fetch(a+'/json/stations/byuuid/'+encodeURIComponent(s.stationuuid||''));if(r.ok)candidates.push(...await r.json())}catch(e){}if(candidates.length)break}if(!candidates.length){for(const a of API){try{let r=await fetch(a+'/json/stations/byname/'+encodeURIComponent(s.name)+'?hidebroken=true&limit=12');if(r.ok)candidates.push(...await r.json())}catch(e){}if(candidates.length)break}}for(const c of candidates){let u=c.url_resolved||c.url;if(!u||u===s._url)continue;let test={...s,_url:u},r=await probe(test,playToken);if(r.ok){repairs[key(s)]={url:u,at:Date.now(),source:'Radio Browser'};s._url=u;s.bitrate=c.bitrate||s.bitrate;s.codec=c.codec||s.codec;save();failLog.unshift(new Date().toLocaleString('tr-TR')+' • '+s.name+' • yeni adres doğrulandı');localStorage.failLog=JSON.stringify(failLog.slice(0,80));toast('Yeni yayın adresi bulundu');if(replay)play();return true}}return false}
async function smartZap(){if(!stations.length)return;let pool=stations.map((s,i)=>({s,i})).filter(o=>o.i!==index).sort((a,b)=>score(b.s)-score(a.s)).slice(0,10);for(const o of pool){let r=await probe(o.s,playToken);if(r.ok){index=o.i;select(index,false);play();return}}toast('Hızlı kanal bulunamadı')}
$('#prev').onclick=()=>step(-1);$('#next').onclick=()=>step(1);$('#play').onclick=()=>playing?pause():paused?resume():play();$('#stop').onclick=stop;$('#miniPlay').onclick=()=>$('#play').click();$('#miniStop').onclick=stop;$('#fav').onclick=()=>toggleFav(index);$('#repair').onclick=()=>index>=0&&repair(stations[index],playing);$('#smartZap').onclick=smartZap;$('#shazam').onclick=()=>native('radioapp://shazam');$('#search').oninput=render;$('#healthy').onclick=()=>{showHealthy=!showHealthy;$('#healthy').style.opacity=showHealthy?'1':'.5';render()};
const themes=[['Bordo Krem','#151018','#2b1824','#ef786d','#edc28e'],['Kömür Mercan','#111214','#242326','#ff7567','#f4c38b'],['Fildişi Şarap','#f5eee5','#fff8ef','#842e47','#c78063'],['Zümrüt Krem','#091a16','#183128','#d99d66','#7bc9a4'],['Derin Mavi','#071126','#10224c','#2c86ff','#25d8ff'],['Toprak Kum','#2c1710','#493022','#db7b55','#e8c58a'],['Mürdüm Altın','#1c1020','#39203e','#d4a85d','#a95bc6'],['Grafit Nane','#141719','#23292a','#74d5b0','#c2e2cf'],['Bakır Pudra','#241719','#4a2d2c','#c77c5e','#e7b6ae'],['Zeytin Bej','#1a1c12','#303521','#a8a26d','#e3d7b7'],['Patlıcan Gül','#211221','#3c2039','#d37b9a','#b360a8'],['Monokrom İnci','#eeeeeb','#ffffff','#606064','#99999e'],['Gün Batımı','#2a1117','#5b2630','#ff725e','#ffb66b'],['Orman Şampanya','#0d1b14','#1c3425','#d9b678','#75ad86'],['Kehribar Espresso','#21150d','#3d2a1c','#e6a13d','#8d6041'],['Turkuaz Şeftali','#092022','#163c3d','#5ec9c1','#f2a980'],['Yakut Grafit','#181416','#2d2326','#c94b5e','#7f777a'],['Lavanta Gümüş','#1d1925','#342d40','#a98bc7','#cbd0d8'],['Gece Bakır','#0c1021','#1d2542','#c3815a','#6679c7'],['Taş Safran','#28241e','#3b352c','#e0ad3c','#c6b89e']];let themeFavs=JSON.parse(localStorage.themeFavs||'[]'),curTheme=localStorage.themeName||themes[0][0];function renderThemes(){let ordered=[...themes].sort((a,b)=>(themeFavs.includes(b[0])?1:0)-(themeFavs.includes(a[0])?1:0));$('#theme').innerHTML=ordered.map(t=>`<option ${t[0]===curTheme?'selected':''}>${t[0]}</option>`).join('');applyTheme(curTheme)}function applyTheme(n){let t=themes.find(x=>x[0]===n)||themes[0];curTheme=t[0];localStorage.themeName=curTheme;document.documentElement.style.setProperty('--bg',t[1]);document.documentElement.style.setProperty('--card',t[2]);document.documentElement.style.setProperty('--card2',t[2]);document.documentElement.style.setProperty('--accent',t[3]);document.documentElement.style.setProperty('--accent2',t[4]);$('#themeInfo').textContent=(themeFavs.includes(curTheme)?'Favori tema • ':'')+'Her açılışta '+curTheme+' kullanılacak.'}$('#theme').onchange=e=>applyTheme(e.target.value);$('#favTheme').onclick=()=>{themeFavs=themeFavs.includes(curTheme)?themeFavs.filter(x=>x!==curTheme):[...themeFavs,curTheme];localStorage.themeFavs=JSON.stringify(themeFavs);renderThemes();toast(themeFavs.includes(curTheme)?'Tema favorilere eklendi':'Tema favoriden çıkarıldı')};$('#themeFav').onclick=()=>{let f=themeFavs[0];if(f){applyTheme(f);renderThemes()}else toast('Henüz favori tema yok')};
let taps=[];$('#brand').onclick=()=>{let n=Date.now();taps=taps.filter(x=>n-x<1600);taps.push(n);if(taps.length>=5){taps=[];let s=stations[index]||{};$('#techBody').textContent='Sürüm: 2.0.1 (201)\nPaket: com.muhammetgecgil.turkradyo\nAktif radyo: '+(s.name||'—')+'\nURL: '+(s._url||'—')+'\nSağlık: '+(s.name?grade(s):'—')+'\nBitrate: '+(s.bitrate||'—')+' kbps\nCodec: '+(s.codec||'—')+'\n\nSon hata/onarımlar:\n'+(failLog.slice(0,25).join('\n')||'Kayıt yok');$('#tech').classList.add('show')}};$('#closeTech').onclick=()=>$('#tech').classList.remove('show');renderThemes();load();
</script></body></html>
