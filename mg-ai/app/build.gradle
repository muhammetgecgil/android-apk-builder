plugins {
    id 'com.android.application'
}

def mgAiStableKey = file('mg-ai-update.jks')

android {
    namespace 'com.mgai.app'
    compileSdk 35
    ndkVersion '27.2.12479018'

    signingConfigs {
        mgAiUpdate {
            if (mgAiStableKey.exists()) {
                storeFile mgAiStableKey
                storePassword 'MGAI_Update_2026'
                keyAlias 'mgai'
                keyPassword 'MGAI_Update_2026'
            }
        }
    }

    defaultConfig {
        applicationId 'com.mgai.app'
        minSdk 26
        targetSdk 35
        versionCode 54
        versionName '0.54.0'

        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17 -O3'
                arguments '-DANDROID_STL=c++_shared'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    buildTypes {
        debug {
            if (mgAiStableKey.exists()) {
                signingConfig signingConfigs.mgAiUpdate
            }
        }
        release {
            minifyEnabled false
            if (mgAiStableKey.exists()) {
                signingConfig signingConfigs.mgAiUpdate
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation 'com.tom-roush:pdfbox-android:2.0.27.0'
    implementation 'com.google.mlkit:text-recognition:16.0.1'
}
