plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mgai.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.mgai.app'
        minSdk 26
        targetSdk 35
        versionCode 7
        versionName '0.7.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
