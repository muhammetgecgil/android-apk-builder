plugins { id 'com.android.application' }

android {
    namespace 'com.muhammetgecgil.nesnesayarai'
    compileSdk 36

    signingConfigs {
        stableTest {
            storeFile rootProject.file('nesnesayar-test.jks')
            storePassword 'testpass123'
            keyAlias 'nesnesayar'
            keyPassword 'testpass123'
        }
    }

    defaultConfig {
        applicationId 'com.mglabs.mgdiff.test'
        minSdk 26
        targetSdk 36
        versionCode 3
        versionName '1.0.2-test'
    }

    buildTypes {
        debug {
            minifyEnabled false
            signingConfig signingConfigs.stableTest
        }
        release {
            minifyEnabled true
            shrinkResources true
            signingConfig signingConfigs.stableTest
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies { }
