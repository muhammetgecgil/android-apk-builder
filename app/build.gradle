plugins { id 'com.android.application' }
android {
 namespace 'com.muhammetgecgil.nesnesayarai'
 compileSdk 36
 signingConfigs { stableTest { storeFile rootProject.file('nesnesayar-test.jks'); storePassword 'testpass123'; keyAlias 'nesnesayar'; keyPassword 'testpass123' } }
 defaultConfig { applicationId 'com.mglabs.mgdiff.test'; minSdk 26; targetSdk 36; versionCode 2; versionName '1.0.1-test' }
 buildTypes { debug { minifyEnabled false; signingConfig signingConfigs.stableTest }; release { minifyEnabled false; signingConfig signingConfigs.stableTest; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro' } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 packagingOptions { resources.excludes += ['META-INF/NOTICE.md','META-INF/LICENSE.md'] }
}
dependencies {
 implementation 'androidx.appcompat:appcompat:1.7.1'
 implementation 'androidx.core:core:1.17.0'
 implementation 'androidx.camera:camera-camera2:1.4.2'
 implementation 'androidx.camera:camera-lifecycle:1.4.2'
 implementation 'androidx.camera:camera-view:1.4.2'
 implementation 'com.google.mlkit:object-detection:17.0.2'
 implementation 'org.tensorflow:tensorflow-lite-task-vision:0.4.4'
}
