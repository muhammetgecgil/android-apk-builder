plugins { id 'com.android.application' }

android {
    namespace 'com.muhammetgecgil.sesgoruntuharitasi'
    compileSdk 36
    defaultConfig {
        applicationId 'com.muhammetgecgil.probefusionv7'
        minSdk 26
        targetSdk 36
        versionCode 71
        versionName '7.1'
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation 'com.google.mediapipe:tasks-vision:latest.release'
}
