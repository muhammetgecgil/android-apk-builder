plugins { id 'com.android.application' }

android {
    namespace 'com.muhammetgecgil.nesnesayarai'
    compileSdk 36

    signingConfigs {
        stableTest {
            storeFile rootProject.file('nesnesayar-test.jks')
            storePassword 'testpass123'
            keyAlias 'nesnesayar'
            keyPassword 'testpass123'
        }
    }

    defaultConfig {
        applicationId 'com.muhammetgecgil.nesnesayarai.stable'
        minSdk 26
        targetSdk 36
        versionCode 112
        versionName '1.1.2-strict-roi-object-centers'
    }

    buildTypes {
        debug { minifyEnabled false; signingConfig signingConfigs.stableTest }
        release {
            minifyEnabled false
            signingConfig signingConfigs.stableTest
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.core:core:1.17.0'
    implementation 'androidx.camera:camera-core:1.5.0'
    implementation 'androidx.camera:camera-camera2:1.5.0'
    implementation 'androidx.camera:camera-lifecycle:1.5.0'
    implementation 'androidx.camera:camera-view:1.5.0'
    implementation 'com.google.mlkit:object-detection:17.0.2'
}
