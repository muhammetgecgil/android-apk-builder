plugins { id 'com.android.application' }

android {
    namespace 'com.muhammetgecgil.mg3dscanner'
    compileSdk 35

    signingConfigs {
        stableTest {
            storeFile rootProject.file('../nesnesayar-test.jks')
            storePassword 'testpass123'
            keyAlias 'nesnesayar'
            keyPassword 'testpass123'
        }
    }

    defaultConfig {
        applicationId 'com.muhammetgecgil.mg3dscanner'
        minSdk 26
        targetSdk 35
        versionCode 240
        versionName '2.4.0'
    }
    buildTypes {
        debug { minifyEnabled false; signingConfig signingConfigs.stableTest }
        release { minifyEnabled false; signingConfig signingConfigs.stableTest }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies {
    implementation 'org.opencv:opencv:4.13.0'
}
