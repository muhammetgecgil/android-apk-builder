name: Muhammet Haber V11 Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'muhammet-haber-v11/**'
      - '.github/workflows/muhammet-haber-v11.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build APK
        run: gradle -p muhammet-haber-v11 :app:assembleDebug --stacktrace
      - name: Rename APK
        run: cp muhammet-haber-v11/app/build/outputs/apk/debug/app-debug.apk MuhammetHaber-V11-AI-Daily.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MuhammetHaber-V11-AI-Daily
          path: MuhammetHaber-V11-AI-Daily.apk
          retention-days: 90
