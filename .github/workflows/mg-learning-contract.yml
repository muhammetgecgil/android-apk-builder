name: Validate MG Learning Engine

on:
  push:
    branches: [mg-ai-v0.1-bootstrap]
    paths:
      - 'mg-learning-server/**'
      - '.github/workflows/mg-learning-contract.yml'
  pull_request:
    paths:
      - 'mg-learning-server/**'
      - '.github/workflows/mg-learning-contract.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install fastapi pydantic
      - run: python -m py_compile mg-learning-server/learning_engine.py mg-learning-server/api.py
      - run: PYTHONPATH=mg-learning-server python mg-learning-server/test_learning_engine.py
      - run: PYTHONPATH=mg-learning-server python -c "import api; print(api.app.title)"
