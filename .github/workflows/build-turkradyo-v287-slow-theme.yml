name: Build TurkRadyo v2.8.7 Slow Theme

on:
  push:
    branches:
      - 'dev/turkradyo-v2.8.7-slow-theme'
    paths:
      - 'turkradyo/**'
      - '.github/workflows/build-turkradyo-v287-slow-theme.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install API 36 SDK
        run: yes | sdkmanager --licenses >/dev/null || true; sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'platform-tools'
      - name: Verify v2.8.7 identity
        run: grep -q "versionCode 287" turkradyo/app/build.gradle && grep -q "versionName '2.8.7'" turkradyo/app/build.gradle
      - name: Build APK
        working-directory: turkradyo
        run: gradle --no-daemon clean assembleDebug
      - name: Stage APK
        run: |
          mkdir -p dist
          cp turkradyo/app/build/outputs/apk/debug/app-debug.apk dist/TurkRadyo-v2.8.7-Slow-Theme-Debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TurkRadyo-v2.8.7-Slow-Theme-APK
          path: dist/TurkRadyo-v2.8.7-Slow-Theme-Debug.apk
          if-no-files-found: error
          retention-days: 30
