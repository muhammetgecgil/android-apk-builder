name: Build Stone Glow Analyzer

on:
  push:
    branches: ["main"]
    paths:
      - "stone-fluorescence/**"
      - ".github/workflows/build-stone-fluorescence.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "stone-fluorescence/**"
      - ".github/workflows/build-stone-fluorescence.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Build APK
        working-directory: stone-fluorescence
        run: gradle --no-daemon :app:assembleDebug
      - name: Stage APK
        run: |
          mkdir -p out
          cp stone-fluorescence/app/build/outputs/apk/debug/app-debug.apk out/Stone-Glow-Analyzer-v1.0.apk
          sha256sum out/Stone-Glow-Analyzer-v1.0.apk > out/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Stone-Glow-Analyzer-v1.0
          path: out/*
          if-no-files-found: error
