name: WiFi Radar Play Build
on:
  workflow_dispatch:
  push:
    paths:
      - 'wifi-csi-radar/**'
      - '.github/workflows/build-wifi-radar-play.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build APK and Play bundle
        run: gradle -p wifi-csi-radar :app:assembleDebug :app:bundleRelease --stacktrace
      - name: Android lint gate
        run: gradle -p wifi-csi-radar :app:lintRelease --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: WiFiRadar-v5-Play
          path: |
            wifi-csi-radar/app/build/outputs/apk/debug/app-debug.apk
            wifi-csi-radar/app/build/outputs/bundle/release/app-release.aab
            wifi-csi-radar/app/build/reports/lint-results-release.html
            wifi-csi-radar/app/build/reports/lint-results-release.txt
          retention-days: 30
