name: Build TurkRadyo Play Release

on:
  workflow_dispatch:
  push:
    paths:
      - 'turkradyo/**'
      - '.github/workflows/build-turkradyo-play.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TURKRADYO_KEYSTORE_B64: ${{ secrets.TURKRADYO_KEYSTORE_B64 }}
      TURKRADYO_STORE_PASSWORD: ${{ secrets.TURKRADYO_STORE_PASSWORD }}
      TURKRADYO_KEY_ALIAS: ${{ secrets.TURKRADYO_KEY_ALIAS }}
      TURKRADYO_KEY_PASSWORD: ${{ secrets.TURKRADYO_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare selected launcher icon
        run: |
          mkdir -p turkradyo/app/src/main/res/drawable-nodpi
          cat turkradyo/icon/chunk1.b64 turkradyo/icon/chunk2.b64 turkradyo/icon/chunk3.b64 turkradyo/icon/chunk4.b64 | base64 -d > turkradyo/app/src/main/res/drawable-nodpi/ic_launcher_selected.webp
          echo "bfd7e5e1fcbdb5e7912757b1070c0f3894fd374738b84c302309d01938226796  turkradyo/app/src/main/res/drawable-nodpi/ic_launcher_selected.webp" | sha256sum -c -

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install API 36 SDK
        run: yes | sdkmanager --licenses >/dev/null || true; sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'platform-tools'

      - name: Prepare stable update signing key
        if: env.TURKRADYO_KEYSTORE_B64 != ''
        run: |
          echo "$TURKRADYO_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/turkradyo-release.jks"
          echo "TURKRADYO_KEYSTORE_FILE=$RUNNER_TEMP/turkradyo-release.jks" >> "$GITHUB_ENV"

      - name: Build APK and Play bundle
        working-directory: turkradyo
        run: gradle --no-daemon clean lintRelease assembleRelease assembleDebug bundleRelease

      - name: Package source snapshot and complete kit
        run: |
          mkdir -p dist
          zip -rq dist/TurkRadyo-v2.8.3-Source.zip turkradyo TURKRADYO_REFERENCE.md .github/workflows/build-turkradyo-play.yml .github/workflows/ci-turkradyo-pr.yml .github/workflows/radio-audit.yml -x 'turkradyo/app/build/*' 'turkradyo/.gradle/*'
          cp turkradyo/app/build/outputs/apk/debug/app-debug.apk dist/TurkRadyo-v2.8.3-Debug.apk
          cp turkradyo/app/build/outputs/bundle/release/app-release.aab dist/TurkRadyo-v2.8.3-Play.aab
          if [ -f turkradyo/app/build/outputs/apk/release/app-release.apk ]; then
            cp turkradyo/app/build/outputs/apk/release/app-release.apk dist/TurkRadyo-v2.8.3-Release.apk
            SIGNING_STATE='stable-signed-release'
          else
            cp turkradyo/app/build/outputs/apk/release/app-release-unsigned.apk dist/TurkRadyo-v2.8.3-Release-Unsigned.apk
            SIGNING_STATE='release-unsigned-debug-installable'
          fi
          cat > dist/TurkRadyo-v2.8.3-MANIFEST.txt <<EOF
          TurkRadyo LATEST DEVELOPMENT PACKAGE
          Version: 2.8.3
          VersionCode: 283
          Git commit: $GITHUB_SHA
          Branch: dev/turkradyo-after-v2.7.0
          Signing state: $SIGNING_STATE
          Play Store file: TurkRadyo-v2.8.3-Play.aab
          Installable test APK: TurkRadyo-v2.8.3-Debug.apk
          Source snapshot: TurkRadyo-v2.8.3-Source.zip
          EOF
          (cd dist && sha256sum TurkRadyo-v2.8.3-Debug.apk TurkRadyo-v2.8.3-Play.aab TurkRadyo-v2.8.3-Source.zip >> TurkRadyo-v2.8.3-MANIFEST.txt)
          (cd dist && zip -q TurkRadyo-v2.8.3-COMPLETE.zip TurkRadyo-v2.8.3-Debug.apk TurkRadyo-v2.8.3-Play.aab TurkRadyo-v2.8.3-Source.zip TurkRadyo-v2.8.3-MANIFEST.txt TurkRadyo-v2.8.3-Release*.apk)

      - name: Upload stable signed update APK
        if: env.TURKRADYO_KEYSTORE_B64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: TurkRadyo-Stable-Update-APK
          path: turkradyo/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload unsigned release APK for offline signing
        if: env.TURKRADYO_KEYSTORE_B64 == ''
        uses: actions/upload-artifact@v4
        with:
          name: TurkRadyo-Release-Unsigned-APK
          path: turkradyo/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload debug test APK
        uses: actions/upload-artifact@v4
        with:
          name: TurkRadyo-Debug-Test-APK-NOT-FOR-UPDATES
          path: turkradyo/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Play bundle
        uses: actions/upload-artifact@v4
        with:
          name: TurkRadyo-Play-Bundle
          path: turkradyo/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: TurkRadyo-v2.8.3-Source
          path: dist/TurkRadyo-v2.8.3-Source.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload complete release kit
        uses: actions/upload-artifact@v4
        with:
          name: TurkRadyo-v2.8.3-COMPLETE
          path: |
            dist/TurkRadyo-v2.8.3-COMPLETE.zip
            dist/TurkRadyo-v2.8.3-MANIFEST.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TurkRadyo-Lint-Report
          path: turkradyo/app/build/reports/lint-results-release.html
          if-no-files-found: ignore
          retention-days: 30
