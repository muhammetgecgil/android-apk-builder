name: Build MG 3D Scanner APK
on:
  push:
    branches: [ main ]
    paths: [ 'photogrammetry3d/**', '.github/workflows/build-photogrammetry3d.yml' ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - run: base64 -d .github/nesnesayar-test.jks.b64 > nesnesayar-test.jks
      - name: Build APK
        id: buildapk
        working-directory: photogrammetry3d
        continue-on-error: true
        run: |
          set -o pipefail
          gradle --no-daemon :app:assembleDebug --stacktrace 2>&1 | tee ../mg3d-build.log
      - name: Record failed build
        if: steps.buildapk.outcome != 'success'
        run: |
          mkdir -p build-status
          tail -120 mg3d-build.log > build-status/MG3D_LAST_FAILURE.txt
          printf '\nrun_id=%s\nsha=%s\n' '${{ github.run_id }}' '${{ github.sha }}' >> build-status/MG3D_LAST_FAILURE.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add build-status/MG3D_LAST_FAILURE.txt
          git commit -m 'Record failed MG3D build [skip ci]' || true
          git push || true
          exit 1
      - name: Verify APK
        run: |
          test -s photogrammetry3d/app/build/outputs/apk/debug/app-debug.apk
          cp photogrammetry3d/app/build/outputs/apk/debug/app-debug.apk MG_3D_Studio_Pro_v2.2.apk
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging MG_3D_Studio_Pro_v2.2.apk | head -20
          unzip -t MG_3D_Studio_Pro_v2.2.apk >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: MG-3D-Studio-Pro-v2.2-APK
          path: MG_3D_Studio_Pro_v2.2.apk
          if-no-files-found: error
          retention-days: 30
      - name: Record successful build
        run: |
          mkdir -p build-status
          printf 'run_id=%s\nsha=%s\nartifact=MG-3D-Studio-Pro-v2.2-APK\n' '${{ github.run_id }}' '${{ github.sha }}' > build-status/MG3D_LAST_SUCCESS.txt
          rm -f build-status/MG3D_LAST_FAILURE.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add build-status
          git commit -m 'Record successful MG3D build [skip ci]' || exit 0
          git push
