name: Build MG 3D Scanner APK
on:
  push:
    branches: [ main ]
    paths: [ 'photogrammetry3d/**', '.github/workflows/build-photogrammetry3d.yml' ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - run: base64 -d .github/nesnesayar-test.jks.b64 > nesnesayar-test.jks
      - working-directory: photogrammetry3d
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - run: |
          test -s photogrammetry3d/app/build/outputs/apk/debug/app-debug.apk
          cp photogrammetry3d/app/build/outputs/apk/debug/app-debug.apk MG_3D_Scanner_v1.0.apk
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging MG_3D_Scanner_v1.0.apk | head -20
      - uses: actions/upload-artifact@v4
        with:
          name: MG-3D-Scanner-v1.0-APK
          path: MG_3D_Scanner_v1.0.apk
          if-no-files-found: error
          retention-days: 30
