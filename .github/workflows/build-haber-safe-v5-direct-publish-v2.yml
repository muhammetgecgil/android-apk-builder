name: Build Publish Haber SAFE V6 APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "haber-safe-v5-direct/**"
      - ".github/workflows/build-haber-safe-v5-direct-publish-v2.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle -p haber-safe-v5-direct clean assembleDebug --stacktrace

      - name: Verify APK signature
        run: apksigner verify --verbose haber-safe-v5-direct/app/build/outputs/apk/debug/app-debug.apk

      - name: Create checksum
        run: sha256sum haber-safe-v5-direct/app/build/outputs/apk/debug/app-debug.apk > /tmp/Haber_SAFE_V6_6.0.0.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Haber-SAFE-V6-APK
          path: |
            haber-safe-v5-direct/app/build/outputs/apk/debug/app-debug.apk
            /tmp/Haber_SAFE_V6_6.0.0.sha256
          if-no-files-found: error

      - name: Publish APK into SAFE folder
        shell: bash
        run: |
          set -e
          mkdir -p /tmp/haber-safe-build
          cp haber-safe-v5-direct/app/build/outputs/apk/debug/app-debug.apk /tmp/haber-safe-build/Haber_SAFE_V6_6.0.0.apk
          cp /tmp/Haber_SAFE_V6_6.0.0.sha256 /tmp/haber-safe-build/Haber_SAFE_V6_6.0.0.sha256
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/haber-safe-build/Haber_SAFE_V6_6.0.0.apk muhammet-haber-safe-v5/Haber_SAFE_V6_6.0.0.apk
          cp /tmp/haber-safe-build/Haber_SAFE_V6_6.0.0.sha256 muhammet-haber-safe-v5/Haber_SAFE_V6_6.0.0.sha256
          git add muhammet-haber-safe-v5/Haber_SAFE_V6_6.0.0.apk muhammet-haber-safe-v5/Haber_SAFE_V6_6.0.0.sha256
          git commit -m "Publish Haber SAFE V6 6.0.0 APK" || exit 0
          git push origin HEAD:main
