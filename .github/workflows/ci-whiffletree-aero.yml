name: Build Whiffletree Aero APK

permissions:
  contents: write

on:
  push:
    branches: [ "main", "feature/whiffletree-aero-v1" ]
    paths:
      - 'whiffletree-aero/**'
      - '.github/workflows/ci-whiffletree-aero.yml'
  pull_request:
    paths:
      - 'whiffletree-aero/**'
      - '.github/workflows/ci-whiffletree-aero.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile-check engineering source
        working-directory: whiffletree-aero
        run: gradle --no-daemon clean compileDebugJavaWithJavac --stacktrace
      - name: Restore stable Whiffletree signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: whiffletree-aero-debug-signing-v1
          fail-on-cache-miss: true
      - name: Build signed debug APK
        working-directory: whiffletree-aero
        run: gradle --no-daemon assembleDebug --stacktrace
      - name: Rename APK
        run: cp whiffletree-aero/app/build/outputs/apk/debug/app-debug.apk Whiffletree-Aero-v7.14.0.apk
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: whiffletree-aero-v7.14.0
          if-no-files-found: error
          path: Whiffletree-Aero-v7.14.0.apk
      - name: Publish updater payload
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p whiffletree-aero/update
          base64 -w0 Whiffletree-Aero-v7.14.0.apk > whiffletree-aero/update/latest.apk.b64
          cat > whiffletree-aero/update/latest.json <<'EOF'
          {"versionCode":75,"versionName":"7.14.0","encoding":"base64","url":"https://raw.githubusercontent.com/muhammetgecgil/android-apk-builder/main/whiffletree-aero/update/latest.apk.b64"}
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add whiffletree-aero/update/latest.apk.b64 whiffletree-aero/update/latest.json
          git diff --cached --quiet || git commit -m "Publish Whiffletree v7.14.0 updater payload [skip ci]"
          git push
