name: Build Whiffletree Aero APK

on:
  push:
    branches: [ "main", "feature/whiffletree-aero-v1" ]
    paths:
      - 'whiffletree-aero/**'
      - '.github/workflows/ci-whiffletree-aero.yml'
  pull_request:
    paths:
      - 'whiffletree-aero/**'
      - '.github/workflows/ci-whiffletree-aero.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore stable Whiffletree signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: whiffletree-aero-debug-signing-v1
      - name: Build signed debug APK
        working-directory: whiffletree-aero
        run: gradle --no-daemon clean assembleDebug --stacktrace
      - name: Rename APK
        run: cp whiffletree-aero/app/build/outputs/apk/debug/app-debug.apk Whiffletree-Aero-v7.7.0.apk
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: whiffletree-aero-v7.7.0
          if-no-files-found: error
          path: Whiffletree-Aero-v7.7.0.apk
