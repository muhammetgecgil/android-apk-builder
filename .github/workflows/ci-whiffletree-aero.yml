name: Build Whiffletree Aero 7.20

permissions:
  contents: read

on:
  push:
    branches: [ "main", "feature/whiffletree-aero-v1" ]
    paths:
      - 'whiffletree-aero/**'
      - '.github/workflows/ci-whiffletree-aero.yml'
  pull_request:
    paths:
      - 'whiffletree-aero/**'
      - '.github/workflows/ci-whiffletree-aero.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Compile and build Play test APK
        working-directory: whiffletree-aero
        run: gradle --no-daemon clean assemblePlayDebug --stacktrace

      - name: Build sideload test APK
        working-directory: whiffletree-aero
        run: gradle --no-daemon assembleSideloadDebug --stacktrace

      - name: Build Play Store release AAB
        working-directory: whiffletree-aero
        run: gradle --no-daemon bundlePlayRelease --stacktrace

      - name: Prepare distribution package
        run: |
          mkdir -p dist/source
          cp whiffletree-aero/app/build/outputs/apk/play/debug/app-play-debug.apk dist/Whiffletree-Aero-v7.20.0-PLAY-TEST.apk
          cp whiffletree-aero/app/build/outputs/apk/sideload/debug/app-sideload-debug.apk dist/Whiffletree-Aero-v7.20.0-SIDELOAD.apk
          cp whiffletree-aero/app/build/outputs/bundle/playRelease/app-play-release.aab dist/Whiffletree-Aero-v7.20.0-PLAY-UNSIGNED.aab
          cp -R whiffletree-aero dist/source/whiffletree-aero
          cp .github/workflows/ci-whiffletree-aero.yml dist/source/ci-whiffletree-aero.yml
          cd dist/source && zip -qr ../Whiffletree-Aero-v7.20.0-SOURCE.zip .

      - name: Upload complete package
        uses: actions/upload-artifact@v4
        with:
          name: whiffletree-aero-v7.20.0-complete
          if-no-files-found: error
          path: |
            dist/Whiffletree-Aero-v7.20.0-PLAY-TEST.apk
            dist/Whiffletree-Aero-v7.20.0-SIDELOAD.apk
            dist/Whiffletree-Aero-v7.20.0-PLAY-UNSIGNED.aab
            dist/Whiffletree-Aero-v7.20.0-SOURCE.zip
