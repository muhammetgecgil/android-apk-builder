name: Build V8.1 Full Color APK

on:
  push:
    branches: [ ses-goruntu-v81 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Validate APK
        run: test -f app/build/outputs/apk/debug/app-debug.apk && ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Ses_Goruntu_Haritasi_V8_1_FullColor_Fyvadio_S24.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ses-Goruntu-Haritasi-V8-1-FullColor-APK
          path: Ses_Goruntu_Haritasi_V8_1_FullColor_Fyvadio_S24.apk
          if-no-files-found: error
