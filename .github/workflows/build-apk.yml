name: Build Nesne Sayar AI APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Restore stable test signing key
        run: base64 -d .github/nesnesayar-test.jks.b64 > nesnesayar-test.jks
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Nesne_Sayar_AI_v110.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nesne-Sayar-AI-v110
          path: Nesne_Sayar_AI_v110.apk
          if-no-files-found: error
          retention-days: 30
