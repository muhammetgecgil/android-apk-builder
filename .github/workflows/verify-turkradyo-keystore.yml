name: Verify TurkRadyo Stable Keystore
on:
  push:
    paths:
      - '.github/workflows/verify-turkradyo-keystore.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode existing keystore
        run: base64 -d .github/nesnesayar-test.jks.b64 > /tmp/turkradyo-test.jks
      - name: Verify default Android test password
        run: keytool -list -keystore /tmp/turkradyo-test.jks -storepass android
