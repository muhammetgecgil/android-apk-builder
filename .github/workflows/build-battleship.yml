name: Build Battleship v13 Combat Command APK

on:
  push:
    branches: [ battleship-v1 ]
    paths:
      - 'battleship/**'
      - '.github/workflows/build-battleship.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'battleship/**'
      - '.github/workflows/build-battleship.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android API 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Apply v8 stability patch
        working-directory: battleship
        run: python3 patch_v8.py
      - name: Apply v9 cinematic patch
        working-directory: battleship
        run: python3 patch_v9.py
      - name: Apply v10 tactical damage patch
        working-directory: battleship
        run: python3 patch_v10.py
      - name: Apply v11 Naval Command UI patch
        working-directory: battleship
        run: python3 patch_v11.py
      - name: Apply v12 Flagship Command Center patch
        working-directory: battleship
        run: python3 patch_v12.py
      - name: Apply v13 Combat Command patch
        working-directory: battleship
        run: python3 patch_v13.py
      - name: Build APK
        working-directory: battleship
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Verify APK
        run: |
          test -s battleship/app/build/outputs/apk/debug/app-debug.apk
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose --print-certs battleship/app/build/outputs/apk/debug/app-debug.apk
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging battleship/app/build/outputs/apk/debug/app-debug.apk | grep "package: name='com.mg.battleship'"
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging battleship/app/build/outputs/apk/debug/app-debug.apk | grep "versionCode='13'"
      - name: Rename APK
        run: cp battleship/app/build/outputs/apk/debug/app-debug.apk Amiral_Batti_v13.0_Combat_Command.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Amiral-Batti-v13.0-Combat-Command-APK
          path: Amiral_Batti_v13.0_Combat_Command.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish stable APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="amiral-batti-v13-combat-command"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" Amiral_Batti_v13.0_Combat_Command.apk --clobber
          else
            gh release create "$TAG" Amiral_Batti_v13.0_Combat_Command.apk --title "Amiral Battı v13.0 - Combat Command" --notes "HUD iki satırlı ve taşma yapmayacak şekilde yeniden tasarlandı; gereksiz HUD kutusu kaldırıldı. Düşman filosu başlığı A-J koordinatlarından ayrıldı. Her üçüncü ardışık isabette ek atış sağlayan kritik taktik üstünlük, son düşman atış yönünü gösteren tehdit vektörü, hasara göre alarm seviyesi ve yüksek seviyelerde daha adaptif AI hedefleme eklendi. v12 Taktik Mod, sonar, keşif, görevler, başarımlar, kariyer, Bluetooth ve sinematik batış sistemi korunur."
          fi
