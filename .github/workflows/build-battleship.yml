name: Build Battleship v6 Rotate Realistic Audio APK

on:
  push:
    branches: [ battleship-v1 ]
    paths:
      - 'battleship/**'
      - '.github/workflows/build-battleship.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'battleship/**'
      - '.github/workflows/build-battleship.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android API 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Apply v6 game enhancements
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('battleship/app/src/v4/java/com/mg/battleship/MainActivity.java')
          s=p.read_text()
          old=s
          s=s.replace('margin=dp(18)', 'margin=dp(4)')
          s=s.replace('if(mine)for(int id=0;id<lengths.length;id++)drawShipSide(c,left,top,cell,id);', 'if(mine)for(int id=0;id<lengths.length;id++)AdvancedShipRenderer.draw(c,p,left,top,cell,own,id);')
          s=s.replace('rotateButton=button("Döndür"); randomButton=button("Rastgele"); readyButton=button("Hazır");', 'rotateButton=button("Yön: Yatay"); randomButton=button("Rastgele"); readyButton=button("Hazır");')
          s=s.replace('rotateButton.setOnClickListener(v->{ if(!localReady){ gameView.horizontal=!gameView.horizontal; gameView.invalidate(); }});', 'rotateButton.setOnClickListener(v->{ if(!localReady && !gameView.playing){ gameView.horizontal=!gameView.horizontal; rotateButton.setText(gameView.horizontal?"Yön: Yatay":"Yön: Dikey"); status.setText("Sıradaki gemi "+(gameView.horizontal?"yatay":"dikey")+" yerleştirilecek."); gameView.invalidate(); }});')
          s=s.replace('randomButton.setOnClickListener(v->{ if(!localReady){ gameView.randomizeFleet(); status.setText("Filo hazır. İstersen yerleşimi değiştir."); }});', 'randomButton.setOnClickListener(v->{ if(!localReady){ gameView.randomizeFleet(); rotateButton.setText("Yön: Yatay"); status.setText("Filo hazır. İstersen yerleşimi değiştir."); }});')
          s=s.replace('readyButton.setEnabled(true); rotateButton.setEnabled(true); randomButton.setEnabled(true);', 'readyButton.setEnabled(true); rotateButton.setEnabled(true); randomButton.setEnabled(true); rotateButton.setText("Yön: Yatay");')
          s=s.replace('int receiveShot(int r,int c){hit[r][c]=true;return own[r][c]>=0?2:1;}', 'int receiveShot(int r,int c){hit[r][c]=true;int res=own[r][c]>=0?2:1;if(res==2)BattleEffects.hit(MainActivity.this);else BattleEffects.miss(MainActivity.this);return res;}')
          s=s.replace('int receiveAiShot(int r,int c){aiHit[r][c]=true;return aiFleet[r][c]>=0?2:1;}', 'int receiveAiShot(int r,int c){aiHit[r][c]=true;int res=aiFleet[r][c]>=0?2:1;if(res==2)BattleEffects.hit(MainActivity.this);else BattleEffects.miss(MainActivity.this);return res;}')
          s=s.replace('gameView.enemyMarks[r][c]=res; gameView.invalidate();', 'gameView.enemyMarks[r][c]=res; if(res==2)BattleEffects.hit(MainActivity.this);else BattleEffects.miss(MainActivity.this); gameView.invalidate();')
          p.write_text(s)
          assert 'AdvancedShipRenderer.draw' in s, 'renderer patch missing'
          assert 'Yön: Yatay' in s and 'Yön: Dikey' in s, 'rotate UI patch missing'
          assert s.count('BattleEffects.hit') >= 3, 'audio patches missing'
          assert s != old, 'no source changes applied'
          PY
      - name: Build APK
        working-directory: battleship
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Verify APK
        run: |
          test -s battleship/app/build/outputs/apk/debug/app-debug.apk
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose --print-certs battleship/app/build/outputs/apk/debug/app-debug.apk
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging battleship/app/build/outputs/apk/debug/app-debug.apk | grep "package: name='com.mg.battleship'"
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging battleship/app/build/outputs/apk/debug/app-debug.apk | grep "versionCode='6'"
      - name: Rename APK
        run: cp battleship/app/build/outputs/apk/debug/app-debug.apk Amiral_Batti_v6.0_Aktif_Dondur_Gercekci_Ses.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Amiral-Batti-v6.0-Aktif-Dondur-Gercekci-Ses-APK
          path: Amiral_Batti_v6.0_Aktif_Dondur_Gercekci_Ses.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish stable APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="amiral-batti-v6-rotate-realistic-audio"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" Amiral_Batti_v6.0_Aktif_Dondur_Gercekci_Ses.apk --clobber
          else
            gh release create "$TAG" Amiral_Batti_v6.0_Aktif_Dondur_Gercekci_Ses.apk --title "Amiral Battı v6.0 - Aktif Döndür ve Gerçekçi Ses" --notes "Döndür butonu aktif yön göstergesi; ıskalamada yalnızca su sıçrama, vuruşta tok patlama ve metal gövde darbesi; silah ateş sesi kaldırıldı."
          fi
