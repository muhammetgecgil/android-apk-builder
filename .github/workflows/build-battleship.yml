name: Build Battleship v9 Cinematic Naval Warfare APK

on:
  push:
    branches: [ battleship-v1 ]
    paths:
      - 'battleship/**'
      - '.github/workflows/build-battleship.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'battleship/**'
      - '.github/workflows/build-battleship.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android API 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Apply v8 stability and sinking patch
        working-directory: battleship
        run: python3 patch_v8.py
      - name: Apply v9 cinematic warfare patch
        working-directory: battleship
        run: python3 patch_v9.py
      - name: Build APK
        working-directory: battleship
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Verify APK
        run: |
          test -s battleship/app/build/outputs/apk/debug/app-debug.apk
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose --print-certs battleship/app/build/outputs/apk/debug/app-debug.apk
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging battleship/app/build/outputs/apk/debug/app-debug.apk | grep "package: name='com.mg.battleship'"
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging battleship/app/build/outputs/apk/debug/app-debug.apk | grep "versionCode='9'"
      - name: Rename APK
        run: cp battleship/app/build/outputs/apk/debug/app-debug.apk Amiral_Batti_v9.0_Cinematic_Naval_Warfare.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Amiral-Batti-v9.0-Cinematic-Naval-Warfare-APK
          path: Amiral_Batti_v9.0_Cinematic_Naval_Warfare.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish stable APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="amiral-batti-v9-cinematic-naval-warfare"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" Amiral_Batti_v9.0_Cinematic_Naval_Warfare.apk --clobber
          else
            gh release create "$TAG" Amiral_Batti_v9.0_Cinematic_Naval_Warfare.apk --title "Amiral Battı v9.0 - Cinematic Naval Warfare" --notes "v8 sıra kilitlenmesi ve batış korumaları korunur. Sinematik savaş bannerları, hareketli deniz/radar atmosferi, isabet serisi HUD'u, batırma sahnesi bildirimi, düşman ateşi uyarıları ve iki ardışık isabetten gemi eksenini çıkaran geliştirilmiş AI eklendi."
          fi
