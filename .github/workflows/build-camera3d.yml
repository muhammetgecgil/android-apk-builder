name: Build Camera3D APK

on:
  push:
    branches: [ camera3d-v1 ]
    paths:
      - 'camera3d/**'
      - 'settings.gradle'
      - '.github/workflows/build-camera3d.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build installable debug APK
        run: gradle --no-daemon :camera3d:assembleDebug --stacktrace
      - name: Verify APK signature and package
        run: |
          APK=camera3d/build/outputs/apk/debug/camera3d-debug.apk
          test -s "$APK"
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose "$APK"
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging "$APK" | head -20
          cp "$APK" Camera3D_v1.0.0.apk
      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: Camera3D-v1.0.0-verified
          path: Camera3D_v1.0.0.apk
          if-no-files-found: error
          retention-days: 30
