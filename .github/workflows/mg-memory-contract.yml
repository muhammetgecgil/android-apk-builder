name: Validate MG Memory Engine

on:
  push:
    branches:
      - mg-ai-v0.1-bootstrap
    paths:
      - 'mg-memory-server/**'
      - '.github/workflows/mg-memory-contract.yml'
  pull_request:
    paths:
      - 'mg-memory-server/**'
      - '.github/workflows/mg-memory-contract.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r mg-memory-server/requirements.txt
      - name: Compile Python modules
        run: python -m py_compile mg-memory-server/memory_engine.py mg-memory-server/api.py
      - name: Run contract tests
        run: cd mg-memory-server && python test_memory_engine.py
      - name: Import API
        run: cd mg-memory-server && python -c "import api; assert api.app.title.startswith('MG-AI')"
      - name: Validate Docker Compose
        run: docker compose -f mg-memory-server/docker-compose.yml config >/dev/null
      - name: Verify pgvector schema
        run: grep -q 'CREATE EXTENSION IF NOT EXISTS vector' mg-memory-server/schema.sql
