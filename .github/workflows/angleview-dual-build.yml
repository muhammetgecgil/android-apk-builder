name: AngleView Duo APK

on:
  push:
    branches: ["angleview-dual-v1"]
    paths:
      - "angleview/**"
      - ".github/workflows/angleview-dual-build.yml"
      - "!angleview/releases/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: angleview-dual-v1
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0" >/dev/null

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle -p angleview :app:assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AngleViewDuo-v1.0.0-debug
          path: angleview/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK to branch
        run: |
          mkdir -p angleview/releases
          cp angleview/app/build/outputs/apk/debug/app-debug.apk angleview/releases/AngleViewDuo-v1.0.0-debug.apk
          base64 -w 76 angleview/releases/AngleViewDuo-v1.0.0-debug.apk > angleview/releases/AngleViewDuo-v1.0.0-debug.apk.b64
          sha256sum angleview/releases/AngleViewDuo-v1.0.0-debug.apk > angleview/releases/AngleViewDuo-v1.0.0-debug.apk.sha256
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f angleview/releases/AngleViewDuo-v1.0.0-debug.apk angleview/releases/AngleViewDuo-v1.0.0-debug.apk.b64 angleview/releases/AngleViewDuo-v1.0.0-debug.apk.sha256
          git commit -m "Build AngleView Duo v1.0.0 APK" || exit 0
          git push origin HEAD:angleview-dual-v1
