name: Prepare v108.8 scenery build tools
on:
  push:
    branches: [aircraft-sim-v108-8-realistic-landscape]
    paths: ['.github/workflows/aircraft-v108-8-tools.yml']
permissions: {contents: read}
jobs:
  tools:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Collect reproducible DEX build tools
        run: |
          mkdir -p scenery-tools
          cat > scenery-tools/pom.xml <<'XML'
          <project xmlns="http://maven.apache.org/POM/4.0.0"><modelVersion>4.0.0</modelVersion><groupId>com.mg</groupId><artifactId>scenery-tools</artifactId><version>1</version><dependencies><dependency><groupId>org.smali</groupId><artifactId>smali</artifactId><version>2.5.2</version></dependency><dependency><groupId>org.smali</groupId><artifactId>baksmali</artifactId><version>2.5.2</version></dependency><dependency><groupId>org.eclipse.jdt</groupId><artifactId>ecj</artifactId><version>3.38.0</version></dependency></dependencies></project>
          XML
          mvn -q -f scenery-tools/pom.xml dependency:copy-dependencies -DoutputDirectory=jars
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/d8.jar" scenery-tools/
          cp "$ANDROID_HOME/platforms/android-36/android.jar" scenery-tools/
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" scenery-tools/
          cp "$ANDROID_HOME/build-tools/35.0.0/zipalign" scenery-tools/
          sha256sum scenery-tools/*.jar scenery-tools/jars/*.jar > scenery-tools/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: aircraft-v108-8-build-tools
          path: scenery-tools/
          retention-days: 7
          if-no-files-found: error
