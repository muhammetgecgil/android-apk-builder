name: Export Whiffletree 8.3.0 aligned unsigned
on:
  push:
    branches: [ "main" ]
    paths:
      - '.github/workflows/build-v830-unsigned.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build unsigned release
        working-directory: whiffletree-aero
        run: gradle --no-daemon clean assembleSideloadRelease --stacktrace
      - name: Locate and zipalign
        run: |
          APK=$(find whiffletree-aero/app/build/outputs/apk/sideload/release -type f -name '*.apk' | head -1)
          test -n "$APK"
          $ANDROID_HOME/build-tools/36.0.0/zipalign -f -p 4 "$APK" Whiffletree-Aero-v8.3.0-UNSIGNED-ALIGNED.apk
      - uses: actions/upload-artifact@v4
        with:
          name: whiffletree-v8.3.0-unsigned-aligned
          path: Whiffletree-Aero-v8.3.0-UNSIGNED-ALIGNED.apk
