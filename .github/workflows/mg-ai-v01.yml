name: Build MG-AI v0.55 Stable Update APK

on:
  push:
    branches:
      - mg-ai-v0.1-bootstrap
    paths:
      - 'mg-ai/**'
      - '.github/workflows/mg-ai-v01.yml'
  pull_request:
    paths:
      - 'mg-ai/**'
      - '.github/workflows/mg-ai-v01.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android NDK and CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" "cmake;3.22.1" >/dev/null

      - name: Fetch pinned llama.cpp
        run: |
          rm -rf mg-ai/app/src/main/cpp/llama.cpp
          git clone --filter=blob:none --no-checkout https://github.com/ggml-org/llama.cpp.git mg-ai/app/src/main/cpp/llama.cpp
          git -C mg-ai/app/src/main/cpp/llama.cpp checkout f280b26983ad0fdb705a0d9ebf0503e76f2899b0

      - name: Fetch pinned whisper.cpp
        run: |
          rm -rf mg-ai/app/src/main/cpp/whisper.cpp
          git clone --filter=blob:none --no-checkout https://github.com/ggml-org/whisper.cpp.git mg-ai/app/src/main/cpp/whisper.cpp
          git -C mg-ai/app/src/main/cpp/whisper.cpp checkout v1.9.1

      - name: Verify model manifests
        run: |
          grep -q 'qwen2.5-1.5b-instruct-q4_k_m.gguf' mg-ai/app/src/main/java/com/mgai/app/LocalModelManager.java
          grep -q '6a1a2eb6d15622bf3c96857206351ba97e1af16c30d7a74ee38970e434e9407e' mg-ai/app/src/main/java/com/mgai/app/LocalModelManager.java
          grep -q 'ggml-tiny.bin' mg-ai/app/src/main/java/com/mgai/app/LocalWhisperModelManager.java
          grep -q 'be07e048e1e599ad46341c8d2a135645097a538221678b7acdd1b1919c6e1b21' mg-ai/app/src/main/java/com/mgai/app/LocalWhisperModelManager.java

      - name: Restore stable MG-AI development update key
        run: |
          openssl pkcs12 -export \
            -inkey mg-ai/signing/mg-ai-update-key.pem \
            -in mg-ai/signing/mg-ai-update-cert.pem \
            -name mgai \
            -passout pass:MGAI_Update_2026 \
            -out mg-ai/app/mg-ai-update.jks
          keytool -list -keystore mg-ai/app/mg-ai-update.jks -storepass MGAI_Update_2026 -alias mgai >/dev/null

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build phone-native debug APK
        run: gradle -p mg-ai --no-daemon assembleDebug

      - name: Verify APK, native runtimes, icon and signature
        run: |
          APK=mg-ai/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          unzip -l "$APK" | grep 'lib/arm64-v8a/libmgllama.so'
          unzip -l "$APK" | grep 'lib/arm64-v8a/libmgwhisper.so'
          unzip -l "$APK" | grep 'res/mipmap-anydpi-v26/mg_ai_launcher.xml'
          unzip -l "$APK" | grep 'res/drawable/mg_ai_icon_foreground.xml'
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --print-certs "$APK"

      - name: Upload MG-AI v0.55 APK
        uses: actions/upload-artifact@v4
        with:
          name: MG-AI-v0.55-stable-update-debug
          path: mg-ai/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
