name: Build MG-AI v0.1 APK

on:
  push:
    branches:
      - mg-ai-v0.1-bootstrap
    paths:
      - 'mg-ai/**'
      - '.github/workflows/mg-ai-v01.yml'
  pull_request:
    paths:
      - 'mg-ai/**'
      - '.github/workflows/mg-ai-v01.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle -p mg-ai --no-daemon assembleDebug

      - name: Verify APK exists
        run: test -f mg-ai/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload MG-AI APK
        uses: actions/upload-artifact@v4
        with:
          name: MG-AI-v0.1-debug
          path: mg-ai/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
