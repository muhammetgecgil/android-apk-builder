name: Build Machine Elements Pro APK

on:
  push:
    branches: [ main, 'feature/machine-elements-pro' ]
    paths:
      - 'machine-elements-pro/**'
      - '.github/workflows/build-machine-elements-pro.yml'
  pull_request:
    paths:
      - 'machine-elements-pro/**'
      - '.github/workflows/build-machine-elements-pro.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android API 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Run numerical regression tests
        working-directory: machine-elements-pro
        run: gradle --no-daemon :app:testDebugUnitTest --stacktrace
      - name: Build debug APK
        working-directory: machine-elements-pro
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Verify and rename APK
        run: |
          test -s machine-elements-pro/app/build/outputs/apk/debug/app-debug.apk
          cp machine-elements-pro/app/build/outputs/apk/debug/app-debug.apk Machine_Elements_Pro_v2.3.0.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Machine-Elements-Pro-v2.3.0-APK
          path: Machine_Elements_Pro_v2.3.0.apk
          if-no-files-found: error
          retention-days: 30
