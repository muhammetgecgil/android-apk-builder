name: Build 3D Model Viewer APK

on:
  push:
    branches: [ camera3d-v1 ]
    paths:
      - 'modelviewer/**'
      - 'settings.gradle'
      - '.github/workflows/build-modelviewer.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Create Model Viewer signing key
        run: |
          keytool -genkeypair -v -keystore modelviewer-debug.keystore -storepass modelviewer -alias modelviewer -keypass modelviewer -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=3D Model Viewer,O=Muhammet Gecgil,C=TR"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build installable debug APK
        run: gradle --no-daemon :modelviewer:assembleDebug --stacktrace
      - name: Verify APK signature and package
        run: |
          APK=modelviewer/build/outputs/apk/debug/modelviewer-debug.apk
          test -s "$APK"
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose --print-certs "$APK"
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging "$APK" | head -20
          cp "$APK" ModelViewer_v1.0.0.apk
      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: ModelViewer-v1.0.0-verified
          path: ModelViewer_v1.0.0.apk
          if-no-files-found: error
          retention-days: 30
