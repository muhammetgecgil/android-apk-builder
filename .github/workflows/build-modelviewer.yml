name: Build 3D Model Viewer Engineering Tools

on:
  push:
    branches: [ camera3d-cad-v140-release ]
    paths:
      - 'modelviewer/**'
      - 'settings.gradle'
      - '.github/mg3d-release.jks.b64'
      - '.github/workflows/build-modelviewer.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Restore persistent MG 3D signing key
        run: base64 -d .github/mg3d-release.jks.b64 > mg3d-release.jks
      - name: Apply source upgrades
        run: |
          python3 modelviewer/upgrade_units_playstore.py
          python3 modelviewer/upgrade_cad_v140.py
          python3 modelviewer/upgrade_cad_v160.py
          python3 modelviewer/upgrade_cad_v170.py
          python3 modelviewer/upgrade_cad_v171.py
          python3 modelviewer/upgrade_cad_v172.py
          python3 modelviewer/upgrade_cad_v173.py
          python3 modelviewer/upgrade_cad_v174.py
          python3 modelviewer/upgrade_cad_v175.py
          python3 modelviewer/upgrade_cad_v177.py
          python3 modelviewer/upgrade_cad_v178.py
          sed -i "s/versionCode 15/versionCode 27/" modelviewer/build.gradle
          sed -i "s/versionName '1.3.2'/versionName '1.7.8'/" modelviewer/build.gradle
      - name: Bundle pinned offline CAD engines
        run: |
          set -euxo pipefail
          AS=modelviewer/src/main/assets/cadviewer
          mkdir -p "$AS" /tmp/occt /tmp/three /tmp/assimp
          cd /tmp/occt
          npm pack occt-import-js@0.0.23
          tar -xzf occt-import-js-0.0.23.tgz
          cp package/dist/occt-import-js.js "$GITHUB_WORKSPACE/$AS/occt-import-js.js"
          cp package/dist/occt-import-js.wasm "$GITHUB_WORKSPACE/$AS/occt-import-js.wasm"
          cd /tmp/three
          npm pack three@0.124.0
          tar -xzf three-0.124.0.tgz
          cp package/build/three.min.js "$GITHUB_WORKSPACE/$AS/three.min.js"
          cp package/examples/js/controls/OrbitControls.js "$GITHUB_WORKSPACE/$AS/OrbitControls.js"
          cd /tmp/assimp
          npm pack assimpjs@0.0.10
          tar -xzf assimpjs-0.0.10.tgz
          cp package/dist/assimpjs.js "$GITHUB_WORKSPACE/$AS/assimpjs.js"
          cp package/dist/assimpjs.wasm "$GITHUB_WORKSPACE/$AS/assimpjs.wasm"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build signed APK and AAB
        run: gradle --no-daemon :modelviewer:assembleRelease :modelviewer:bundleRelease --stacktrace
      - name: Verify engineering tools package
        run: |
          APK=modelviewer/build/outputs/apk/release/modelviewer-release.apk
          AAB=modelviewer/build/outputs/bundle/release/modelviewer-release.aab
          test -s "$APK" && test -s "$AAB"
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose --print-certs "$APK" | tee cert.txt
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging "$APK" | tee badging.txt
          grep -q "package: name='com.muhammetgecgil.mg3dmodelviewer'" badging.txt
          grep -q "versionCode='27'" badging.txt
          grep -q "versionName='1.7.8'" badging.txt
          grep -qi "cff09eb09175519edd966d02d00a36027d047b59ba8ca03923a3a44c39615dc7" cert.txt
          unzip -l "$APK" | grep -q 'assets/cadviewer/cad-v178.js'
          unzip -p "$APK" assets/cadviewer/cad-v178.js | grep -q 'twoPoint:true'
          unzip -p "$APK" assets/cadviewer/cad-v178.js | grep -q 'exploded:true'
          unzip -p "$APK" assets/cadviewer/cad-v178.js | grep -q "B('KALINLIK')"
          unzip -p "$APK" assets/cadviewer/cad-v178.js | grep -q "B('DELİKLER')"
          cp "$APK" MG_3D_Model_Viewer_v1.7.8_ENGINEERING_TOOLS.apk
          cp "$AAB" MG_3D_Model_Viewer_v1.7.8_ENGINEERING_TOOLS.aab
          sha256sum MG_3D_Model_Viewer_v1.7.8_ENGINEERING_TOOLS.apk MG_3D_Model_Viewer_v1.7.8_ENGINEERING_TOOLS.aab > SHA256SUMS.txt
      - name: Upload verified build
        uses: actions/upload-artifact@v4
        with:
          name: MG-3D-Model-Viewer-v1.7.8-ENGINEERING-TOOLS
          path: |
            MG_3D_Model_Viewer_v1.7.8_ENGINEERING_TOOLS.apk
            MG_3D_Model_Viewer_v1.7.8_ENGINEERING_TOOLS.aab
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
      - name: Record successful run id
        run: |
          mkdir -p build-status
          printf 'run_id=%s\nsha=%s\nartifact=%s\n' "${GITHUB_RUN_ID}" "${GITHUB_SHA}" "MG-3D-Model-Viewer-v1.7.8-ENGINEERING-TOOLS" > build-status/MODELVIEWER_LAST_SUCCESS.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add build-status/MODELVIEWER_LAST_SUCCESS.txt
          git commit -m 'Record successful model viewer build [skip ci]' || exit 0
          git push
