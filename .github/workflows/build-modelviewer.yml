name: Build MG CAD PRO 2.0.6
on:
  push:
    branches: [ camera3d-cad-v140-release ]
    paths: [ 'modelviewer/**', 'settings.gradle', '.github/mg3d-release.jks.b64', '.github/workflows/build-modelviewer.yml' ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - run: base64 -d .github/mg3d-release.jks.b64 > mg3d-release.jks
      - name: Apply CAD upgrades
        run: |
          python3 modelviewer/upgrade_units_playstore.py
          for v in 140 160 170 171 172 173 174 175 177 178 179 180 181 182 183 184 185 186 187 188 189 190 191 192 193 194 195 196 197 199 200 201 202 203 204 205 206; do python3 modelviewer/upgrade_cad_v${v}.py; done
          sed -i "s/versionCode 15/versionCode 54/" modelviewer/build.gradle
          sed -i "s/versionName '1.3.2'/versionName '2.0.6'/" modelviewer/build.gradle
      - name: Bundle offline CAD engines
        run: |
          set -euxo pipefail
          AS=modelviewer/src/main/assets/cadviewer; mkdir -p "$AS" /tmp/occt /tmp/three /tmp/assimp
          cd /tmp/occt; npm pack occt-import-js@0.0.23; tar -xzf occt-import-js-0.0.23.tgz; cp package/dist/occt-import-js.js package/dist/occt-import-js.wasm "$GITHUB_WORKSPACE/$AS/"
          cd /tmp/three; npm pack three@0.124.0; tar -xzf three-0.124.0.tgz; cp package/build/three.min.js package/examples/js/controls/OrbitControls.js "$GITHUB_WORKSPACE/$AS/"
          cd /tmp/assimp; npm pack assimpjs@0.0.10; tar -xzf assimpjs-0.0.10.tgz; cp package/dist/assimpjs.js package/dist/assimpjs.wasm "$GITHUB_WORKSPACE/$AS/"
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.11.1' }
      - run: gradle --no-daemon :modelviewer:assembleRelease :modelviewer:bundleRelease --stacktrace
      - name: Verify v2.0.6
        run: |
          APK=modelviewer/build/outputs/apk/release/modelviewer-release.apk; AAB=modelviewer/build/outputs/bundle/release/modelviewer-release.aab
          test -s "$APK" && test -s "$AAB"
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose --print-certs "$APK" | tee cert.txt
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging "$APK" | tee badging.txt
          grep -q "package: name='com.muhammetgecgil.mg3dmodelviewer'" badging.txt
          grep -q "versionCode='54'" badging.txt; grep -q "versionName='2.0.6'" badging.txt
          grep -qi "cff09eb09175519edd966d02d00a36027d047b59ba8ca03923a3a44c39615dc7" cert.txt
          unzip -p "$APK" assets/cadviewer/cad-v206.js | grep -q 'sectionMinusBesidePlus:true'
          unzip -p "$APK" assets/cadviewer/cad-v206.js | grep -q 'bottomToolbarShiftRight:true'
          cp "$APK" MG_CAD_PRO_v2.0.6_SECTION_ALIGNMENT.apk; cp "$AAB" MG_CAD_PRO_v2.0.6_SECTION_ALIGNMENT.aab
          sha256sum MG_CAD_PRO_v2.0.6_SECTION_ALIGNMENT.apk MG_CAD_PRO_v2.0.6_SECTION_ALIGNMENT.aab > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: MG-CAD-PRO-v2.0.6-SECTION-ALIGNMENT
          path: |
            MG_CAD_PRO_v2.0.6_SECTION_ALIGNMENT.apk
            MG_CAD_PRO_v2.0.6_SECTION_ALIGNMENT.aab
            SHA256SUMS.txt
          if-no-files-found: error
      - name: Record v2.0.6 successful run id
        run: |
          mkdir -p build-status
          printf 'run_id=%s\nsha=%s\nartifact=%s\n' "${GITHUB_RUN_ID}" "${GITHUB_SHA}" "MG-CAD-PRO-v2.0.6-SECTION-ALIGNMENT" > build-status/MODELVIEWER_V206_LAST_SUCCESS.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add build-status/MODELVIEWER_V206_LAST_SUCCESS.txt
          git commit -m 'Record successful v2.0.6 build [skip ci]' || exit 0
          git push
