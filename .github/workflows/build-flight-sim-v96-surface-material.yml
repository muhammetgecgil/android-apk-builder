name: Build Aircraft Simulator v96 Surface Material Realism

on:
  push:
    branches: [ aircraft-sim-v96-surface-material-realism ]
    paths:
      - 'flight-sim/**'
      - '.github/workflows/build-flight-sim-v96-surface-material.yml'
  workflow_dispatch:

permissions: { contents: read }

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.13' }

      - name: Apply v87 safe flight fixes
        run: python3 flight-sim/tools/apply_v87_safe_fixes.py
      - name: Apply v88 mechanical dynamics
        run: python3 flight-sim/tools/apply_v88_mechanical_upgrade.py
      - name: Apply v88 wing and control-surface geometry
        run: python3 flight-sim/tools/apply_v88_wing_geometry.py
      - name: Apply v88 true control-surface airfoils
        run: python3 flight-sim/tools/apply_v88_control_surface_airfoils.py
      - name: Apply v89 fighter control surfaces
        run: python3 flight-sim/tools/apply_v89_fighter_control_surfaces.py
      - name: Apply v90 fighter lighting
        run: python3 flight-sim/tools/apply_v90_fighter_lighting.py
      - name: Apply v91 attached wingtip lighting
        run: python3 flight-sim/tools/apply_v91_wingtip_lighting.py
      - name: Apply v92 fighter audio
        run: python3 flight-sim/tools/apply_v92_fighter_audio.py
      - name: Apply v93 variable nozzle
        run: python3 flight-sim/tools/apply_v93_variable_nozzle.py
      - name: Normalize v93 nozzle mesh primitives
        run: python3 flight-sim/tools/apply_v93_nozzle_compile_fix.py
      - name: Normalize runtime layering for v94
        run: python3 flight-sim/tools/apply_v94_runtime_anchor_compat.py
      - name: Apply v94 supersonic flight
        run: python3 flight-sim/tools/apply_v94_supersonic_flight.py
      - name: Apply v95 airfield/environment realism
        run: python3 flight-sim/tools/apply_v95_airfield_environment.py
      - name: Apply v96 surface/material realism
        run: python3 flight-sim/tools/apply_v96_surface_material_realism.py

      - name: Verify v96 source integration
        run: |
          grep -q 'RADOME=50f' flight-sim/app/src/main/java/com/mg/fixturecockpitsim/visual/RealisticFighterMesh.java
          grep -q 'surfaceDetailUpgrade' flight-sim/app/src/main/java/com/mg/fixturecockpitsim/visual/RealisticFighterMesh.java
          grep -q 'RAM_TAPE=51f' flight-sim/app/src/main/java/com/mg/fixturecockpitsim/visual/RealisticFighterMesh.java
          grep -q 'rough=.70;metal=.005' flight-sim/app/src/main/java/com/mg/fixturecockpitsim/Jet3DView.java
          grep -q 'rough=.98;metal=.00' flight-sim/app/src/main/java/com/mg/fixturecockpitsim/Jet3DView.java
          grep -q 'class SurfaceMaterialProfile' flight-sim/app/src/main/java/com/mg/fixturecockpitsim/sim/SurfaceMaterialProfile.java
          grep -q 'versionCode 96' flight-sim/app/build.gradle

      - name: Surface material tests (blocking)
        working-directory: flight-sim
        run: gradle --no-daemon :app:testDebugUnitTest --tests 'com.mg.fixturecockpitsim.sim.SurfaceMaterialProfileTest' --stacktrace
      - name: Environment realism tests (blocking)
        working-directory: flight-sim
        run: gradle --no-daemon :app:testDebugUnitTest --tests 'com.mg.fixturecockpitsim.sim.EnvironmentRealismModelTest' --stacktrace
      - name: Supersonic model tests (blocking)
        working-directory: flight-sim
        run: gradle --no-daemon :app:testDebugUnitTest --tests 'com.mg.fixturecockpitsim.sim.SupersonicFlightModelTest' --stacktrace
      - name: Fighter sound model tests (blocking)
        working-directory: flight-sim
        run: gradle --no-daemon :app:testDebugUnitTest --tests 'com.mg.fixturecockpitsim.sim.FighterSoundModelTest' --stacktrace
      - name: Fighter FCS tests (blocking)
        working-directory: flight-sim
        run: gradle --no-daemon :app:testDebugUnitTest --tests 'com.mg.fixturecockpitsim.sim.FighterFlightControlSystemTest' --stacktrace
      - name: Fighter lighting tests (blocking)
        working-directory: flight-sim
        run: gradle --no-daemon :app:testDebugUnitTest --tests 'com.mg.fixturecockpitsim.sim.FighterLightingSystemTest' --stacktrace
      - name: Legacy unit tests (non-blocking during AVM migration)
        continue-on-error: true
        working-directory: flight-sim
        run: gradle --no-daemon :app:testDebugUnitTest --stacktrace

      - name: Build v96 debug APK and Play outputs
        working-directory: flight-sim
        run: gradle --no-daemon clean :app:assembleDebug :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Verify package, v96, signature and approved icon
        run: |
          APK=flight-sim/app/build/outputs/apk/debug/app-debug.apk
          REL=flight-sim/app/build/outputs/apk/release/app-release-unsigned.apk
          AAB=flight-sim/app/build/outputs/bundle/release/app-release.aab
          test -s "$APK" && test -s "$REL" && test -s "$AAB"
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose --print-certs "$APK"
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging "$APK" | grep "package: name='com.mg.fixturecockpitsim.dev'"
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging "$APK" | grep "versionCode='96'"
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging "$APK" | grep "versionName='26.14-avm25.0-surface-material-realism-debug'"
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging "$APK" | grep "targetSdkVersion:'36'"
          unzip -l "$APK" | grep 'ic_aircraft_simulator_final'

      - name: Prepare v96 artifacts
        run: |
          cp flight-sim/app/build/outputs/apk/debug/app-debug.apk Aircraft_Simulator_3D_v96_Surface_Material_Realism_Test.apk
          cp flight-sim/app/build/outputs/apk/release/app-release-unsigned.apk Aircraft_Simulator_3D_v96_Release_Unsigned.apk
          cp flight-sim/app/build/outputs/bundle/release/app-release.aab Aircraft_Simulator_3D_v96_Play_Unsigned.aab
          sha256sum Aircraft_Simulator_3D_v96_Surface_Material_Realism_Test.apk > Aircraft_Simulator_3D_v96_Surface_Material_Realism_Test.sha256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Aircraft-Simulator-3D-v96-Surface-Material-Realism
          path: |
            Aircraft_Simulator_3D_v96_Surface_Material_Realism_Test.apk
            Aircraft_Simulator_3D_v96_Surface_Material_Realism_Test.sha256.txt
            Aircraft_Simulator_3D_v96_Release_Unsigned.apk
            Aircraft_Simulator_3D_v96_Play_Unsigned.aab
          if-no-files-found: error
          retention-days: 30
