name: Build MG VeinAssist APK

on:
  push:
    branches: [ main ]
    paths:
      - 'veinassist/**'
      - '!veinassist/releases/**'
      - '.github/workflows/build-veinassist.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Apply VeinAssist v3.9 wrist tracking patch
        run: python3 veinassist/upgrade_v39.py

      - name: Build VeinAssist debug APK
        working-directory: veinassist
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Validate installability
        shell: bash
        run: |
          set -euo pipefail
          APK="veinassist/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 -v 4 "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee veinassist-apk-badging.txt
          grep -q "package: name='com.mg.veinassist.wristtrack39'" veinassist-apk-badging.txt
          grep -q "sdkVersion:'26'" veinassist-apk-badging.txt
          grep -q "targetSdkVersion:'35'" veinassist-apk-badging.txt

      - name: Rename validated APK
        run: cp veinassist/app/build/outputs/apk/debug/app-debug.apk MG_VeinAssist_v3.9_Wrist_Track.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MG-VeinAssist-v3.9-WRIST-TRACK-APK
          path: |
            MG_VeinAssist_v3.9_Wrist_Track.apk
            veinassist-apk-badging.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish direct APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: veinassist-v3.9-wrist-track
          name: MG VeinAssist v3.9 Wrist Track
          make_latest: false
          files: MG_VeinAssist_v3.9_Wrist_Track.apk

      - name: Store validated APK in repository
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p veinassist/releases
          cp MG_VeinAssist_v3.9_Wrist_Track.apk veinassist/releases/MG_VeinAssist_v3.9_Wrist_Track.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add veinassist/releases/MG_VeinAssist_v3.9_Wrist_Track.apk
          if git diff --cached --quiet; then
            echo "APK already stored"
          else
            git commit -m "Store validated VeinAssist v3.9 APK [skip ci]"
            git push
          fi
