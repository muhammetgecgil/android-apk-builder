name: Build MG VeinAssist APK

on:
  push:
    branches: [ main ]
    paths:
      - 'veinassist/**'
      - '.github/workflows/build-veinassist.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Apply VeinAssist v3.1 algorithm patch
        run: python3 veinassist/upgrade_v31.py

      - name: Build VeinAssist debug APK
        working-directory: veinassist
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp veinassist/app/build/outputs/apk/debug/app-debug.apk MG_VeinAssist_v3.1_Continuity200_Transparent.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MG-VeinAssist-v3.1-APK
          path: MG_VeinAssist_v3.1_Continuity200_Transparent.apk
          if-no-files-found: error
          retention-days: 30
