name: CI Türk Radyo PR

on:
  pull_request:
    paths:
      - 'turkradyo-playstore/**'
      - '.github/workflows/build-turkradyo-play.yml'
      - '.github/workflows/ci-turkradyo-pr.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install API 36
        run: yes | sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Gradle 9.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'

      - name: Restore UI asset
        working-directory: turkradyo-playstore
        run: |
          cat app/src/main/assets/index.html.gz.b64.part* | tr -d '\n\r ' | base64 -d > app/src/main/assets/index.html.gz
          gzip -t app/src/main/assets/index.html.gz

      - name: Lint and official Android build
        working-directory: turkradyo-playstore
        run: gradle :app:lintRelease :app:assembleDebug :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Upload official outputs
        uses: actions/upload-artifact@v4
        with:
          name: turkradyo-official-gradle
          if-no-files-found: error
          path: |
            turkradyo-playstore/app/build/outputs/apk/debug/*.apk
            turkradyo-playstore/app/build/outputs/apk/release/*.apk
            turkradyo-playstore/app/build/outputs/bundle/release/*.aab
            turkradyo-playstore/app/build/reports/lint-results-release.*
