name: CI Türk Radyo PR

on:
  pull_request:
    paths:
      - 'turkradyo/**'
      - '.github/workflows/build-turkradyo-play.yml'
      - '.github/workflows/ci-turkradyo-pr.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false

      - name: Install API 36
        run: yes | sdkmanager --licenses >/dev/null || true; sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'platform-tools'

      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build installable APK and Play bundle
        working-directory: turkradyo
        run: gradle --no-daemon clean assembleDebug bundleRelease --stacktrace

      - name: Verify installable test APK identity and signature
        run: python3 turkradyo/tests/verify-test-apk.py

      - name: Package complete source
        run: |
          rm -rf /tmp/turkradyo-source
          mkdir -p /tmp/turkradyo-source
          cp -a turkradyo/. /tmp/turkradyo-source/
          rm -rf /tmp/turkradyo-source/app/build /tmp/turkradyo-source/.gradle
          cd /tmp
          zip -qr "$GITHUB_WORKSPACE/TurkRadyo-v2.9.3-Source.zip" turkradyo-source

      - name: Upload APK and bundle
        uses: actions/upload-artifact@v4
        with:
          name: turkradyo-v2.9.3-build
          if-no-files-found: error
          path: |
            turkradyo/app/build/outputs/apk/debug/*.apk
            turkradyo/app/build/outputs/bundle/release/*.aab

      - name: Upload complete source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: turkradyo-v2.9.3-source
          if-no-files-found: error
          path: TurkRadyo-v2.9.3-Source.zip
