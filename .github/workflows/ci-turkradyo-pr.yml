name: CI Türk Radyo PR

on:
  pull_request:
    paths:
      - 'turkradyo/**'
      - '.github/workflows/build-turkradyo-play.yml'
      - '.github/workflows/ci-turkradyo-pr.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install API 36
        run: yes | sdkmanager --licenses >/dev/null || true; sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'platform-tools'

      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build installable APK
        working-directory: turkradyo
        run: gradle --no-daemon clean assembleDebug bundleRelease --stacktrace

      - name: Upload APK and bundle
        uses: actions/upload-artifact@v4
        with:
          name: turkradyo-v2.0.2
          if-no-files-found: error
          path: |
            turkradyo/app/build/outputs/apk/debug/*.apk
            turkradyo/app/build/outputs/bundle/release/*.aab
