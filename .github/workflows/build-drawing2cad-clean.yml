name: Build MG CAD Studio v2.0 APK
on:
  push:
    branches: [ main ]
    paths: [ 'drawing2cad/**', '.github/workflows/build-drawing2cad-clean.yml' ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build MG CAD Studio v2.0
        working-directory: drawing2cad
        run: gradle --no-daemon clean :app:assembleDebug --stacktrace
      - name: Verify APK
        run: |
          test -s drawing2cad/app/build/outputs/apk/debug/app-debug.apk
          cp drawing2cad/app/build/outputs/apk/debug/app-debug.apk MG_CAD_Studio_v2.0_Bidirectional.apk
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging MG_CAD_Studio_v2.0_Bidirectional.apk | head -20
          unzip -t MG_CAD_Studio_v2.0_Bidirectional.apk >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: MG-CAD-Studio-v2.0-Bidirectional-APK
          path: MG_CAD_Studio_v2.0_Bidirectional.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish APK in repo
        run: |
          mkdir -p releases
          cp MG_CAD_Studio_v2.0_Bidirectional.apk releases/MG_CAD_Studio_v2.0_Bidirectional.apk
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add releases/MG_CAD_Studio_v2.0_Bidirectional.apk
          git commit -m 'Publish verified MG CAD Studio v2.0 Bidirectional APK [skip ci]' || exit 0
          git push
