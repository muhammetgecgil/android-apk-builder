name: Validate MG-Core Model Registry
on:
  push:
    branches: [mg-ai-v0.1-bootstrap]
    paths: ['mg-core-server/model_registry_control.py','mg-core-server/test_model_registry_control.py','.github/workflows/mg-core-registry.yml']
  pull_request:
    paths: ['mg-core-server/model_registry_control.py','mg-core-server/test_model_registry_control.py','.github/workflows/mg-core-registry.yml']
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m py_compile mg-core-server/model_registry_control.py
      - run: PYTHONPATH=mg-core-server python mg-core-server/test_model_registry_control.py
