name: Screenshot TurkRadyo v2.5.7

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/screenshot-turkradyo-v257.yml'

jobs:
  screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Force Profile 2 only in screenshot build
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('turkradyo/app/src/main/assets/index.html')
          s=p.read_text()
          s=s.replace('<body>', "<body><script>try{localStorage.p2Active='1'}catch(e){}</script>", 1)
          p.write_text(s)
          PY
      - name: Build debug APK
        working-directory: turkradyo
        run: gradle --no-daemon assembleDebug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run app and capture Profile 2
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: aosp_atd
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: |
            adb install -r turkradyo/app/build/outputs/apk/debug/app-debug.apk
            adb shell pm grant com.muhammetgecgil.turkradyo android.permission.POST_NOTIFICATIONS || true
            adb shell settings put global window_animation_scale 0
            adb shell settings put global transition_animation_scale 0
            adb shell settings put global animator_duration_scale 0
            adb shell am force-stop com.muhammetgecgil.turkradyo
            adb shell am start -W -n com.muhammetgecgil.turkradyo/.MainActivity
            sleep 12
            adb shell input keyevent 4 || true
            sleep 2
            adb shell screencap -p /sdcard/turkradyo-top.png
            adb pull /sdcard/turkradyo-top.png turkradyo-top.png
            adb shell input swipe 540 1900 540 650 900
            sleep 2
            adb shell input swipe 540 1900 540 650 900
            sleep 3
            adb shell screencap -p /sdcard/turkradyo-cards.png
            adb pull /sdcard/turkradyo-cards.png turkradyo-cards.png
      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: TurkRadyo-v2.5.7-Emulator-Screenshots-Clean
          path: |
            turkradyo-top.png
            turkradyo-cards.png
          if-no-files-found: error
          retention-days: 7
