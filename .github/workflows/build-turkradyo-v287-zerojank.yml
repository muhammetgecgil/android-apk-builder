name: Build TurkRadyo v2.8.7 ZeroJank

on:
  push:
    branches:
      - 'dev/turkradyo-v2.8.7-freeze-fix'
    paths:
      - 'turkradyo/**'
      - '.github/workflows/build-turkradyo-v287-zerojank.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Fix stable-reset syntax in candidate workspace
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('turkradyo/app/src/main/java/com/muhammetgecgil/turkradyo/RadioService.java')
          s=p.read_text()
          old='private void armStableReset(){cancelStable();stableTask=()->{if(player!=null&&!userPaused)try{if(player.isPlaying()){sameSourceRetries=0;reconnectAttempts=0;recoveryBusy=false;PlaybackGuardian.recovered(this);saveTelemetry();}}catch(Exception ignored){};handler.postDelayed(stableTask,STABLE_RESET_MS);}'
          new='private void armStableReset(){cancelStable();stableTask=()->{if(player!=null&&!userPaused){try{if(player.isPlaying()){sameSourceRetries=0;reconnectAttempts=0;recoveryBusy=false;PlaybackGuardian.recovered(this);saveTelemetry();}}catch(Exception ignored){}}};handler.postDelayed(stableTask,STABLE_RESET_MS);}'
          if old not in s: raise SystemExit('expected syntax line not found')
          p.write_text(s.replace(old,new))
          PY
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install API 36 SDK
        run: yes | sdkmanager --licenses >/dev/null || true; sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'platform-tools'
      - name: Verify v2.8.7 identity
        run: grep -q "versionCode 287" turkradyo/app/build.gradle && grep -q "versionName '2.8.7'" turkradyo/app/build.gradle
      - name: Build APK
        working-directory: turkradyo
        run: gradle --no-daemon clean assembleDebug
      - name: Stage APK
        run: |
          mkdir -p dist
          cp turkradyo/app/build/outputs/apk/debug/app-debug.apk dist/TurkRadyo-v2.8.7-ZeroJank-Debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TurkRadyo-v2.8.7-ZeroJank-APK
          path: dist/TurkRadyo-v2.8.7-ZeroJank-Debug.apk
          if-no-files-found: error
          retention-days: 30
