name: Build MG Tennis TV APK
on:
  push:
    branches: [ feature/mg-tennis-tv-v1 ]
    paths: [ 'mg-tennis-tv/**', '.github/workflows/build-mg-tennis-tv.yml' ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Restore signing key
        run: base64 -d mg-tennis-tv/signing/mg-tennis-update.jks.b64 > mg-tennis-tv/signing/mg-tennis-update.jks
      - name: Prepare runtime assets
        run: |
          set -euo pipefail
          A=mg-tennis-tv/app/src/main/assets
          curl --retry 4 -fL https://unpkg.com/three@0.128.0/build/three.min.js -o $A/three.min.js
          curl --retry 4 -fL https://unpkg.com/three@0.128.0/examples/js/loaders/GLTFLoader.js -o $A/GLTFLoader.js
          BASE=https://raw.githubusercontent.com/ibrews/VitruvianGodot/main/godot_project
          curl --retry 4 -fL $BASE/vitruvian_body.glb -o $A/v33_body.glb
          curl --retry 4 -fL $BASE/vitruvian_head.glb -o $A/v33_head.glb
          curl --retry 4 -fL $BASE/vitruvian_hair_rigged.glb -o $A/v33_hair.glb
          for f in vit_body_bc.png vit_body_n.png vit_body_rough.png vit_face_bc.png vit_face_n.png vit_face_rough.png vit_fabric_n.png vit_hair_ao.png vit_hair_atlas.png vit_hair_diffuse.png vit_hair_normal.png vit_hair_opacity.png vit_iris.png vit_lash_atlas.png vit_mouth.png vit_sclera.png; do curl --retry 4 -fL $BASE/$f -o $A/$f; done
          test -s $A/product-core-v72.js
      - name: Inject product layers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('mg-tennis-tv/app/src/main/assets/index.html');s=p.read_text()
          s=s.replace('let scene,camera,renderer,clock,loader,player,opponent,','var scene,camera,renderer,clock,loader,player,opponent,').replace('let ballVel=new THREE.Vector3(),ballTrail=[];','var ballVel=new THREE.Vector3(),ballTrail=[];')
          scripts=['difficulty-v24.js','tennis-rules-v22.js','gameplay-feedback-v26.js','tv-mode-v29.js','gameplay-v30.js','visual-gameplay-v31.js','player-ball-v32.js','ultra-human-v33.js','clean-core-v37.js','gameplay-v40.js','product-core-v41.js','gameplay-v42.js','gameplay-v43.js','gameplay-v44.js','product-core-v45.js','product-core-v46.js','product-core-v47.js','product-core-v48.js','product-core-v49.js','product-core-v50.js','product-core-v51.js','product-core-v52.js','product-core-v53.js','product-core-v58.js','product-core-v59.js','product-core-v60.js','product-core-v61.js','product-core-v62.js','product-core-v63.js','product-core-v64.js','product-core-v65.js','product-core-v66.js','product-core-v67.js','product-core-v68.js','product-core-v69.js','product-core-v70.js','product-core-v71.js','product-core-v72.js']
          for old in ['match-start-v34.js','role-start-v38.js','gameplay-v36.js','gameplay-v39.js','product-core-v54.js','product-core-v55.js','product-core-v56.js','product-core-v57.js']:s=s.replace(f'<script src="{old}"></script>','')
          for fn in scripts:
              if fn not in s:s=s.replace('</body>',f'<script src="{fn}"></script></body>')
          p.write_text(s)
          PY
      - name: JavaScript syntax check
        run: |
          node --check mg-tennis-tv/app/src/main/assets/product-core-v69.js
          node --check mg-tennis-tv/app/src/main/assets/product-core-v70.js
          node --check mg-tennis-tv/app/src/main/assets/product-core-v71.js
          node --check mg-tennis-tv/app/src/main/assets/product-core-v72.js
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
      - run: yes | sdkmanager 'platforms;android-35' 'build-tools;35.0.0' >/dev/null
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.10.2'}
      - name: Build release APK
        working-directory: mg-tennis-tv
        run: gradle --no-daemon assembleRelease
      - name: Verify release
        run: |
          APK=mg-tennis-tv/app/build/outputs/apk/release/app-release.apk
          test -s $APK
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose $APK
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging $APK | grep "versionCode='72'"
          unzip -p $APK assets/index.html | grep -q 'product-core-v72.js'
          unzip -p $APK assets/product-core-v72.js | grep -q 'COLOR_TENNIS_KIT_AND_PRODUCT_POLISH'
          cp $APK MG_Tennis_TV_v7.2_Color_Tennis_Product.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MG-Tennis-TV-v7.2-Color-Tennis-Product-APK
          path: MG_Tennis_TV_v7.2_Color_Tennis_Product.apk
          retention-days: 30
