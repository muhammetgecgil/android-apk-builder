name: Build MG Tennis TV APK

on:
  push:
    branches: [ feature/mg-tennis-tv-v1 ]
    paths:
      - 'mg-tennis-tv/**'
      - '.github/workflows/build-mg-tennis-tv.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish run id
        run: |
          mkdir -p build-status
          echo "$GITHUB_RUN_ID" > build-status/mg-tennis-tv-run.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build-status/mg-tennis-tv-run.txt
          git commit -m "Record MG Tennis TV run $GITHUB_RUN_ID" || true
          git push

      - name: Restore stable signing keystore
        run: |
          set -euo pipefail
          base64 -d mg-tennis-tv/signing/mg-tennis-update.jks.b64 > mg-tennis-tv/signing/mg-tennis-update.jks
          test -s mg-tennis-tv/signing/mg-tennis-update.jks

      - name: Prepare realistic 3D runtime assets
        run: |
          set -euo pipefail
          ASSETS="mg-tennis-tv/app/src/main/assets"
          mkdir -p "$ASSETS"
          curl --retry 4 --retry-delay 2 -fL "https://unpkg.com/three@0.128.0/build/three.min.js" -o "$ASSETS/three.min.js"
          curl --retry 4 --retry-delay 2 -fL "https://unpkg.com/three@0.128.0/examples/js/loaders/GLTFLoader.js" -o "$ASSETS/GLTFLoader.js"
          curl --retry 4 --retry-delay 2 -fL "https://raw.githubusercontent.com/kunalkushwaha/vsim/main/packages/assets/library/human.glb" -o "$ASSETS/human.glb"
          curl --retry 4 --retry-delay 2 -fL "https://raw.githubusercontent.com/kunalkushwaha/vsim/main/packages/assets/library/man.glb" -o "$ASSETS/man.glb"
          curl --retry 4 --retry-delay 2 -fL "https://raw.githubusercontent.com/kunalkushwaha/vsim/main/packages/assets/library/CREDITS.md" -o "$ASSETS/THIRD_PARTY_ASSET_CREDITS.md"
          test $(stat -c%s "$ASSETS/human.glb") -gt 1000000
          test $(stat -c%s "$ASSETS/man.glb") -gt 1000000
          test $(stat -c%s "$ASSETS/three.min.js") -gt 100000

      - name: Fix WebGL startup compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('mg-tennis-tv/app/src/main/assets/index.html')
          s=p.read_text()
          old="function buildFirstPersonArm(){const skin=new THREE.MeshStandardMaterial({color:0xb97d5d,roughness:.68});fpForearm=new THREE.Mesh(new THREE.CapsuleGeometry(.055,.38,8,12),skin);fpForearm.castShadow=true;fpHand=new THREE.Mesh(new THREE.CapsuleGeometry(.07,.12,8,12),skin);fpHand.castShadow=true;scene.add(fpForearm,fpHand)}"
          new="function buildFirstPersonArm(){const skin=new THREE.MeshStandardMaterial({color:0xb97d5d,roughness:.68});fpForearm=new THREE.Mesh(new THREE.CylinderGeometry(.055,.065,.48,16),skin);fpForearm.castShadow=true;fpHand=new THREE.Mesh(new THREE.SphereGeometry(.075,16,12),skin);fpHand.scale.set(1,.75,1.25);fpHand.castShadow=true;scene.add(fpForearm,fpHand)}"
          if old not in s:
              raise SystemExit('Expected incompatible CapsuleGeometry code not found')
          s=s.replace(old,new)
          s=s.replace("<p>Gerçek kort, salon ve rakip hazırlanıyor…</p>","<p id=\"loadmsg\">3D motor başlatılıyor…</p>")
          s=s.replace("function loadCharacters(){loadOne('human.glb',true,()=>{totalLoaded++;$('loadfill').style.width='55%';finish()});loadOne('man.glb',false,()=>{totalLoaded++;$('loadfill').style.width='90%';finish()})}","function loadCharacters(){$('loadmsg').textContent='Oyuncu modelleri yükleniyor…';$('loadfill').style.width='22%';loadOne('human.glb',true,()=>{totalLoaded++;$('loadfill').style.width='55%';finish()});loadOne('man.glb',false,()=>{totalLoaded++;$('loadfill').style.width='90%';finish()})}")
          p.write_text(s)
          assert 'CapsuleGeometry' not in s
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android API 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build update-compatible APK
        working-directory: mg-tennis-tv
        run: gradle --no-daemon :app:assembleRelease --stacktrace
      - name: Verify APK and stable signature
        run: |
          APK="mg-tennis-tv/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose --print-certs "$APK"
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging "$APK" | grep "package: name='com.mg.tennistv'"
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging "$APK" | grep "versionCode='7'"
          unzip -p "$APK" assets/index.html | grep 'CylinderGeometry'
          ! unzip -p "$APK" assets/index.html | grep -q 'CapsuleGeometry'
          unzip -l "$APK" | grep 'assets/human.glb'
          unzip -l "$APK" | grep 'assets/man.glb'
      - name: Rename APK
        run: cp mg-tennis-tv/app/build/outputs/apk/release/app-release.apk MG_Tennis_TV_FirstPerson_v0.7_StartupFix.apk
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: MG-Tennis-TV-FirstPerson-v0.7-StartupFix-APK
          path: MG_Tennis_TV_FirstPerson_v0.7_StartupFix.apk
          if-no-files-found: error
          retention-days: 30
