name: Build MG Tennis TV APK

on:
  push:
    branches: [ feature/mg-tennis-tv-v1 ]
    paths:
      - 'mg-tennis-tv/**'
      - '.github/workflows/build-mg-tennis-tv.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android API 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build APK
        working-directory: mg-tennis-tv
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Verify APK
        run: |
          test -s mg-tennis-tv/app/build/outputs/apk/debug/app-debug.apk
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose --print-certs mg-tennis-tv/app/build/outputs/apk/debug/app-debug.apk
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging mg-tennis-tv/app/build/outputs/apk/debug/app-debug.apk | grep "package: name='com.mg.tennistv'"
      - name: Rename APK
        run: cp mg-tennis-tv/app/build/outputs/apk/debug/app-debug.apk MG_Tennis_TV_v0.1.apk
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: MG-Tennis-TV-v0.1-APK
          path: MG_Tennis_TV_v0.1.apk
          if-no-files-found: error
          retention-days: 30
