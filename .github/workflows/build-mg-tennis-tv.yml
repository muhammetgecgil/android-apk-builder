name: Build MG Tennis TV APK
on:
  push:
    branches: [ feature/mg-tennis-tv-v1 ]
    paths: [ 'mg-tennis-tv/**', '.github/workflows/build-mg-tennis-tv.yml' ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Publish run id
        run: |
          mkdir -p build-status
          echo "$GITHUB_RUN_ID" > build-status/mg-tennis-tv-run.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build-status/mg-tennis-tv-run.txt
          git commit -m "Record MG Tennis TV run $GITHUB_RUN_ID" || true
          git push
      - name: Restore stable signing keystore
        run: |
          base64 -d mg-tennis-tv/signing/mg-tennis-update.jks.b64 > mg-tennis-tv/signing/mg-tennis-update.jks
          test -s mg-tennis-tv/signing/mg-tennis-update.jks
      - name: Prepare offline 3D runtime
        run: |
          set -euo pipefail
          A=mg-tennis-tv/app/src/main/assets
          curl --retry 4 -fL https://unpkg.com/three@0.128.0/build/three.min.js -o $A/three.min.js
          curl --retry 4 -fL https://unpkg.com/three@0.128.0/examples/js/loaders/GLTFLoader.js -o $A/GLTFLoader.js
          curl --retry 4 -fL https://raw.githubusercontent.com/nirholas/three.ws/main/public/avatars/parametric-base.glb -o $A/tennis-player.glb
      - name: Fix startup freeze and mobile load
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('mg-tennis-tv/app/src/main/assets/index.html')
          s=p.read_text()
          s=s.replace('promo.jpg','mg-tennis-splash.svg')
          s=s.replace('c.width=c.height=1024','c.width=c.height=256')
          s=s.replace('sun.shadow.mapSize.set(4096,4096)','sun.shadow.mapSize.set(2048,2048)')
          s=s.replace("function init(){scene=new THREE.Scene();", "function init(){$('loadmsg').textContent='3D sahne hazırlanıyor…';$('loadfill').style.width='15%';scene=new THREE.Scene();")
          s=s.replace("'use strict';", "'use strict';setTimeout(()=>{const l=document.getElementById('loading');if(l&&l.style.display!=='none'){document.getElementById('loadmsg').textContent='Sahne güvenli modda açılıyor…';l.style.display='none';}},9000);")
          p.write_text(s)
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android API 35
        run: yes | sdkmanager 'platforms;android-35' 'build-tools;35.0.0' >/dev/null
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build release APK
        working-directory: mg-tennis-tv
        run: gradle --no-daemon assembleRelease
      - name: Verify release
        run: |
          APK=mg-tennis-tv/app/build/outputs/apk/release/app-release.apk
          test -s $APK
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose $APK
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging $APK | grep "versionCode='11'"
          unzip -l $APK | grep -q assets/three.min.js
          unzip -l $APK | grep -q assets/tennis-player.glb
          cp $APK MG_Tennis_TV_v1.1_StartupFix.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MG-Tennis-TV-v1.1-StartupFix-APK
          path: MG_Tennis_TV_v1.1_StartupFix.apk
          retention-days: 30
