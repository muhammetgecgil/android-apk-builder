name: Build MG Tennis TV APK
on:
  push:
    branches: [ feature/mg-tennis-tv-v1 ]
    paths: [ 'mg-tennis-tv/**', '.github/workflows/build-mg-tennis-tv.yml' ]
  workflow_dispatch:
permissions: { contents: write }
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Restore signing key
        run: base64 -d mg-tennis-tv/signing/mg-tennis-update.jks.b64 > mg-tennis-tv/signing/mg-tennis-update.jks
      - name: Prepare runtime and photoreal human assets
        run: |
          set -euo pipefail; A=mg-tennis-tv/app/src/main/assets
          curl --retry 4 -fL https://unpkg.com/three@0.128.0/build/three.min.js -o $A/three.min.js
          curl --retry 4 -fL https://unpkg.com/three@0.128.0/examples/js/loaders/GLTFLoader.js -o $A/GLTFLoader.js
          BASE=https://raw.githubusercontent.com/ibrews/VitruvianGodot/main/godot_project
          curl --retry 4 -fL $BASE/vitruvian_body.glb -o $A/v33_body.glb
          curl --retry 4 -fL $BASE/vitruvian_head.glb -o $A/v33_head.glb
          curl --retry 4 -fL $BASE/vitruvian_hair_rigged.glb -o $A/v33_hair.glb
          for f in vit_body_bc.png vit_body_n.png vit_body_rough.png vit_face_bc.png vit_face_n.png vit_face_rough.png vit_fabric_n.png vit_hair_ao.png vit_hair_atlas.png vit_hair_diffuse.png vit_hair_normal.png vit_hair_opacity.png vit_iris.png vit_lash_atlas.png vit_mouth.png vit_sclera.png; do curl --retry 4 -fL $BASE/$f -o $A/$f; done
          for f in product-core-v41.js gameplay-v42.js gameplay-v43.js gameplay-v44.js product-core-v45.js product-core-v46.js product-core-v47.js product-core-v48.js product-core-v49.js; do test -s $A/$f; done
      - name: Inject product layers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('mg-tennis-tv/app/src/main/assets/index.html'); s=p.read_text()
          s=s.replace('let scene,camera,renderer,clock,loader,player,opponent,','var scene,camera,renderer,clock,loader,player,opponent,').replace('let ballVel=new THREE.Vector3(),ballTrail=[];','var ballVel=new THREE.Vector3(),ballTrail=[];')
          scripts=['difficulty-v24.js','tennis-rules-v22.js','gameplay-feedback-v26.js','tv-mode-v29.js','gameplay-v30.js','visual-gameplay-v31.js','player-ball-v32.js','ultra-human-v33.js','clean-core-v37.js','gameplay-v40.js','product-core-v41.js','gameplay-v42.js','gameplay-v43.js','gameplay-v44.js','product-core-v45.js','product-core-v46.js','product-core-v47.js','product-core-v48.js','product-core-v49.js']
          for obsolete in ['match-start-v34.js','role-start-v38.js','gameplay-v36.js','gameplay-v39.js']:
              s=s.replace(f'<script src="{obsolete}"></script>','')
          for fn in scripts:
              if fn not in s:s=s.replace('</body>',f'<script src="{fn}"></script></body>')
          p.write_text(s)
          PY
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - run: yes | sdkmanager 'platforms;android-35' 'build-tools;35.0.0' >/dev/null
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.10.2' }
      - name: Build release APK
        working-directory: mg-tennis-tv
        run: gradle --no-daemon assembleRelease
      - name: Verify v4.9 release
        run: |
          APK=mg-tennis-tv/app/build/outputs/apk/release/app-release.apk
          test -s $APK
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose $APK
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging $APK | grep "versionCode='49'"
          unzip -p $APK assets/index.html | grep -q 'product-core-v49.js'
          ! unzip -p $APK assets/index.html | grep -q 'gameplay-v39.js'
          unzip -l $APK | grep -q assets/v33_head.glb
          cp $APK MG_Tennis_TV_v4.9_PC1_Self_Test_Policy_Verification.apk
      - uses: actions/upload-artifact@v4
        with: { name: MG-Tennis-TV-v4.9-PC1-Self-Test-Policy-Verification-APK, path: MG_Tennis_TV_v4.9_PC1_Self_Test_Policy_Verification.apk, retention-days: 30 }
