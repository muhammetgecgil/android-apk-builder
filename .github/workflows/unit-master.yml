name: Unit Master X Android 16 Stability Build

on:
  workflow_dispatch:
  push:
    branches: [ unit-master-stability-v102 ]
    paths:
      - 'unit-master-v102/**'
      - 'unit-master-source.part*'
      - 'unit-master-stability-patch.py'
      - '.github/workflows/unit-master.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'unit-master-v102/**'
      - 'unit-master-source.part*'
      - 'unit-master-stability-patch.py'
      - '.github/workflows/unit-master.yml'

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rehydrate Unit Master source
        run: |
          cat unit-master-source.part* | base64 -d > unit-master-source.zip
          unzip -q unit-master-source.zip
          test -f unit-master/app/build.gradle

      - name: Apply previous data patch
        run: |
          if [ -f unit-master-stability-patch.py ]; then python unit-master-stability-patch.py; fi

      - name: Apply v1.0.2 safe activity
        run: python unit-master-v102/apply_v102.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Run conversion tests
        working-directory: unit-master
        run: gradle testDebugUnitTest --stacktrace

      - name: Build debug APK and release AAB
        working-directory: unit-master
        run: gradle assembleDebug bundleRelease --stacktrace

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Android 16 launch smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          script: |
            adb install -r unit-master/app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am force-stop com.mg.unitmasterx.stable2 || true
            adb shell am start -W -n com.mg.unitmasterx.stable2/com.mg.unitmasterx.MainActivity
            sleep 6
            PID=$(adb shell pidof com.mg.unitmasterx.stable2 | tr -d '\r')
            echo "PID=$PID"
            test -n "$PID"
            adb shell uiautomator dump /sdcard/umx.xml
            adb pull /sdcard/umx.xml umx.xml
            grep -q 'Unit Master X' umx.xml
            adb logcat -d AndroidRuntime:E '*:S' > androidruntime.log || true
            if grep -q 'com.mg.unitmasterx.stable2' androidruntime.log; then cat androidruntime.log; exit 1; fi

      - name: Normalize outputs
        run: |
          mkdir -p unit-master/dist
          cp unit-master/app/build/outputs/apk/debug/app-debug.apk unit-master/dist/UnitMasterX-Stability-v1.0.2.apk
          cp unit-master/app/build/outputs/bundle/release/app-release.aab unit-master/dist/UnitMasterX-v1.0.2-release.aab
          sha256sum unit-master/dist/* > unit-master/dist/SHA256SUMS.txt

      - name: Upload verified artifacts
        uses: actions/upload-artifact@v4
        with:
          name: UnitMasterX-Stability-v102-Android16-Verified
          path: unit-master/dist/*
          if-no-files-found: error
