name: Validate MG Unified Orchestrator
on:
  push:
    branches: [mg-ai-v0.1-bootstrap]
    paths: ['mg-orchestrator-server/**','.github/workflows/mg-orchestrator.yml']
  pull_request:
    paths: ['mg-orchestrator-server/**','.github/workflows/mg-orchestrator.yml']
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install fastapi
      - run: python -m py_compile mg-orchestrator-server/orchestrator.py mg-orchestrator-server/api.py
      - run: PYTHONPATH=mg-orchestrator-server python mg-orchestrator-server/test_orchestrator_contract.py
      - run: PYTHONPATH=mg-orchestrator-server python -c "import api; h=api.health(); assert h['automatic_model_activation']==False and h['robot_safety_bypass']==False; print(api.app.title)"
