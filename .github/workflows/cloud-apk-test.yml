name: Build Cloud APK Test

on:
  push:
    branches: [ cloud-apk-test ]
    paths:
      - 'cloud-test/**'
      - '.github/workflows/cloud-apk-test.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build APK
        working-directory: cloud-test
        run: gradle --no-daemon :app:assembleDebug

      - name: Validate APK exists
        run: test -s cloud-test/app/build/outputs/apk/debug/app-debug.apk

      - name: Rename APK
        run: cp cloud-test/app/build/outputs/apk/debug/app-debug.apk Cloud_APK_Test_S24.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Cloud-APK-Test-S24
          path: Cloud_APK_Test_S24.apk
          if-no-files-found: error
          retention-days: 30
