name: Build Sesli Rehber 3

on:
  push:
    branches: [ main ]
    paths:
      - 'sesli-rehber/**'
      - '.github/workflows/build-sesli-rehber.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sesli-rehber-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install native compiler
        run: sudo apt-get update && sudo apt-get install -y clang lld

      - name: Rebuild Hareket Görüş ARM64 library
        run: |
          chmod +x sesli-rehber/native-src/build.sh
          sesli-rehber/native-src/build.sh
          cp sesli-rehber/native-src/apk/lib/arm64-v8a/libskytrack.so \
             sesli-rehber/app/src/main/jniLibs/arm64-v8a/libskytrack.so
          readelf -h sesli-rehber/app/src/main/jniLibs/arm64-v8a/libskytrack.so

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Test, lint and build APK/AAB
        run: >-
          gradle --no-daemon -p sesli-rehber
          clean
          :app:testDebugUnitTest
          :app:lintDebug
          :app:assembleDebug
          :app:assembleRelease
          :app:bundleRelease
          --stacktrace

      - name: Collect and verify outputs
        run: |
          mkdir -p out
          cp sesli-rehber/app/build/outputs/apk/debug/app-debug.apk \
             out/SesliRehber-3.0.0-alpha01-debug.apk
          cp sesli-rehber/app/build/outputs/apk/release/app-release-unsigned.apk \
             out/SesliRehber-3.0.0-alpha01-release-unsigned.apk
          cp sesli-rehber/app/build/outputs/bundle/release/app-release.aab \
             out/SesliRehber-3.0.0-alpha01-release-unsigned.aab
          cp sesli-rehber/VERSION.json out/VERSION.json
          sha256sum out/* | tee out/SHA256SUMS.txt
          unzip -t out/SesliRehber-3.0.0-alpha01-debug.apk
          unzip -l out/SesliRehber-3.0.0-alpha01-debug.apk | grep 'lib/arm64-v8a/libskytrack.so'

      - name: Upload build outputs
        uses: actions/upload-artifact@v4
        with:
          name: SesliRehber-3.0.0-alpha01
          path: out/*
          if-no-files-found: error
          retention-days: 30
