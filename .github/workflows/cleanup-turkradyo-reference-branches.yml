name: Cleanup TurkRadyo Reference Aliases
on:
  push:
    paths:
      - '.github/workflows/cleanup-turkradyo-reference-branches.yml'
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove duplicate same-version helper branches
        run: |
          git push origin --delete reference/turkradyo-v2.6.0-premium-settings || true
          git push origin --delete turkradyo-v260-premium-settings-working || true
          git push origin --delete turkradyo-v260-premium-settings-reference-marker || true
          git push origin --delete turkradyo-v260-premium-settings-baseline-copy || true
          git push origin --delete turkradyo-v260-premium-settings-reference || true
