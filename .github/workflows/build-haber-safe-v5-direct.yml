name: Build Haber SAFE V5 Direct APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "haber-safe-v5-direct/**"
      - ".github/workflows/build-haber-safe-v5-direct.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle -p haber-safe-v5-direct assembleDebug --stacktrace

      - name: Rename APK
        run: cp haber-safe-v5-direct/app/build/outputs/apk/debug/app-debug.apk Haber_SAFE_V5_Direct_5.0.1.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Haber-SAFE-V5-Direct-APK
          path: Haber_SAFE_V5_Direct_5.0.1.apk
          if-no-files-found: error
