name: Build Aircraft Simulator v89 Fighter Control Surfaces

on:
  push:
    branches: [ aircraft-sim-v89-fighter-control-surfaces ]
    paths:
      - 'flight-sim/**'
      - '.github/workflows/build-flight-sim-v89-fighter-control-surfaces.yml'
  workflow_dispatch:

permissions: { contents: read }

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.13' }

      # Preserve the exact v88 canonical geometry/transformation chain first.
      - name: Apply v87 safe flight fixes
        run: python3 flight-sim/tools/apply_v87_safe_fixes.py
      - name: Apply v88 mechanical dynamics
        run: python3 flight-sim/tools/apply_v88_mechanical_upgrade.py
      - name: Apply v88 wing and control-surface geometry
        run: python3 flight-sim/tools/apply_v88_wing_geometry.py
      - name: Apply v88 true control-surface airfoils
        run: python3 flight-sim/tools/apply_v88_control_surface_airfoils.py

      # v89 only adds fighter-specific control laws/surfaces on top of the proven v88 baseline.
      - name: Apply v89 fighter control surfaces
        run: python3 flight-sim/tools/apply_v89_fighter_control_surfaces.py

      - name: Verify fighter FCS source integration
        run: |
          grep -q 'class FighterFlightControlSystem' flight-sim/app/src/main/java/com/mg/fixturecockpitsim/sim/FighterFlightControlSystem.java
          grep -q 'setFighterSurfaceState' flight-sim/app/src/main/java/com/mg/fixturecockpitsim/FlightRuntimeActivity.java
          grep -q 'uSpeedBrake' flight-sim/app/src/main/java/com/mg/fixturecockpitsim/Jet3DView.java
          grep -q 'leftLeadingEdgeFlapDeg' flight-sim/app/src/main/java/com/mg/fixturecockpitsim/sim/FlightState.java
          grep -q 'speedBrake' flight-sim/app/src/main/java/com/mg/fixturecockpitsim/sim/FlightControls.java

      - name: Unit tests
        continue-on-error: false
        working-directory: flight-sim
        run: gradle --no-daemon :app:testDebugUnitTest --stacktrace

      - name: Build v89 debug APK and Play outputs
        working-directory: flight-sim
        run: gradle --no-daemon clean :app:assembleDebug :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Verify package, v89, signature and approved icon
        run: |
          APK=flight-sim/app/build/outputs/apk/debug/app-debug.apk
          REL=flight-sim/app/build/outputs/apk/release/app-release-unsigned.apk
          AAB=flight-sim/app/build/outputs/bundle/release/app-release.aab
          test -s "$APK" && test -s "$REL" && test -s "$AAB"
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose --print-certs "$APK"
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging "$APK" | grep "package: name='com.mg.fixturecockpitsim.dev'"
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging "$APK" | grep "versionCode='89'"
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging "$APK" | grep "versionName='26.7-avm19.0-fighter-control-surfaces-debug'"
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging "$APK" | grep "targetSdkVersion:'36'"
          unzip -l "$APK" | grep 'ic_aircraft_simulator_final'

      - name: Prepare v89 artifacts
        run: |
          cp flight-sim/app/build/outputs/apk/debug/app-debug.apk Aircraft_Simulator_3D_v89_Fighter_Control_Surfaces_Test.apk
          cp flight-sim/app/build/outputs/apk/release/app-release-unsigned.apk Aircraft_Simulator_3D_v89_Release_Unsigned.apk
          cp flight-sim/app/build/outputs/bundle/release/app-release.aab Aircraft_Simulator_3D_v89_Play_Unsigned.aab
          sha256sum Aircraft_Simulator_3D_v89_Fighter_Control_Surfaces_Test.apk > Aircraft_Simulator_3D_v89_Fighter_Control_Surfaces_Test.sha256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Aircraft-Simulator-3D-v89-Fighter-Control-Surfaces
          path: |
            Aircraft_Simulator_3D_v89_Fighter_Control_Surfaces_Test.apk
            Aircraft_Simulator_3D_v89_Fighter_Control_Surfaces_Test.sha256.txt
            Aircraft_Simulator_3D_v89_Release_Unsigned.apk
            Aircraft_Simulator_3D_v89_Play_Unsigned.aab
          if-no-files-found: error
          retention-days: 30
