name: Build Training Assistant v1.2

on:
  push:
    branches: ["main", "agent/training-assistant-v120"]
    paths:
      - "training-assistant/**"
      - ".github/workflows/build-training-assistant.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "training-assistant/**"
      - ".github/workflows/build-training-assistant.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"
      - name: Build APK and AAB
        working-directory: training-assistant
        run: gradle --no-daemon :app:assembleDebug :app:bundleRelease
      - name: Stage outputs
        run: |
          mkdir -p out
          cp training-assistant/app/build/outputs/apk/debug/app-debug.apk out/Egitim-Asistani-v1.2.0.apk
          cp training-assistant/app/build/outputs/bundle/release/app-release.aab out/Egitim-Asistani-v1.2.0-PLAY-UNSIGNED.aab
          sha256sum out/* > out/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Egitim-Asistani-v1.2.0
          path: out/*
          if-no-files-found: error
