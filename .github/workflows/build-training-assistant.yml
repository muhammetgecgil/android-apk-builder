name: Build Training Assistant APK

on:
  push:
    branches: ["main", "agent/training-assistant"]
    paths:
      - "training-assistant/**"
      - ".github/workflows/build-training-assistant.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: training-assistant
        run: gradle --no-daemon :app:assembleDebug

      - name: Rename APK
        run: |
          mkdir -p out
          cp training-assistant/app/build/outputs/apk/debug/app-debug.apk out/Egitim-Asistani-v1.0.0.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Egitim-Asistani-v1.0.0
          path: out/Egitim-Asistani-v1.0.0.apk
          if-no-files-found: error
