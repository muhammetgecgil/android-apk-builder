name: Build TurkRadyo v2.8.5 Stability

on:
  push:
    branches:
      - 'dev/turkradyo-v2.8.5-stability'
    paths:
      - 'turkradyo/**'
      - '.github/workflows/build-turkradyo-v285.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install API 36 SDK
        run: yes | sdkmanager --licenses >/dev/null || true; sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'platform-tools'

      - name: Build v2.8.5 APK and AAB
        working-directory: turkradyo
        run: gradle --no-daemon clean lintRelease assembleDebug bundleRelease

      - name: Stage artifacts
        run: |
          mkdir -p dist
          cp turkradyo/app/build/outputs/apk/debug/app-debug.apk dist/TurkRadyo-v2.8.5-Stability-Debug.apk
          cp turkradyo/app/build/outputs/bundle/release/app-release.aab dist/TurkRadyo-v2.8.5-Play-Unsigned.aab

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: TurkRadyo-v2.8.5-Stability-APK
          path: dist/TurkRadyo-v2.8.5-Stability-Debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Play bundle
        uses: actions/upload-artifact@v4
        with:
          name: TurkRadyo-v2.8.5-Play-Unsigned
          path: dist/TurkRadyo-v2.8.5-Play-Unsigned.aab
          if-no-files-found: error
          retention-days: 30

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TurkRadyo-v2.8.5-Lint
          path: turkradyo/app/build/reports/lint-results-release.html
          if-no-files-found: ignore
          retention-days: 30
