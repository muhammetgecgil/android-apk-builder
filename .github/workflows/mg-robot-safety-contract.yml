name: Validate MG Robot Safety Supervisor

on:
  push:
    branches: [mg-ai-v0.1-bootstrap]
    paths:
      - 'mg-robot-safety-server/**'
      - '.github/workflows/mg-robot-safety-contract.yml'
  pull_request:
    paths:
      - 'mg-robot-safety-server/**'
      - '.github/workflows/mg-robot-safety-contract.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install fastapi pydantic
      - run: python -m py_compile mg-robot-safety-server/safety_supervisor.py mg-robot-safety-server/api.py
      - run: PYTHONPATH=mg-robot-safety-server python mg-robot-safety-server/test_safety_supervisor.py
      - run: PYTHONPATH=mg-robot-safety-server python -c "import api; h=api.health(); assert h['actuator_endpoints']==0 and h['llm_dependency']==False; print(api.app.title)"
