name: Build Aircraft Simulator v88 New Icon

on:
  push:
    branches: [ aircraft-sim-v88-new-icon-source-build ]
    paths:
      - 'flight-sim/**'
      - '.github/workflows/build-flight-sim-v88-new-icon.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Materialize launcher icon
        run: |
          mkdir -p flight-sim/app/src/main/res/drawable
          base64 -d flight-sim/ci/ic_aircraft_simulator_photo.webp.b64 > flight-sim/app/src/main/res/drawable/ic_aircraft_simulator_photo.webp
          test -s flight-sim/app/src/main/res/drawable/ic_aircraft_simulator_photo.webp
          file flight-sim/app/src/main/res/drawable/ic_aircraft_simulator_photo.webp

      - name: Build clean v88 debug APK
        working-directory: flight-sim
        run: |
          gradle --no-daemon clean :app:assembleDebug --stacktrace

      - name: Verify APK package, version and signature
        run: |
          APK=flight-sim/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose --print-certs "$APK"
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging "$APK" | grep "package: name='com.mg.fixturecockpitsim.dev'"
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging "$APK" | grep "versionCode='88'"
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging "$APK" | grep "versionName='26.6-avm18.0-mechanical-dynamics-debug'"
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging "$APK" | grep "targetSdkVersion:'36'"
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging "$APK" | grep "application-label:'Aircraft Simulator 3D'"

      - name: Prepare installable artifact
        run: |
          cp flight-sim/app/build/outputs/apk/debug/app-debug.apk Aircraft_Simulator_3D_v88_NewIcon_SourceBuilt.apk
          sha256sum Aircraft_Simulator_3D_v88_NewIcon_SourceBuilt.apk > Aircraft_Simulator_3D_v88_NewIcon_SourceBuilt.sha256.txt

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Aircraft-Simulator-3D-v88-NewIcon-SourceBuilt
          path: |
            Aircraft_Simulator_3D_v88_NewIcon_SourceBuilt.apk
            Aircraft_Simulator_3D_v88_NewIcon_SourceBuilt.sha256.txt
          if-no-files-found: error
          retention-days: 30
