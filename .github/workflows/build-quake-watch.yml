name: Build Quake Watch APK

on:
  push:
    branches: ["quake-watch-v1"]
    paths:
      - "quake-watch/**"
      - ".github/workflows/build-quake-watch.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "quake-watch/**"
      - ".github/workflows/build-quake-watch.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Build installable APK
        working-directory: quake-watch
        shell: bash
        run: |
          set +e
          gradle --no-daemon clean :app:assembleDebug --stacktrace 2>&1 | tee build.log
          rc=${PIPESTATUS[0]}
          echo '### Quake Watch build tail' >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          tail -n 120 build.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
      - name: Stage APK
        if: success()
        run: |
          mkdir -p out
          cp quake-watch/app/build/outputs/apk/debug/app-debug.apk out/Quake-Watch-v2.5.0-Stage3.apk
          sha256sum out/Quake-Watch-v2.5.0-Stage3.apk > out/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Quake-Watch-v2.5.0-Stage3
          path: out/*
          if-no-files-found: error
