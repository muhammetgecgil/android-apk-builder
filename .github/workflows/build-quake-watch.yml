name: Build Quake Watch APK

on:
  push:
    branches: ["quake-watch-v1"]
    paths:
      - "quake-watch/**"
      - ".github/workflows/build-quake-watch.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Build installable APK
        working-directory: quake-watch
        run: gradle --no-daemon clean :app:assembleDebug --stacktrace
      - name: Stage APK
        run: |
          mkdir -p out
          cp quake-watch/app/build/outputs/apk/debug/app-debug.apk out/Quake-Watch-v1.0.0.apk
          sha256sum out/Quake-Watch-v1.0.0.apk > out/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Quake-Watch-v1.0.0
          path: out/*
          if-no-files-found: error
