name: Build and Publish Haber SAFE V5 Direct APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "haber-safe-v5-direct/**"
      - ".github/workflows/build-haber-safe-v5-direct-publish.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle -p haber-safe-v5-direct assembleDebug --stacktrace

      - name: Publish APK to repository
        run: |
          cp haber-safe-v5-direct/app/build/outputs/apk/debug/app-debug.apk muhammet-haber-safe-v5/Haber_SAFE_V5_Direct_5.0.1.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add muhammet-haber-safe-v5/Haber_SAFE_V5_Direct_5.0.1.apk
          git commit -m "Build Haber SAFE V5 Direct 5.0.1 APK" || exit 0
          git push

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Haber-SAFE-V5-Direct-APK
          path: muhammet-haber-safe-v5/Haber_SAFE_V5_Direct_5.0.1.apk
          if-no-files-found: error
