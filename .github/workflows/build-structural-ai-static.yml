name: Build Structural AI Static APK

on:
  push:
    branches:
      - feature/structural-ai-static-v1
    paths:
      - 'structural-ai-static/**'
      - '.github/workflows/build-structural-ai-static.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: structural-ai-static
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Structural_AI_Static_v0.4.0_DEBUG.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Structural-AI-Static-v0.4.0-DEBUG
          path: structural-ai-static/Structural_AI_Static_v0.4.0_DEBUG.apk
          if-no-files-found: error
          retention-days: 30
