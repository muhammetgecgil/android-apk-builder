name: Build Structural AI Static APK

on:
  push:
    branches:
      - feature/structural-ai-static-v1
    paths:
      - 'structural-ai-static/**'
      - '.github/workflows/build-structural-ai-static.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: structural-ai-static
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android API, NDK and CMake
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"
      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Cache staged OCCT Android arm64
        id: cache-occt
        uses: actions/cache@v4
        with:
          path: |
            structural-ai-static/app/src/main/cpp/occt
            structural-ai-static/app/src/main/jniLibs/arm64-v8a
          key: occt-v7.9.3-android-arm64-api26-r2
      - name: Build OCCT 7.9.3 for Android arm64
        if: steps.cache-occt.outputs.cache-hit != 'true'
        env:
          NDK: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973
        run: |
          set -euxo pipefail
          rm -rf /tmp/occt-src /tmp/occt-build /tmp/occt-install
          git clone --depth 1 --branch V7_9_3 https://github.com/Open-Cascade-SAS/OCCT.git /tmp/occt-src
          cmake -S /tmp/occt-src -B /tmp/occt-build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26 -DANDROID_STL=c++_shared \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/tmp/occt-install \
            -DBUILD_LIBRARY_TYPE=Shared -DBUILD_MODULE_Draw=OFF -DBUILD_MODULE_Visualization=OFF \
            -DBUILD_MODULE_ApplicationFramework=OFF -DUSE_FREETYPE=OFF -DUSE_TBB=OFF -DUSE_VTK=OFF \
            -DUSE_RAPIDJSON=OFF -DBUILD_SAMPLES_QT=OFF -DBUILD_DOC_Overview=OFF
          cmake --build /tmp/occt-build --parallel 4
          cmake --install /tmp/occt-build
          rm -rf app/src/main/cpp/occt app/src/main/jniLibs/arm64-v8a
          mkdir -p app/src/main/cpp/occt/include/opencascade app/src/main/jniLibs/arm64-v8a
          cp -a /tmp/occt-install/include/opencascade/. app/src/main/cpp/occt/include/opencascade/
          find /tmp/occt-install -type f -name 'libTK*.so' -exec cp -L {} app/src/main/jniLibs/arm64-v8a/ \;
          cp "$NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so" app/src/main/jniLibs/arm64-v8a/
      - name: Restore generated Structural AI icon
        run: |
          mkdir -p app/src/main/res/drawable-nodpi
          base64 -d app-icon/structural_ai_icon_512.png.b64 > app/src/main/res/drawable-nodpi/structural_ai_icon.webp
      - name: Restore stable debug signing key
        run: |
          mkdir -p "$HOME/.android"
          base64 -d signing/structural-ai-debug.jks.b64 > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
      - name: Resolve and stamp update-safe app version
        run: |
          VERSION_NAME=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n1)
          test -n "$VERSION_NAME"
          # GitHub run number is monotonically increasing for this workflow. Add a high base so
          # every CI APK is safely newer than historical hand-maintained versionCodes.
          VERSION_CODE=$((10000 + GITHUB_RUN_NUMBER))
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          python3 - <<'PY'
          from pathlib import Path
          import os,re
          g=Path('app/build.gradle.kts')
          s=g.read_text()
          s2=re.sub(r'versionCode\s*=\s*\d+', f'versionCode = {os.environ["VERSION_CODE"]}', s, count=1)
          if s2==s:
              raise SystemExit('versionCode pattern not found')
          g.write_text(s2)

          p=Path('app/src/main/java/com/mg/structuralai/AutoMainActivity.java')
          s=p.read_text()
          s2=re.sub(r'sub\.setText\("v[^\"]*•[^\"]*OCCT ARM64"\);',
                    'sub.setText("v"+BuildConfig.VERSION_NAME+" • PRODUCT ENGINEERING GATE • OCCT ARM64");',s,count=1)
          if s2==s:
              raise SystemExit('version banner pattern not found')
          p.write_text(s2)
          PY
      - name: Build debug APK with OCCT exact CAD kernel
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Verify update identity and signature
        run: |
          set -euxo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          BADGING=$($AAPT dump badging "$APK" | head -n1)
          echo "$BADGING"
          echo "$BADGING" | grep -q "name='com.mg.structuralai'"
          echo "$BADGING" | grep -q "versionCode='$VERSION_CODE'"
          $APKSIGNER verify --verbose --print-certs "$APK"
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "Structural_AI_Static_${VERSION_NAME}_DEBUG.apk"
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Structural-AI-Static-${{ env.VERSION_NAME }}-DEBUG
          path: structural-ai-static/Structural_AI_Static_${{ env.VERSION_NAME }}_DEBUG.apk
          if-no-files-found: error
          retention-days: 30
