name: Build Structural AI Static APK

on:
  push:
    branches:
      - feature/structural-ai-static-v1
    paths:
      - 'structural-ai-static/**'
      - '.github/workflows/build-structural-ai-static.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: structural-ai-static
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android API 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Restore generated Structural AI icon
        run: |
          mkdir -p app/src/main/res/drawable-nodpi
          base64 -d app-icon/structural_ai_icon_512.png.b64 > app/src/main/res/drawable-nodpi/structural_ai_icon.webp
      - name: Restore stable debug signing key
        run: |
          mkdir -p "$HOME/.android"
          base64 -d signing/structural-ai-debug.jks.b64 > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Structural_AI_Static_v1.0.0_RC1_DEBUG.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Structural-AI-Static-v1.0.0-RC1-DEBUG
          path: structural-ai-static/Structural_AI_Static_v1.0.0_RC1_DEBUG.apk
          if-no-files-found: error
          retention-days: 30
