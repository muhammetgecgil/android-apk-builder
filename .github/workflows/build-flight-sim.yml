name: Build Aircraft Simulator
# REFERENCE BASELINE: v88 / 26.6-avm18.0-mechanical-dynamics
# Do not advance Aircraft Simulator beyond v88 unless explicitly requested by the user.
on:
  push:
    branches: [ main, aircraft-sim-v19-foundation, aircraft-sim-v84-engine-detail, aircraft-sim-v85-engine-dynamics, aircraft-sim-v86-flight-controls-gear-runway, aircraft-sim-v87-pilot-cockpit, aircraft-sim-v88-mechanical-upgrade ]
    paths: [ 'flight-sim/**', '.github/workflows/build-flight-sim.yml' ]
  pull_request:
    branches: [ main ]
    paths: [ 'flight-sim/**', '.github/workflows/build-flight-sim.yml' ]
  workflow_dispatch:
permissions: { contents: read }
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.13' }
      - name: Apply v87 safe flight fixes
        if: github.ref == 'refs/heads/aircraft-sim-v87-pilot-cockpit' || github.ref == 'refs/heads/aircraft-sim-v88-mechanical-upgrade'
        run: python3 flight-sim/tools/apply_v87_safe_fixes.py
      - name: Apply v88 mechanical dynamics
        if: github.ref == 'refs/heads/aircraft-sim-v88-mechanical-upgrade'
        run: python3 flight-sim/tools/apply_v88_mechanical_upgrade.py
      - name: Unit tests (non-blocking during AVM migration)
        continue-on-error: true
        working-directory: flight-sim
        run: gradle --no-daemon :app:testDebugUnitTest --stacktrace
      - name: Build debug APK
        working-directory: flight-sim
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Build unsigned release APK and AAB
        working-directory: flight-sim
        run: gradle --no-daemon :app:assembleRelease :app:bundleRelease --stacktrace
      - name: Verify debug package and release outputs
        run: |
          DBG=flight-sim/app/build/outputs/apk/debug/app-debug.apk
          REL=flight-sim/app/build/outputs/apk/release/app-release-unsigned.apk
          AAB=flight-sim/app/build/outputs/bundle/release/app-release.aab
          test -s "$DBG"
          test -s "$REL"
          test -s "$AAB"
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify "$DBG"
          if [ "$GITHUB_REF_NAME" = "aircraft-sim-v88-mechanical-upgrade" ]; then EXPECTED=88; else EXPECTED=87; fi
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging "$DBG" | grep "versionCode='$EXPECTED'"
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging "$DBG" | grep "targetSdkVersion:'36'"
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging "$DBG" | grep "application-label:'Aircraft Simulator 3D'"
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging "$DBG" | grep "package: name='com.mg.fixturecockpitsim.dev'"
      - name: Prepare artifacts
        run: |
          if [ "$GITHUB_REF_NAME" = "aircraft-sim-v88-mechanical-upgrade" ]; then
            cp flight-sim/app/build/outputs/apk/debug/app-debug.apk "Aircraft Simulator 3D v88 - Mechanical Dynamics Test.apk"
            cp flight-sim/app/build/outputs/apk/release/app-release-unsigned.apk "Aircraft Simulator 3D v88 - Release Unsigned.apk"
            cp flight-sim/app/build/outputs/bundle/release/app-release.aab "Aircraft Simulator 3D v88 - Play Unsigned.aab"
          else
            cp flight-sim/app/build/outputs/apk/debug/app-debug.apk "Aircraft Simulator 3D v87 - Pilot Cockpit Test.apk"
            cp flight-sim/app/build/outputs/apk/release/app-release-unsigned.apk "Aircraft Simulator 3D v87 - Release Unsigned.apk"
            cp flight-sim/app/build/outputs/bundle/release/app-release.aab "Aircraft Simulator 3D v87 - Play Unsigned.aab"
          fi
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/aircraft-sim-v88-mechanical-upgrade'
        with: { name: Aircraft-Simulator-3D-v88-Mechanical-Dynamics-Test-APK, path: "Aircraft Simulator 3D v88 - Mechanical Dynamics Test.apk", if-no-files-found: error, retention-days: 30 }
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/aircraft-sim-v88-mechanical-upgrade'
        with: { name: Aircraft-Simulator-3D-v88-Release-Unsigned, path: "Aircraft Simulator 3D v88 - Release Unsigned.apk", if-no-files-found: error, retention-days: 30 }
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/aircraft-sim-v88-mechanical-upgrade'
        with: { name: Aircraft-Simulator-3D-v88-Play-AAB-Unsigned, path: "Aircraft Simulator 3D v88 - Play Unsigned.aab", if-no-files-found: error, retention-days: 30 }
      - uses: actions/upload-artifact@v4
        if: github.ref != 'refs/heads/aircraft-sim-v88-mechanical-upgrade'
        with: { name: Aircraft-Simulator-3D-v87-Pilot-Cockpit-Test-APK, path: "Aircraft Simulator 3D v87 - Pilot Cockpit Test.apk", if-no-files-found: error, retention-days: 30 }
      - uses: actions/upload-artifact@v4
        if: github.ref != 'refs/heads/aircraft-sim-v88-mechanical-upgrade'
        with: { name: Aircraft-Simulator-3D-v87-Release-Unsigned, path: "Aircraft Simulator 3D v87 - Release Unsigned.apk", if-no-files-found: error, retention-days: 30 }
      - uses: actions/upload-artifact@v4
        if: github.ref != 'refs/heads/aircraft-sim-v88-mechanical-upgrade'
        with: { name: Aircraft-Simulator-3D-v87-Play-AAB-Unsigned, path: "Aircraft Simulator 3D v87 - Play Unsigned.aab", if-no-files-found: error, retention-days: 30 }
