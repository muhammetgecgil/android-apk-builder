name: Build Fixture Cockpit Sim APK

on:
  push:
    branches: [ main, agent/fixture-cockpit-v3-apk ]
    paths:
      - 'flight-sim/**'
      - '.github/workflows/build-flight-sim.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'flight-sim/**'
      - '.github/workflows/build-flight-sim.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android API 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Embed pinned open-source F-22 model
        run: |
          set -euxo pipefail
          mkdir -p flight-sim/app/src/main/assets/models flight-sim/app/src/main/assets/licenses flight-sim/build/model-source
          curl --fail --location --retry 3 \
            'https://raw.githubusercontent.com/SamJD261/F-22-Raptor/1f02edee712b1263497428d28b3a5893dd12c264/Models/F-22.ac' \
            -o flight-sim/build/model-source/F-22.ac
          curl --fail --location --retry 3 \
            'https://raw.githubusercontent.com/SamJD261/F-22-Raptor/1f02edee712b1263497428d28b3a5893dd12c264/LICENSE.md' \
            -o flight-sim/app/src/main/assets/licenses/F22_MODEL_LICENSE.md
          python3 flight-sim/tools/ac3d_to_mesh.py \
            flight-sim/build/model-source/F-22.ac \
            flight-sim/app/src/main/assets/models/f22_v14.mesh
          test -s flight-sim/app/src/main/assets/models/f22_v14.mesh
          test -s flight-sim/app/src/main/assets/licenses/F22_MODEL_LICENSE.md
      - name: Build APK
        working-directory: flight-sim
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Verify APK, icon and embedded F-22 data
        run: |
          test -s flight-sim/app/build/outputs/apk/debug/app-debug.apk
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose --print-certs flight-sim/app/build/outputs/apk/debug/app-debug.apk
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging flight-sim/app/build/outputs/apk/debug/app-debug.apk | grep "versionCode='15'"
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging flight-sim/app/build/outputs/apk/debug/app-debug.apk | grep "application-icon"
          unzip -l flight-sim/app/build/outputs/apk/debug/app-debug.apk | grep 'assets/models/f22_v14.mesh'
          unzip -l flight-sim/app/build/outputs/apk/debug/app-debug.apk | grep 'assets/licenses/F22_MODEL_LICENSE.md'
          unzip -l flight-sim/app/build/outputs/apk/debug/app-debug.apk | grep 'assets/licenses/F22_MODEL_SOURCE.txt'
      - name: Rename APK
        run: cp flight-sim/app/build/outputs/apk/debug/app-debug.apk Fixture_Cockpit_Sim_F22_Icon_v15.0.apk
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Fixture-Cockpit-Sim-F22-Icon-v15.0-APK
          path: Fixture_Cockpit_Sim_F22_Icon_v15.0.apk
          if-no-files-found: error
          retention-days: 30
