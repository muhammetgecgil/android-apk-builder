name: Build Aircraft Simulator v19

on:
  push:
    branches: [ main, aircraft-sim-v19-foundation ]
    paths:
      - 'flight-sim/**'
      - '.github/workflows/build-flight-sim.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'flight-sim/**'
      - '.github/workflows/build-flight-sim.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Resolve dependencies
        working-directory: flight-sim
        run: gradle --no-daemon :app:dependencies --configuration debugRuntimeClasspath

      - name: Verify simulator unit tests
        working-directory: flight-sim
        run: gradle --no-daemon :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        working-directory: flight-sim
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Verify package
        run: |
          set -euxo pipefail
          APK=flight-sim/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose --print-certs "$APK"
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging "$APK" | grep "versionCode='21'"
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging "$APK" | grep "targetSdkVersion:'36'"
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging "$APK" | grep "application-label:'Aircraft Simulator 3D'"

      - name: Rename APK
        run: cp flight-sim/app/build/outputs/apk/debug/app-debug.apk "Aircraft Simulator 3D.apk"

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Aircraft-Simulator-3D-APK
          path: "Aircraft Simulator 3D.apk"
          if-no-files-found: error
          retention-days: 30
