name: Build Fixture Cockpit Sim APK

on:
  push:
    branches: [ main ]
    paths:
      - 'flight-sim/**'
      - '.github/workflows/build-flight-sim.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'flight-sim/**'
      - '.github/workflows/build-flight-sim.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android API 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build APK
        working-directory: flight-sim
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Verify APK
        run: test -s flight-sim/app/build/outputs/apk/debug/app-debug.apk
      - name: Rename APK
        run: cp flight-sim/app/build/outputs/apk/debug/app-debug.apk Fixture_Cockpit_Sim_v1.0.apk
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Fixture-Cockpit-Sim-v1.0-APK
          path: Fixture_Cockpit_Sim_v1.0.apk
          if-no-files-found: error
          retention-days: 30
