name: Validate MG Research Engine

on:
  push:
    branches:
      - mg-ai-v0.1-bootstrap
    paths:
      - 'mg-research-server/**'
      - '.github/workflows/mg-research-contract.yml'
  pull_request:
    paths:
      - 'mg-research-server/**'
      - '.github/workflows/mg-research-contract.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r mg-research-server/requirements.txt
      - name: Compile Python modules
        run: python -m compileall -q mg-research-server
      - name: Run contract tests
        run: python mg-research-server/test_research_engine.py
      - name: Import API
        working-directory: mg-research-server
        run: python -c "import api; assert api.app.title == 'MG-AI Research Engine'"
      - name: Validate Docker Compose
        working-directory: mg-research-server
        run: docker compose config >/dev/null
