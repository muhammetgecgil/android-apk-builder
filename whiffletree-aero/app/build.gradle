plugins { id 'com.android.application' }

android {
    namespace 'com.mg.whiffletreeaero'
    compileSdk 36

    defaultConfig {
        applicationId 'com.mg.whiffletreeaero'
        minSdk 26
        targetSdk 36
        versionCode 85
        versionName '7.20.0'
    }

    buildFeatures { buildConfig true }

    flavorDimensions 'distribution'
    productFlavors {
        play {
            dimension 'distribution'
            buildConfigField 'boolean', 'ALLOW_SIDELOAD_UPDATE', 'false'
        }
        sideload {
            dimension 'distribution'
            buildConfigField 'boolean', 'ALLOW_SIDELOAD_UPDATE', 'true'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
}
