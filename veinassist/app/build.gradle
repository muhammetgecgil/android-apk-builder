plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mg.veinassist'
    compileSdk 35

    defaultConfig {
        applicationId 'com.mg.veinassist.stable30'
        minSdk 26
        targetSdk 35
        versionCode 30
        versionName '3.0-skin-continuity-anatomy'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
