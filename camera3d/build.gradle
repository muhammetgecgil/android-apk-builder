plugins { id 'com.android.application' }

android {
    namespace 'com.muhammetgecgil.camera3d'
    compileSdk 36

    defaultConfig {
        // New package identity intentionally avoids signature conflicts with early test builds.
        applicationId 'com.muhammetgecgil.camera3d.safe'
        minSdk 26
        targetSdk 36
        versionCode 4
        versionName '1.0.4'
    }

    signingConfigs {
        debug {
            storeFile rootProject.file('camera3d-debug.keystore')
            storePassword 'camera3d'
            keyAlias 'camera3d'
            keyPassword 'camera3d'
        }
    }

    buildTypes {
        debug { signingConfig signingConfigs.debug }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
