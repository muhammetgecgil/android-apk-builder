plugins { id 'com.android.application' }

android {
    namespace 'com.muhammetgecgil.camera3d'
    compileSdk 36

    defaultConfig {
        // Separate identity: installs alongside every earlier Camera3D test build.
        applicationId 'com.muhammetgecgil.cameracadscan.v111'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '1.1.1'
    }

    signingConfigs {
        debug {
            storeFile rootProject.file('camera3d-debug.keystore')
            storePassword 'camera3d'
            keyAlias 'camera3d'
            keyPassword 'camera3d'
        }
    }

    buildTypes {
        debug { signingConfig signingConfigs.debug }
        release { minifyEnabled false }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.ar:core:1.54.0'
}
