services:
  mg-core:
    image: vllm/vllm-openai:latest
    container_name: mg-core
    restart: unless-stopped
    ipc: host
    environment:
      - HF_HOME=/models/cache
    volumes:
      - mg_core_models:/models/cache
    ports:
      - "${MG_CORE_PORT:-8000}:8000"
    command:
      - "${MG_CORE_MODEL:-Qwen/Qwen3.5-4B}"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
      - "--api-key"
      - "${MG_CORE_API_KEY}"
      - "--max-model-len"
      - "${MG_CORE_MAX_MODEL_LEN:-32768}"
      - "--gpu-memory-utilization"
      - "${MG_CORE_GPU_MEMORY_UTILIZATION:-0.90}"
      - "--reasoning-parser"
      - "qwen3"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  mg_core_models:
