plugins { id 'com.android.application' }

def stableDevKeystore = file("$rootDir/ci/aircraft-dev.keystore")
def stableDevKeystoreB64 = file("$rootDir/ci/aircraft-dev.keystore.b64")
if (!stableDevKeystore.exists() && stableDevKeystoreB64.exists()) {
    stableDevKeystore.parentFile.mkdirs()
    stableDevKeystore.bytes = java.util.Base64.getDecoder().decode(stableDevKeystoreB64.text.replaceAll('\\s',''))
}

android {
    namespace 'com.mg.fixturecockpitsim'
    compileSdk 36

    signingConfigs {
        // Public development-only signer. Never use this key for a Play/release build.
        stableDev {
            storeFile stableDevKeystore
            storePassword 'aircraftdev'
            keyAlias 'aircraftdev'
            keyPassword 'aircraftdev'
        }
    }

    defaultConfig {
        applicationId 'com.mg.fixturecockpitsim'
        minSdk 26
        targetSdk 36
        versionCode 20
        versionName '19.1-avm7.4'
    }

    buildTypes {
        debug {
            applicationIdSuffix '.dev'
            versionNameSuffix '-debug'
            signingConfig signingConfigs.stableDev
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    packagingOptions {
        jniLibs { useLegacyPackaging = false }
    }
}

dependencies {
    implementation 'com.google.android.filament:filament-android:1.72.0'
    implementation 'com.google.android.filament:gltfio-android:1.72.0'
    implementation 'com.google.android.filament:filament-utils-android:1.72.0'
    testImplementation 'junit:junit:4.13.2'
}
