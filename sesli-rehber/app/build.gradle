plugins {
    id 'com.android.application'
}

android {
    namespace 'com.muhammet.seslirehber.niyet2'
    compileSdk 36

    defaultConfig {
        // GitHub sürümü eski, farklı anahtarla imzalanmış v2.2 ile çakışmadan kurulur.
        applicationId 'com.muhammet.seslirehber.github'
        minSdk 26
        targetSdk 36
        versionCode 300
        versionName '3.0.0-alpha01'

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds true
    }

    buildFeatures {
        buildConfig = false
    }

    packaging {
        jniLibs {
            useLegacyPackaging = false
        }
        resources {
            excludes += ['META-INF/**']
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
