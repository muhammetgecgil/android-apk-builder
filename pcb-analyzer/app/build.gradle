plugins { id 'com.android.application' }

android {
    namespace 'com.muhammetgecgil.pcbzekapro'
    compileSdk 35

    signingConfigs {
        stableTest {
            storeFile rootProject.file('../nesnesayar-test.jks')
            storePassword 'testpass123'
            keyAlias 'nesnesayar'
            keyPassword 'testpass123'
        }
    }

    defaultConfig {
        applicationId 'com.muhammetgecgil.pcbzekapro.nativecamera'
        minSdk 26
        targetSdk 35
        versionCode 101
        versionName '1.0.1-install-fix'
    }
    buildTypes {
        debug {
            minifyEnabled false
            signingConfig signingConfigs.stableTest
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.stableTest
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.camera:camera-core:1.4.2'
    implementation 'androidx.camera:camera-camera2:1.4.2'
    implementation 'androidx.camera:camera-lifecycle:1.4.2'
    implementation 'androidx.camera:camera-view:1.4.2'
    implementation 'com.google.mlkit:text-recognition:16.0.1'
}
