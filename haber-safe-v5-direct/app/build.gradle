plugins {
    id 'com.android.application'
}

android {
    namespace 'com.muhammet.habersafev5'
    compileSdk 35

    defaultConfig {
        applicationId 'com.muhammet.habersafev5'
        minSdk 26
        targetSdk 35
        versionCode 8
        versionName '6.0.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }
}
