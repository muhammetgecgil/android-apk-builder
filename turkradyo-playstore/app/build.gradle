plugins {
    id 'com.android.application'
}

android {
    namespace 'com.muhammetgecgil.turkradyo'
    compileSdk 36

    defaultConfig {
        applicationId 'com.muhammetgecgil.turkradyo'
        minSdk 26
        targetSdk 36
        versionCode 203
        versionName '2.0.3'
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
    }
}
