plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mg.tennistv'
    compileSdk 35

    defaultConfig {
        applicationId 'com.mg.tennistv'
        minSdk 26
        targetSdk 35
        versionCode 6
        versionName '0.6.0'
    }

    signingConfigs {
        release {
            storeFile file('../signing/mg-tennis-update.jks')
            storePassword 'MGtennis2026!'
            keyAlias 'mgtennis'
            keyPassword 'MGtennis2026!'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
}

dependencies {
    implementation "androidx.webkit:webkit:1.17.0"
}
