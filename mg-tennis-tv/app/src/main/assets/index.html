}
}
window.setPlayerTilt=v=>{playerTilt=clamp(Number(v)||0,-6,6);targetPlayerX=clamp(playerTilt*.70,-4.15,4.15)};window.nativeSwing=(power,dir,remote)=>{power=clamp(Number(power)||1,.55,2.5);dir=clamp(Number(dir)||0,-1,1);showPower(power);if(remote){pendingRemote={power,dir,t:performance.now()};opponentSwingPhase=.001}else{pendingLocal={power,dir,t:performance.now()};playerSwingPhase=.001;if(serving&&mode!=='controller')serve(power,dir)}};window.controllerSwing=p=>{showPower(p);$('swingText').textContent='VURUŞ!';setTimeout(()=>$('swingText').textContent='',170)};window.controllerConnected=v=>$('ctrlState').textContent=v?'Ana telefona bağlandı • hazır':'Bağlantı kurulamadı';window.calibrationFlash=()=>{let f=$('flash');f.style.opacity='1';setTimeout(()=>f.style.opacity='0',100)};window.androidReady=()=>{};window.setMode=m=>{mode=m||'ai';$('controller').style.display=mode==='controller'?'flex':'none';$('hud').style.display=mode==='controller'?'none':'flex';$('score').style.display=mode==='controller'?'none':'block';$('status').style.display=mode==='controller'?'none':'block';$('powerWrap').style.display=mode==='controller'?'none':'block';if(mode!=='controller')resetPoint()};function showPower(p){$('power').style.width=(clamp((p-.55)/1.95,0,1)*100)+'%';setTimeout(()=>$('power').style.width='0%',300)}
function serve(power,dir){serving=false;lastHitter='player';bounceNear=bounceFar=0;ball.position.set(playerX-.20,EYE_H-.15,playerZ-.62);ballVel.set(dir*4.5,5.2+power*1.15,-18.0-power*3.8);ballSpin.set(10+power*4,dir*8,0);$('status').textContent='Ralli • rakip ve top göz hizasından izleniyor'}function resetPoint(){serving=true;pendingLocal=pendingRemote=null;bounceNear=bounceFar=0;ballVel.set(0,0,0);targetPlayerZ=9.55;playerZ=lerp(playerZ,9.55,.5);ballTrail=[];if(ball)ball.position.set(playerX-.20,EYE_H-.18,playerZ-.58);updateScore()}function pointTo(w){if(w==='player')pointsP++;else pointsO++;if((pointsP>=4||pointsO>=4)&&Math.abs(pointsP-pointsO)>=2){if(pointsP>pointsO)gamesP++;else gamesO++;pointsP=pointsO=0}updateScore();$('status').textContent=(w==='player'?'Sayı senin':'Sayı rakibin')+' • yeni servis';setTimeout(resetPoint,850)}function label(a,b){if(a<=2)return['0','15','30'][a];if(a===3&&b<=3)return'40';if(a>=3&&b>=3){if(a===b)return'40';if(a===b+1)return'AD';return'40'}return'40'}function updateScore(){$('scoreMain').textContent=gamesP+' · '+label(pointsP,pointsO)+' — '+label(pointsO,pointsP)+' · '+gamesO;$('scoreSub').textContent='OYUNCU 1 • GERÇEK TENİS SKORU • '+(mode==='ai'?'AI':'OYUNCU 2')}
function tryLocal(now){if(!pendingLocal||now-pendingLocal.t>560)return false;let dx=Math.abs(ball.position.x-playerX),dz=Math.abs(ball.position.z-playerZ);if(ballVel.z>0&&dz<2.05&&dx<1.55&&ball.position.y<2.4){let p=pendingLocal.power,d=pendingLocal.dir;ballVel.set(d*7.2+(ball.position.x-playerX)*.52,4.8+p*1.45,-18.2-p*3.7);ballSpin.set(15+p*7,d*10,0);pendingLocal=null;lastHitter='player';bounceFar=0;playerSwingPhase=.001;flash();return true}return false}function tryOpponent(now){let dx=Math.abs(ball.position.x-opponentX),dz=Math.abs(ball.position.z-opponentZ);if(!(ballVel.z<0&&dz<2.05&&dx<1.7&&ball.position.y<2.5))return false;if(mode==='host'){if(!pendingRemote||now-pendingRemote.t>600)return false;let p=pendingRemote.power,d=pendingRemote.dir;ballVel.set(d*7.0,4.8+p*1.4,18.0+p*3.6);ballSpin.set(-14-p*6,d*9,0);pendingRemote=null}else{let p=.9+Math.random()*.55,target=clamp(playerX+(Math.random()-.5)*3,-4.1,4.1);ballVel.set((target-ball.position.x)*.52,4.8+Math.random()*1.0,18.5+p*3.0);ballSpin.set(-14-p*5,(target-ball.position.x)*1.8,0)}lastHitter='opponent';bounceNear=0;opponentSwingPhase=.001;flash();return true}function flash(){cameraShake=.035;let f=$('flash');f.style.opacity='.50';setTimeout(()=>f.style.opacity='0',55);try{if(Android&&Android.vibrate)Android.vibrate(16)}catch(e){}}
function updateCamera(dt){
if(mode==='controller')return;
let incoming=ball&&!serving&&ballVel.z>0,dist=incoming?Math.max(.15,ball.position.distanceTo(camera.position)):99;
let near=incoming?clamp((5.2-dist)/4.2,0,1):0;
let targetFov=68-3.2*near;camera.fov=lerp(camera.fov,targetFov,1-Math.exp(-dt*5.2));camera.updateProjectionMatrix();
let vx=targetPlayerX-playerX,vz=targetPlayerZ-playerZ,move=Math.min(1,Math.hypot(vx,vz)*.9);
let stride=Math.sin(performance.now()*.016)*.018*move;
let sway=Math.sin(performance.now()*.008)*.008*move;
cameraShake*=Math.exp(-dt*10);
camera.position.x=lerp(camera.position.x,playerX+sway+cameraShake*.45,1-Math.exp(-dt*13));
camera.position.y=lerp(camera.position.y,EYE_H+Math.abs(stride)*.55+cameraShake*.15,1-Math.exp(-dt*13));
camera.position.z=lerp(camera.position.z,playerZ-.04+stride,1-Math.exp(-dt*13));
let tx=opponentX,ty=1.28,tz=opponentZ;
if(ball&&!serving){let gaze=incoming?.18:.10;tx=lerp(tx,ball.position.x,gaze);ty=lerp(ty,clamp(ball.position.y,.55,2.4),gaze);tz=lerp(tz,ball.position.z,gaze)}
if(!cameraLook)cameraLook=new THREE.Vector3(tx,ty,tz);
let k=1-Math.exp(-dt*8.5);cameraLook.lerp(new THREE.Vector3(tx,ty,tz),k);camera.lookAt(cameraLook);
}
function updateOpponentMotion(dt){
if(!opponent)return;
let dx=targetOpponentX-opponentX,dz=targetOpponentZ-opponentZ;oppSpeed=Math.sqrt(dx*dx+dz*dz)/Math.max(dt,.001);
if(opponentMixer)opponentMixer.timeScale=clamp(oppSpeed*.16,0.12,1.45);
let turn=clamp(dx*.09,-.24,.24),a=clamp(opponentSwingPhase,0,1),sw=Math.sin(a*Math.PI),hit=clamp((a-.28)/.34,0,1),follow=clamp((a-.62)/.38,0,1);
opponent.rotation.x=lerp(opponent.rotation.x,-Math.min(.075,oppSpeed*.003),1-Math.exp(-dt*8));
opponent.rotation.z=lerp(opponent.rotation.z,-turn+sw*.035,1-Math.exp(-dt*9));
opponent.rotation.y=lerp(opponent.rotation.y,turn*.45,1-Math.exp(-dt*9));
if(opponentBones){
 let B=opponentBones;
 if(B.spine){B.spine.rotation.y+=-.32*sw+.46*follow;B.spine.rotation.z+=-.10*sw}
 if(B.clavR){B.clavR.rotation.y+=-.22*sw;B.clavR.rotation.z+=-.12*sw}
 if(B.upperR){B.upperR.rotation.x+=-.62*sw+.28*follow;B.upperR.rotation.y+=-1.00*sw+1.25*hit;B.upperR.rotation.z+=-.55*sw+.72*hit}
 if(B.lowerR){B.lowerR.rotation.x+=-1.05*sw+1.18*hit-.28*follow;B.lowerR.rotation.z+=.20*sw}
 if(B.handR){B.handR.rotation.x+=.18*sw+.42*hit;B.handR.rotation.z+=-.35*sw+.95*hit}
 if(B.upperL){B.upperL.rotation.z+=.26*sw-.20*follow;B.upperL.rotation.y+=.18*sw}
 if(B.lowerL){B.lowerL.rotation.x+=-.32*sw}
 if(B.pelvis){B.pelvis.rotation.y+=-.12*sw+.18*follow}
}
}
let targetOpponentX=0,targetOpponentZ=-9.55;
function updateGame(dt,now){
if(mode==='controller')return;
if(!serving){targetPlayerZ=clamp(ball.position.z>0?ball.position.z+1.05:8.65,6.2,10.25)}else targetPlayerZ=9.55;
let runSpeed=6.1;playerX+=clamp(targetPlayerX-playerX,-runSpeed*dt,runSpeed*dt);playerZ+=clamp(targetPlayerZ-playerZ,-runSpeed*dt,runSpeed*dt);
if(!serving){targetOpponentX=clamp(ball.position.x,-4.15,4.15);targetOpponentZ=clamp(ball.position.z<0?ball.position.z-1.05:-8.65,-10.25,-6.2);opponentX+=clamp(targetOpponentX-opponentX,-5.8*dt,5.8*dt);opponentZ+=clamp(targetOpponentZ-opponentZ,-5.8*dt,5.8*dt)}else{targetOpponentX=0;targetOpponentZ=-9.55}
if(opponent){opponent.position.x=opponentX;opponent.position.z=opponentZ}
updateOpponentMotion(dt);positionFirstPersonRig();
if(playerSwingPhase>0){playerSwingPhase+=dt*3.9;if(playerSwingPhase>=1)playerSwingPhase=0}
if(opponentSwingPhase>0){opponentSwingPhase+=dt*4.0;if(opponentSwingPhase>=1)opponentSwingPhase=0}
if(serving){if(ball)ball.position.set(playerX-.20,EYE_H-.18+Math.sin(now*.002)*.010,playerZ-.58);if(ballShadow)ballShadow.visible=false;return}
let remain=Math.min(dt,.040),h=1/180,steps=0;
while(remain>0&&steps++<8){
 let d=Math.min(h,remain);remain-=d;
 ballVel.y-=9.81*d;
 let speed=ballVel.length(),drag=Math.exp(-.0065*speed*d);ballVel.multiplyScalar(drag);
 if(speed>2){let magnus=new THREE.Vector3().crossVectors(ballSpin,ballVel).multiplyScalar(.00014*d);ballVel.add(magnus)}
 ball.position.addScaledVector(ballVel,d);
 tryLocal(now);tryOpponent(now);
 if(Math.abs(ball.position.z)<.10&&Math.abs(ball.position.x)<6.4&&ball.position.y<.96&&Math.abs(ballVel.z)>1){ballVel.z*=-.10;ballVel.x*=.5;ballVel.y=Math.min(ballVel.y,.2)}
 if(ball.position.y<=BALL_R&&ballVel.y<0){
   let inCourt=Math.abs(ball.position.x)<=HALF_W+.08&&Math.abs(ball.position.z)<=HALF_L+.08;
   if(!inCourt){pointTo(lastHitter==='player'?'opponent':'player');serving=true;break}
   ball.position.y=BALL_R;ballVel.y=-ballVel.y*.73;ballVel.x*=.91;ballVel.z*=.94;ballSpin.multiplyScalar(.82);
   if(ball.position.z>0){bounceNear++;if(bounceNear>1){pointTo('opponent');serving=true;break}}else{bounceFar++;if(bounceFar>1){pointTo('player');serving=true;break}}
 }
}
if(Math.abs(ball.position.x)>9||Math.abs(ball.position.z)>17||ball.position.y<-1){pointTo(lastHitter==='player'?'opponent':'player');serving=true;return}
if(ballShadow){ballShadow.visible=true;ballShadow.position.x=ball.position.x;ballShadow.position.z=ball.position.z;let sh=clamp(1-ball.position.y/4,0.12,1);ballShadow.scale.setScalar(.55+sh*.75);ballShadow.material.opacity=.08+.19*sh}
ballTrail.unshift(ball.position.clone());if(ballTrail.length>14)ballTrail.pop();if(ballTrail.length>1){trailLine.geometry.dispose();trailLine.geometry=new THREE.BufferGeometry().setFromPoints(ballTrail)}
}
function animate(){requestAnimationFrame(animate);let dt=Math.min(.025,clock.getDelta()),now=performance.now();if(playerMixer)playerMixer.update(dt);if(opponentMixer)opponentMixer.update(dt);updateGame(dt,now);updateCamera(dt);renderer.render(scene,camera)}function onResize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}init();
</script></body></html>
